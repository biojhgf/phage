<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            touch-action: none;
        }

        /* ===== Three.js 容器 ===== */
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ===== 桌面覆盖层 ===== */
        #desktop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
            flex-direction: column;
            background-color: #3a6ea5;
            background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a);
            font-size: 14px;
        }
        #desktop-overlay.active {
            display: flex;
        }

        /* ===== 桌面图标 ===== */
        .desktop-icons {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 30px 40px;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
            transition: transform 0.1s;
            padding: 4px;
            touch-action: manipulation;
        }
        .desktop-icon:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }
        .desktop-icon .icon-img {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }
        .desktop-icon .icon-label {
            font-size: 13px;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* ===== 任务栏 ===== */
        .taskbar {
            height: 50px;
            background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%);
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.3);
            border-top: 2px solid #3a7bd5;
            flex-shrink: 0;
            position: relative;
            z-index: 5000;
        }
        .start-button {
            background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%);
            color: #fff;
            padding: 4px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 0 #0a3a0a;
            border: 1px solid #4cb84c;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .start-button:hover {
            background: linear-gradient(180deg, #4cb84c 0%, #2a7a2a 100%);
        }

        #taskbar-items {
            display: flex;
            flex: 1;
            gap: 4px;
            overflow-x: auto;
            margin: 0 10px;
            padding: 2px 0;
        }
        .taskbar-item {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 2px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            transition: background 0.1s;
            touch-action: manipulation;
        }
        .taskbar-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .taskbar-item.active {
            background: rgba(255, 255, 255, 0.35);
            border-color: #fff;
        }

        .taskbar-time {
            margin-left: auto;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #3a7bd5;
            flex-shrink: 0;
        }

        /* ===== 开始菜单 ===== */
        .start-menu {
            display: none;
            position: absolute;
            bottom: 52px;
            left: 8px;
            width: 280px;
            background: #f0f0f0;
            border: 2px solid #3a7bd5;
            border-radius: 8px 8px 0 0;
            padding: 12px 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            z-index: 6000;
        }
        .start-menu.show {
            display: block;
        }
        .start-menu-item {
            padding: 8px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            touch-action: manipulation;
        }
        .start-menu-item:hover {
            background: #3a7bd5;
            color: #fff;
        }
        .start-menu-item .item-icon {
            font-size: 22px;
        }
        .start-menu hr {
            margin: 6px 12px;
            border: 1px solid #ccc;
        }

        /* ===== XP 窗口 ===== */
        .xp-window {
            position: fixed;
            min-width: 320px;
            min-height: 160px;
            background: #ece9d8;
            border: 3px solid #3a6ea5;
            border-radius: 8px 8px 6px 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            font-family: "Segoe UI", Tahoma, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .xp-window .window-titlebar {
            background: linear-gradient(90deg, #0a246a, #3a7bd5);
            color: #fff;
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            font-size: 14px;
            height: 32px;
            touch-action: none;
            cursor: grab;
        }
        .xp-window .window-titlebar:active {
            cursor: grabbing;
        }
        .xp-window .window-titlebar .title-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: default;
        }
        .xp-window .window-titlebar .win-btns {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .xp-window .window-titlebar .win-btns button {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            line-height: 22px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.1s;
            touch-action: manipulation;
        }
        .xp-window .window-titlebar .win-btns button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .xp-window .window-titlebar .win-btns .min-btn:hover {
            background: #5a7ab5;
        }
        .xp-window .window-titlebar .win-btns .max-btn:hover {
            background: #6a8a5a;
        }
        .xp-window .window-titlebar .win-btns .close-btn:hover {
            background: #c00;
        }
        .xp-window .window-body {
            padding: 0;
            flex: 1;
            overflow: hidden;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            touch-action: auto;
        }

        /* ===== 播放器样式 ===== */
        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #f5f0e8, #e8e0d0);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .player-views {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .play-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s;
            background: linear-gradient(135deg, #f0ebe0, #ddd6c8);
        }
        .play-view.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .play-view .cover {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #ccc;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin-bottom: 12px;
            border: 2px solid #fff;
        }
        .play-view .song-info {
            text-align: center;
            margin: 4px 0 8px 0;
        }
        .play-view .song-info .title {
            font-size: 18px;
            font-weight: bold;
            color: #1a1a1a;
        }
        .play-view .song-info .artist {
            font-size: 14px;
            color: #555;
        }
        .play-view .progress-area {
            width: 100%;
            max-width: 360px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-view .progress-area input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #aaa;
            border-radius: 2px;
            outline: none;
        }
        .play-view .progress-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1a4a9f;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .play-view .progress-area .time {
            font-size: 12px;
            color: #444;
            min-width: 40px;
        }
        .play-view .controls {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .play-view .controls button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #333;
            transition: transform 0.1s, color 0.1s;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
        }
        .play-view .controls button:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.8);
        }
        .play-view .controls .play-btn {
            font-size: 36px;
            background: #1a4a9f;
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 74, 159, 0.4);
        }
        .play-view .controls .play-btn:hover {
            background: #245edb;
        }
        .play-view .controls .mode-btn {
            font-size: 18px;
            width: 40px;
            height: 40px;
            background: rgba(200, 200, 200, 0.5);
        }
        .play-view .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            width: 100%;
            max-width: 200px;
        }
        .play-view .volume-row input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #aaa;
            border-radius: 2px;
            outline: none;
        }
        .play-view .volume-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1a4a9f;
            cursor: pointer;
            border: 1px solid #fff;
        }

        .list-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #f5f0e8;
            padding: 10px 0;
            transition: opacity 0.3s;
            touch-action: auto;
        }
        .list-view.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .list-view .song-item {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid #e0d8c8;
            touch-action: manipulation;
        }
        .list-view .song-item:hover {
            background: #e0d8c8;
        }
        .list-view .song-item.active {
            background: #c0d0e0;
        }
        .list-view .song-item .item-cover {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background: #ccc;
            background-size: cover;
            background-position: center;
            margin-right: 14px;
            flex-shrink: 0;
            border: 1px solid #bbb;
        }
        .list-view .song-item .item-info {
            flex: 1;
            overflow: hidden;
        }
        .list-view .song-item .item-info .item-title {
            font-weight: bold;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-view .song-item .item-info .item-artist {
            font-size: 12px;
            color: #666;
        }
        .list-view .song-item .item-duration {
            font-size: 12px;
            color: #888;
        }
        .list-view .loading-text {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .player-toolbar {
            height: 40px;
            background: #ddd6c8;
            border-top: 1px solid #c0b8a8;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
        }
        .player-toolbar .tab-btn {
            background: none;
            border: none;
            padding: 4px 16px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
            color: #444;
            font-weight: bold;
            touch-action: manipulation;
        }
        .player-toolbar .tab-btn.active {
            background: #1a4a9f;
            color: #fff;
        }
        .player-toolbar .tab-btn:hover:not(.active) {
            background: #c0b8a8;
        }
        .player-toolbar .song-counter {
            margin-left: auto;
            font-size: 12px;
            color: #666;
        }

        /* ===== 返回房间 ===== */
        .back-to-room {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 2px solid #aaa;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(4px);
            display: none;
            touch-action: manipulation;
        }
        .back-to-room:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 1s;
            font-family: sans-serif;
        }

        .list-view::-webkit-scrollbar {
            width: 8px;
        }
        .list-view::-webkit-scrollbar-thumb {
            background: #c0b8a8;
            border-radius: 4px;
        }
        .list-view::-webkit-scrollbar-track {
            background: #f0ebe0;
        }

        @media (max-width: 600px) {
            .xp-window {
                min-width: 90vw;
                min-height: 60vh;
            }
            .play-view .cover {
                width: 120px;
                height: 120px;
            }
            .play-view .controls button {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .play-view .controls .play-btn {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Three.js 容器 -->
    <div id="three-container"></div>

    <div id="hint">🖱️ 左右移动鼠标环顾 · 点击电脑屏幕进入桌面</div>

    <!-- 桌面覆盖层 -->
    <div id="desktop-overlay">
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="oc"><span class="icon-img">🧑‍🎤</span><span class="icon-label">我的 OC</span></div>
            <div class="desktop-icon" data-window="gallery"><span class="icon-img">🖼️</span><span class="icon-label">图库</span></div>
            <div class="desktop-icon" data-window="player"><span class="icon-img">🎵</span><span class="icon-label">千千静听</span></div>
            <div class="desktop-icon" data-window="about"><span class="icon-img">📄</span><span class="icon-label">关于</span></div>
            <div class="desktop-icon" data-window="trash"><span class="icon-img">🗑️</span><span class="icon-label">回收站</span></div>
        </div>

        <div class="taskbar">
            <div class="start-button" id="startBtn">🪟 开始</div>
            <div id="taskbar-items"></div>
            <div class="taskbar-time" id="taskbarTime">12:00</div>
        </div>

        <div class="start-menu" id="startMenu">
            <div class="start-menu-item" data-window="oc"><span class="item-icon">🧑‍🎤</span> 我的 OC</div>
            <div class="start-menu-item" data-window="gallery"><span class="item-icon">🖼️</span> 图库</div>
            <div class="start-menu-item" data-window="player"><span class="item-icon">🎵</span> 千千静听</div>
            <div class="start-menu-item" data-window="about"><span class="item-icon">📄</span> 关于</div>
            <div class="start-menu-item" data-window="trash"><span class="item-icon">🗑️</span> 回收站</div>
            <hr />
            <div class="start-menu-item" id="shutdownItem"><span class="item-icon">⏻</span> 返回房间</div>
        </div>
    </div>

    <button class="back-to-room" id="backBtn">🏠 返回房间</button>

    <!-- Three.js -->
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ============================================================
        //  1. Three.js 场景 (完整构建)
        // ============================================================
        import * as THREE from 'three';
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 4);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 灯光
        scene.add(new THREE.AmbientLight(0x404060, 0.8));
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const screenLight = new THREE.PointLight(0x4488ff, 0.8);
        screenLight.position.set(0, 1.2, 1.8);
        scene.add(screenLight);
        const lampLight = new THREE.PointLight(0xffaa55, 0.5);
        lampLight.position.set(-0.8, 1.6, 0.5);
        scene.add(lampLight);

        // 房间
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 地板
        function createWoodTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(90,70,50,${0.1+Math.random()*0.3})`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                const x = Math.random() * 256,
                    y = Math.random() * 256;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 40);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(c);
        }
        const woodTex = createWoodTexture();
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
        woodTex.repeat.set(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        roomGroup.add(floor);

        // 墙壁
        function createWallTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#2a1f1a';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = `rgba(60,45,35,${0.2+Math.random()*0.3})`;
                ctx.fillRect(i * 13, 0, 6, 256);
            }
            return new THREE.CanvasTexture(c);
        }
        const wallTex = createWallTexture();
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        wallTex.repeat.set(3, 2);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9, metalness: 0 });

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        backWall.position.set(0, 1.25, -3);
        roomGroup.add(backWall);
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-3, 1.25, 0);
        roomGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(3, 1.25, 0);
        roomGroup.add(rightWall);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = 3;

        // 海报
        function createPoster(color, x, y, z, rotY) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });

        // 鼠标控制房间旋转
        let rotationY = 0;
        const maxRotation = 0.35;
        document.addEventListener('mousemove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        });
        document.addEventListener('touchmove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        }, { passive: true });

        // 点击屏幕进入桌面
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDesktopActive = false;

        function onPointerDown(event) {
            if (isDesktopActive) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (clientX === undefined) return;
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(clickTargets);
            if (intersects.length > 0) enterDesktop();
        }
        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });

        function enterDesktop() {
            isDesktopActive = true;
            document.getElementById('desktop-overlay').classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('hint').style.opacity = '0';
            updateTime();
            setInterval(updateTime, 10000);
        }

        function exitDesktop() {
            isDesktopActive = false;
            document.getElementById('desktop-overlay').classList.remove('active');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('hint').style.opacity = '1';
            document.querySelectorAll('.xp-window').forEach(w => w.remove());
            document.querySelectorAll('.taskbar-item').forEach(b => b.remove());
            window._windowInstances = {};
            if (window.playerAudio) {
                window.playerAudio.pause();
                window.playerAudio = null;
            }
        }

        document.getElementById('backBtn').addEventListener('click', exitDesktop);
        document.getElementById('shutdownItem').addEventListener('click', exitDesktop);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isDesktopActive) exitDesktop();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('taskbarTime').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        startBtn.addEventListener('click', (e) => { e.stopPropagation();
            startMenu.classList.toggle('show'); });

        startMenu.addEventListener('click', (e) => e.stopPropagation());
        document.querySelectorAll('.start-menu-item[data-window]').forEach(item => {
            item.addEventListener('click', () => {
                const win = item.dataset.window;
                createWindow(win);
                startMenu.classList.remove('show');

        });

        document.querySelectorAll('.desktop-icon[data-window]').forEach(icon => {
            icon.addEventListener('click', () => createWindow(icon.dataset.window));
        });

        // ============================================================
        //  2. 窗口内容定义 (其他窗口)
        // ============================================================
        const windowContents = {
            oc: { title: '🧑‍🎤 我的 OC', content: `<div style="padding:20px;"><h2>角色名称</h2><p>在这里填你的OC信息</p></div>` },
            gallery: { title: '🖼️ 图库', content: `<div style="padding:20px;"><p>图片占位</p></div>` },
            about: { title: '📄 关于', content: `<div style="padding:20px;"><p>复古XP风格页面，使用Three.js</p></div>` },
            trash: { title: '🗑️ 回收站', content: `<div style="padding:20px;"><p>空空如也～</p></div>` }
        };

        // ============================================================
        //  3. ★★★ 音乐播放器 (完整版) ★★★
        // ============================================================
        const PLAYLIST_ID = '374304659'; // 你的新歌单
        let songList = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playMode = 0; // 0: 列表循环, 1: 单曲循环, 2: 随机播放
        const audio = new Audio();
        audio.preload = 'metadata';
        let isPlayerWindowOpen = false;
        let playerWin = null;
        let playerBody = null;

        // 备用歌曲 (可播放)
        const fallbackSongs = [
            { title: '起风了', artist: '买辣椒也用券', cover: 'https://picsum.photos/200/200?random=1', id: '475479888',
            duration: 300000 },
            { title: '光年之外', artist: '邓紫棋', cover: 'https://picsum.photos/200/200?random=2', id: '475479889',
            duration: 280000 },
            { title: '平凡之路', artist: '朴树', cover: 'https://picsum.photos/200/200?random=3', id: '475479890',
            duration: 320000 }
        ];

        function formatTime(ms) {
            if (!ms || isNaN(ms)) return '0:00';
            const seconds = Math.floor(ms / 1000);
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // 获取歌单 (尝试两个API)
        async function fetchPlaylist(id) {
            const apis = [
                `https://api.vvhan.com/api/163/playlist?id=${id}`,
                `https://api.uomg.com/api/163.playlist?mid=${id}&limit=30`
            ];
            for (const url of apis) {
                try {
                    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
                    const data = await res.json();
                    let tracks = null;
                    if (data.code === 200 || data.code === 1) {
                        tracks = data.data?.list || data.playlist?.tracks || data.songs;
                    }
                    if (tracks && tracks.length > 0) {
                        return tracks.map(t => ({
                            title: t.name || t.title || '未知',
                            artist: t.artists ? t.artists.map(a => a.name).join('/') : (t.author || '未知'),
                            cover: t.album?.picUrl || t.pic || '',
                            id: t.id,
                            duration: t.duration || t.dt || 0,
                        }));
                    }
                } catch (e) { console.warn('API失败:', url); }
            }
            return null;
        }

        // 创建播放器窗口
        function createPlayerWindow() {
            if (isPlayerWindowOpen && playerWin) {
                playerWin.style.display = 'flex';
                playerWin.style.zIndex = ++windowZIndex;
                if (window._windowInstances?.player?.taskbarBtn) {
                    window._windowInstances.player.taskbarBtn.remove();
                    window._windowInstances.player.taskbarBtn = null;
                }
                return;
            }
            if (playerWin) { playerWin.remove();
                playerWin = null;
                isPlayerWindowOpen = false; }

            const win = document.createElement('div');
            win.className = 'xp-window';
            win.style.width = '540px';
            win.style.height = '560px';
            win.style.left = '120px';
            win.style.top = '60px';
            win.style.zIndex = ++windowZIndex;

            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">🎵 千千静听</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="max-btn">☐</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = `
                <div class="player-container">
                    <div class="player-views">
                        <div class="play-view" id="playView">
                            <div class="cover" id="coverArt"></div>
                            <div class="song-info">
                                <div class="title" id="songTitle">加载歌单...</div>
                                <div class="artist" id="songArtist">请稍候</div>
                            </div>
                            <div class="progress-area">
                                <span class="time" id="currentTime">0:00</span>
                                <input type="range" id="progressBar" value="0" step="0.1" />
                                <span class="time" id="totalTime">0:00</span>
                            </div>
                            <div class="controls">
                                <button id="prevBtn">⏮</button>
                                <button class="play-btn" id="playBtn">▶</button>
                                <button id="nextBtn">⏭</button>
                                <button class="mode-btn" id="modeBtn" title="切换循环模式">🔁</button>
                            </div>
                            <div class="volume-row">
                                <span style="font-size:16px;">🔊</span>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
                            </div>
                        </div>
                        <div class="list-view hidden" id="listView">
                            <div class="loading-text">⏳ 加载歌单中...</div>
                        </div>
                    </div>
                    <div class="player-toolbar">
                        <button class="tab-btn active" data-view="play">🎵 播放</button>
                        <button class="tab-btn" data-view="list">📋 列表</button>
                        <span class="song-counter" id="songCounter">0 首</span>
                    </div>
                </div>
            `;
            win.appendChild(body);
            document.body.appendChild(win);

            playerWin = win;
            playerBody = body;
            isPlayerWindowOpen = true;
            window._windowInstances = window._windowInstances || {};
            window._windowInstances.player = { window: win, taskbarBtn: null };

            // ---- 窗口控制 ----
            const closeBtn = titlebar.querySelector('.close-btn');
            const minBtn = titlebar.querySelector('.min-btn');
            const maxBtn = titlebar.querySelector('.max-btn');
            let isMaximized = false;
            closeBtn.addEventListener('click', () => { closeWindow('player');
                isPlayerWindowOpen = false;
                audio.pause();
                isPlaying = false; });
            minBtn.addEventListener('click', () => minimizeWindow('player'));
            maxBtn.addEventListener('click', () => {
                if (!isMaximized) {
                    win._prevRect = win.getBoundingClientRect();
                    win.style.left = '0';
                    win.style.top = '0';
                    win.style.width = '100%';
                    win.style.height = '100%';
                    win.style.borderRadius = '0';
                    isMaximized = true;
                    maxBtn.textContent = '❐';
                } else {
                    const rect = win._prevRect || { left: 120, top: 60, width: 540, height: 560 };
                    win.style.left = rect.left + 'px';
                    win.style.top = rect.top + 'px';
                    win.style.width = rect.width + 'px';
                    win.style.height = rect.height + 'px';
                    win.style.borderRadius = '';
                    isMaximized = false;
                    maxBtn.textContent = '☐';
                }
            });

            // ---- 拖拽 (pointer + touch) ----
            let dragData = null;
            const startDrag = (e) => {
                if (e.target.tagName === 'BUTTON') return;
                if (isMaximized) return;
                const clientX = e.clientX || e.touches?.[0]?.clientX;
                const clientY = e.clientY || e.touches?.[0]?.clientY;
                if (clientX === undefined) return;
                const rect = win.getBoundingClientRect();
                dragData = { offsetX: clientX - rect.left, offsetY: clientY - rect.top };
                win.style.left = rect.left + 'px';
                win.style.top = rect.top + 'px';
                win.style.width = rect.width + 'px';
                win.style.height = rect.height + 'px';
                win.style.transform = 'none';
                win.style.zIndex = ++windowZIndex;
                e.preventDefault();
                document.addEventListener('pointermove', onDrag);
                document.addEventListener('pointerup', stopDrag);
                document.addEventListener('pointercancel', stopDrag);
            };
            const onDrag = (e) => {
                if (!dragData) return;
                win.style.left = (e.clientX - dragData.offsetX) + 'px';
                win.style.top = (e.clientY - dragData.offsetY) + 'px';
                e.preventDefault();
            };
            const stopDrag = () => {
                dragData = null;
                document.removeEventListener('pointermove', onDrag);
                document.removeEventListener('pointerup', stopDrag);
                document.removeEventListener('pointercancel', stopDrag);
            };
            titlebar.addEventListener('pointerdown', startDrag);
            titlebar.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'BUTTON') startDrag(e); }, { passive: false });
            win.addEventListener('pointerdown', () => win.style.zIndex = ++windowZIndex);
            win.addEventListener('touchstart', () => win.style.zIndex = ++windowZIndex);

            // ---- 加载歌单 ----
            loadPlaylist();

            win.addEventListener('DOMNodeRemoved', () => {
                if (window._windowInstances?.player) {
                    if (window._windowInstances.player.taskbarBtn) window._windowInstances.player.taskbarBtn.remove();
                    delete window._windowInstances.player;
                }
                isPlayerWindowOpen = false;
                audio.pause();
                isPlaying = false;
            });
        }

        // ---- 加载歌单 ----
        async function loadPlaylist() {
            const listView = playerBody?.querySelector('#listView');
            const counter = playerBody?.querySelector('#songCounter');
            if (listView) listView.innerHTML = '<div class="loading-text">⏳ 正在获取歌单...</div>';

            let data = await fetchPlaylist(PLAYLIST_ID);
            if (!data || data.length === 0) {
                console.warn('歌单获取失败，使用备用歌曲');
                data = fallbackSongs;
                if (listView) listView.innerHTML = `<div class="loading-text">⚠️ 使用示例歌曲 (ID: ${PLAYLIST_ID})</div>`;
            } else {
                if (data.length > 30) data = data.slice(0, 30);
            }

            songList = data;
            if (counter) counter.textContent = `${songList.length} 首`;

            // 渲染列表
            if (listView) {
                listView.innerHTML = songList.map((song, idx) => `
                    <div class="song-item ${idx === currentIndex ? 'active' : ''}" data-index="${idx}">
                        <div class="item-cover" style="background-image: url('${song.cover || ''}');"></div>
                        <div class="item-info">
                            <div class="item-title">${song.title}</div>
                            <div class="item-artist">${song.artist}</div>
                        </div>
                        <div class="item-duration">${formatTime(song.duration)}</div>
                    </div>
                `).join('');
            }

            listView?.querySelectorAll('.song-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.index);
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        loadSong(currentIndex);
                        if (isPlaying) audio.play().catch(() => {});
                    }
                    // 切换到播放视图
                    const tabBtns = playerBody?.querySelectorAll('.tab-btn');
                    tabBtns?.forEach(b => b.classList.remove('active'));
                    playerBody?.querySelector('.tab-btn[data-view="play"]')?.classList.add('active');
                    playerBody?.querySelector('#playView')?.classList.remove('hidden');
                    playerBody?.querySelector('#listView')?.classList.add('hidden');
                });
            });

            currentIndex = 0;
            loadSong(0);
            bindPlayerEvents();
        }

        function loadSong(index) {
            if (!songList.length) return;
            const song = songList[index];
            if (!song) return;
            const url = `https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
            audio.src = url;
            audio.load();

            const cover = playerBody?.querySelector('#coverArt');
            const title = playerBody?.querySelector('#songTitle');
            const artist = playerBody?.querySelector('#songArtist');
            if (cover) cover.style.backgroundImage = `url('${song.cover || ''}')`;
            if (title) title.textContent = song.title;
            if (artist) artist.textContent = song.artist;

            const items = playerBody?.querySelectorAll('.song-item');
            items?.forEach((el, i) => el.classList.toggle('active', i === index));

            const progress = playerBody?.querySelector('#progressBar');
            if (progress) progress.value = 0;
            const curTime = playerBody?.querySelector('#currentTime');
            const totalTime = playerBody?.querySelector('#totalTime');
            if (curTime) curTime.textContent = '0:00';
            if (totalTime) totalTime.textContent = formatTime(song.duration || 0);
        }

        function playPause() {
            if (audio.paused) {
                audio.play().catch(() => {});
                isPlaying = true;
                const btn = playerBody?.querySelector('#playBtn');
                if (btn) btn.textContent = '⏸';
            } else {
                audio.pause();
                isPlaying = false;
                const btn = playerBody?.querySelector('#playBtn');
                if (btn) btn.textContent = '▶';
            }
        }

        function prevSong() {
            if (!songList.length) return;
            if (playMode === 2) { // 随机
                let newIdx;
                do { newIdx = Math.floor(Math.random() * songList.length); } while (newIdx === currentIndex && songList.length > 1);
                currentIndex = newIdx;
            } else {
                currentIndex = (currentIndex - 1 + songList.length) % songList.length;
            }
            loadSong(currentIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        function nextSong() {
            if (!songList.length) return;
            if (playMode === 2) { // 随机
                let newIdx;
                do { newIdx = Math.floor(Math.random() * songList.length); } while (newIdx === currentIndex && songList.length > 1);
                currentIndex = newIdx;
            } else {
                currentIndex = (currentIndex + 1) % songList.length;
            }
            loadSong(currentIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        function toggleMode() {
            playMode = (playMode + 1) % 3;
            const modeBtn = playerBody?.querySelector('#modeBtn');
            if (modeBtn) {
                const labels = ['🔁', '🔂', '🔀'];
                modeBtn.textContent = labels[playMode];
            }
        }

        function bindPlayerEvents() {
            const playBtn = playerBody?.querySelector('#playBtn');
            const prevBtn = playerBody?.querySelector('#prevBtn');
            const nextBtn = playerBody?.querySelector('#nextBtn');
            const modeBtn = playerBody?.querySelector('#modeBtn');
            const progressBar = playerBody?.querySelector('#progressBar');
            const volumeSlider = playerBody?.querySelector('#volumeSlider');
            const currentTimeEl = playerBody?.querySelector('#currentTime');
            const totalTimeEl = playerBody?.querySelector('#totalTime');
            const tabBtns = playerBody?.querySelectorAll('.tab-btn');
            const playView = playerBody?.querySelector('#playView');
            const listView = playerBody?.querySelector('#listView');

            if (playBtn) playBtn.addEventListener('click', playPause);
            if (prevBtn) prevBtn.addEventListener('click', prevSong);
            if (nextBtn) nextBtn.addEventListener('click', nextSong);
            if (modeBtn) {
                modeBtn.textContent = '🔁';
                modeBtn.addEventListener('click', toggleMode);
            }

            // 音量控制
            if (volumeSlider) {
                volumeSlider.addEventListener('input', () => {
                    audio.volume = parseFloat(volumeSlider.value);
                });
                audio.volume = parseFloat(volumeSlider.value) || 0.8;
            }

            // 进度条
            if (progressBar) {
                progressBar.addEventListener('input', () => {
                    if (audio.duration) {
                        const time = (progressBar.value / 100) * audio.duration;
                        audio.currentTime = time;
                    }
                });
            }

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    if (progressBar) progressBar.value = percent;
                    if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime * 1000);
                    if (totalTimeEl) totalTimeEl.textContent = formatTime(audio.duration * 1000);
                }
            });
            audio.addEventListener('loadedmetadata', () => {
                if (totalTimeEl) totalTimeEl.textContent = formatTime(audio.duration * 1000);
            });
            audio.addEventListener('ended', () => {
                if (playMode === 1) { // 单曲循环
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } else {
                    nextSong();
                }
            });

            // 视图切换
            tabBtns?.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const view = btn.dataset.view;
                    if (view === 'play') {
                        playView?.classList.remove('hidden');
                        listView?.classList.add('hidden');
                    } else {
                        playView?.classList.add('hidden');
                        listView?.classList.remove('hidden');
                    }
                });
            });
        }

        // ---- 窗口管理器 (通用) ----
        window.createWindow = function(id) {
            if (id === 'player') { createPlayerWindow(); return; }

            // 其他窗口
            if (window._windowInstances && window._windowInstances[id]?.window) {
                const win = window._windowInstances[id].window;
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                if (window._windowInstances[id].taskbarBtn) {
                    window._windowInstances[id].taskbarBtn.remove();
                    window._windowInstances[id].taskbarBtn = null;
                }
                return;
            }
            const data = windowContents[id];
            if (!data) return;
            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = '460px';
            win.style.left = '120px';
            win.style.top = '80px';
            win.style.zIndex = ++windowZIndex;
            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">${data.title}</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);
            const body = document.createElement('div');
            body.className = 'window-body';
            body.style.padding = '16px 20px';
            body.innerHTML = data.content;
            win.appendChild(body);
            document.body.appendChild(win);
            window._windowInstances = window._windowInstances || {};
            window._windowInstances[id] = { window: win, taskbarBtn: null };

            // 关闭/最小化
            titlebar.querySelector('.close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeWindow(id);
            });
            titlebar.querySelector('.min-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                minimizeWindow(id);
            });

            // 拖拽
            let dragData = null;
            const startDrag = (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const clientX = e.clientX || e.touches?.[0]?.clientX;
                const clientY = e.clientY || e.touches?.[0]?.clientY;
                if (clientX === undefined) return;
                const rect = win.getBoundingClientRect();
                dragData = { offsetX: clientX - rect.left, offsetY: clientY - rect.top };
                win.style.left = rect.left + 'px';
                win.style.top = rect.top + 'px';
                win.style.width = rect.width + 'px';
                win.style.height = rect.height + 'px';
                win.style.transform = 'none';
                win.style.zIndex = ++windowZIndex;
                e.preventDefault();
                document.addEventListener('pointermove', onDrag);
                document.addEventListener('pointerup', stopDrag);
                document.addEventListener('pointercancel', stopDrag);
            };
            const onDrag = (e) => {
                if (!dragData) return;
                win.style.left = (e.clientX - dragData.offsetX) + 'px';
                win.style.top = (e.clientY - dragData.offsetY) + 'px';
                e.preventDefault();
            };
            const stopDrag = () => {
                dragData = null;
                document.removeEventListener('pointermove', onDrag);
                document.removeEventListener('pointerup', stopDrag);
                document.removeEventListener('pointercancel', stopDrag);
            };
            titlebar.addEventListener('pointerdown', startDrag);
            titlebar.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'BUTTON') startDrag(e); }, { passive: false });
            win.addEventListener('pointerdown', () => win.style.zIndex = ++windowZIndex);
            win.addEventListener('touchstart', () => win.style.zIndex = ++windowZIndex);
            win.addEventListener('DOMNodeRemoved', () => {
                if (window._windowInstances && window._windowInstances[id]) {
                    if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                    delete window._windowInstances[id];
                }
            });
        };

        function closeWindow(id) {
            if (window._windowInstances && window._windowInstances[id]) {
                const win = window._windowInstances[id].window;
                if (win) win.remove();
                if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                delete window._windowInstances[id];
                if (id === 'player') {
                    isPlayerWindowOpen = false;
                    playerWin = null;
                    playerBody = null;
                }
            }
        }

        function minimizeWindow(id) {
            const inst = window._windowInstances && window._windowInstances[id];
            if (!inst) return;
            const win = inst.window;
            if (!win) return;
            win.style.display = 'none';
            const taskbarItems = document.getElementById('taskbar-items');
            const btn = document.createElement('div');
            btn.className = 'taskbar-item';
            btn.dataset.windowId = id;
            const title = win.querySelector('.title-text')?.textContent || id;
            btn.textContent = title;
            btn.addEventListener('click', () => {
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                btn.remove();
                inst.taskbarBtn = null;
            });
            taskbarItems.appendChild(btn);
            inst.taskbarBtn = btn;
        }

        window._windowInstances = window._windowInstances || {};
        let windowZIndex = 2000;

        // 响应式
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        document.querySelectorAll('.desktop-icon, .taskbar-item, .start-menu-item').forEach(el => {
            el.addEventListener('dragstart', (e) => e.preventDefault());
        });

        console.log('🖥️ 复古房间加载成功！点击显示器进入桌面。');
        console.log(`🎵 歌单ID: ${PLAYLIST_ID}，正在加载...`);
    </script>
</body>
</html>
