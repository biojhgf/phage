<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>复古房间 · 低多边形小人</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #desktop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
            flex-direction: column;
            background-color: #3a6ea5;
            background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a);
            user-select: none;
            font-size: 14px;
        }
        #desktop-overlay.active { display: flex; }
        .desktop-icons {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 30px 40px;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            text-align: center;
            transition: transform 0.1s;
        }
        .desktop-icon:hover { transform: scale(1.05); background: rgba(255,255,255,0.1); border-radius: 6px; }
        .desktop-icon .icon-img { font-size: 48px; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { font-size: 13px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .taskbar {
            height: 50px;
            background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%);
            display: flex;
            align-items: center;
            padding: 0 12px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.3);
            border-top: 2px solid #3a7bd5;
            flex-shrink: 0;
            position: relative;
        }
        .start-button {
            background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%);
            color: #fff;
            padding: 4px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 0 #0a3a0a;
            border: 1px solid #4cb84c;
            margin-right: 20px;
        }
        .start-button:hover { background: linear-gradient(180deg, #4cb84c 0%, #2a7a2a 100%); }
        .taskbar-time {
            margin-left: auto;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.2);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #3a7bd5;
        }
        .start-menu {
            display: none;
            position: absolute;
            bottom: 52px;
            left: 12px;
            width: 280px;
            background: #f0f0f0;
            border: 2px solid #3a7bd5;
            border-radius: 8px 8px 0 0;
            padding: 12px 0;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .start-menu.show { display: block; }
        .start-menu-item {
            padding: 8px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 22px; }
        .xp-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 90vw;
            max-height: 80vh;
            background: #ece9d8;
            border: 3px solid #3a6ea5;
            border-radius: 8px 8px 6px 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            z-index: 2000;
            overflow: auto;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .xp-window.active { display: flex; }
        .window-titlebar {
            background: linear-gradient(90deg, #0a246a, #3a7bd5);
            color: #fff;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: default;
            flex-shrink: 0;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
        }
        .window-titlebar .close-btn {
            background: #c00;
            color: #fff;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            line-height: 20px;
            text-align: center;
        }
        .window-titlebar .close-btn:hover { background: #e00; }
        .window-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            background: #fff;
            color: #000;
            line-height: 1.6;
        }
        .window-body img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
        .window-body .placeholder-text { color: #888; font-style: italic; }
        .back-to-room {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 2px solid #aaa;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(4px);
            display: none;
        }
        .back-to-room:hover { background: rgba(255,255,255,0.2); }
        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 1s;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="three-container"></div>
    <div id="hint">🖱️ 左右滑动环顾 · 点地板让小人走 · 点屏幕进桌面</div>

    <!-- 桌面覆盖层（同前） -->
    <div id="desktop-overlay">
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="oc"><span class="icon-img">🧑‍🎤</span><span class="icon-label">我的 OC</span></div>
            <div class="desktop-icon" data-window="gallery"><span class="icon-img">🖼️</span><span class="icon-label">图库</span></div>
            <div class="desktop-icon" data-window="about"><span class="icon-img">📄</span><span class="icon-label">关于</span></div>
            <div class="desktop-icon" data-window="trash"><span class="icon-img">🗑️</span><span class="icon-label">回收站</span></div>
        </div>
        <div class="taskbar">
            <div class="start-button" id="startBtn">🪟 开始</div>
            <div class="start-menu" id="startMenu">
                <div class="start-menu-item" data-window="oc"><span class="item-icon">🧑‍🎤</span> 我的 OC</div>
                <div class="start-menu-item" data-window="gallery"><span class="item-icon">🖼️</span> 图库</div>
                <div class="start-menu-item" data-window="about"><span class="item-icon">📄</span> 关于</div>
                <div class="start-menu-item" data-window="trash"><span class="item-icon">🗑️</span> 回收站</div>
                <hr style="margin: 6px 12px; border:1px solid #ccc;" />
                <div class="start-menu-item" id="shutdownItem"><span class="item-icon">⏻</span> 返回房间</div>
            </div>
            <div class="taskbar-time" id="taskbarTime">12:00</div>
        </div>
    </div>
    <button class="back-to-room" id="backBtn">🏠 返回房间</button>
    <div class="xp-window" id="xpWindow">
        <div class="window-titlebar"><span id="windowTitle">窗口</span><button class="close-btn" id="windowClose">✕</button></div>
        <div class="window-body" id="windowBody"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 1. 场景 ----------
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 4);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ---------- 2. 灯光 ----------
        const ambient = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const screenLight = new THREE.PointLight(0x4488ff, 0.8);
        screenLight.position.set(0, 1.2, 1.8);
        scene.add(screenLight);
        const lampLight = new THREE.PointLight(0xffaa55, 0.5);
        lampLight.position.set(-0.8, 1.6, 0.5);
        scene.add(lampLight);

        // ---------- 3. 房间（地板、墙壁、家具）----------
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 地板（标记为地板）
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(90, 70, 50, ${0.1 + Math.random()*0.3})`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }
        const woodTex = createWoodTexture();
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
        woodTex.repeat.set(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        floor.userData.isFloor = true;
        roomGroup.add(floor);

        // 墙壁（略，同前）
        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a1f1a';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = `rgba(60, 45, 35, ${0.2 + Math.random()*0.3})`;
                ctx.fillRect(i*13, 0, 6, 256);
            }
            return new THREE.CanvasTexture(canvas);
        }
        const wallTex = createWallTexture();
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        wallTex.repeat.set(3, 2);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9, metalness: 0 });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        backWall.position.set(0, 1.25, -3);
        roomGroup.add(backWall);
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-3, 1.25, 0);
        roomGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(3, 1.25, 0);
        roomGroup.add(rightWall);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = 3;
        roomGroup.add(ceil);

        // 桌子
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.7, metalness: 0.1 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.8), tableMat);
        tableTop.position.set(0, 0.5, -0.6);
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        roomGroup.add(tableTop);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x3a281c, roughness: 0.8 });
        const legPositions = [[-0.6, -0.3], [0.6, -0.3], [-0.6, 0.3], [0.6, 0.3]];
        legPositions.forEach(([x, z]) => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.45), legMat);
            leg.position.set(x, 0.25, -0.6 + z);
            leg.castShadow = true;
            roomGroup.add(leg);
        });

        // 显示器
        const monitorGroup = new THREE.Group();
        monitorGroup.position.set(0, 0.9, -0.3);
        roomGroup.add(monitorGroup);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.3 });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.15, 16), baseMat);
        base.position.y = -0.08;
        base.castShadow = true;
        monitorGroup.add(base);
        const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.2 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.5), shellMat);
        body.position.set(0, 0.3, 0);
        body.castShadow = true;
        monitorGroup.add(body);
        const backMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
        const backBump = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), backMat);
        backBump.position.set(0, 0.3, -0.28);
        backBump.scale.set(1, 0.85, 0.7);
        backBump.castShadow = true;
        monitorGroup.add(backBump);
        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
        const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.06), bezelMat);
        bezel.position.set(0, 0.3, 0.28);
        monitorGroup.add(bezel);
        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x4488ff,
            emissive: 0x224488,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.0,
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), screenMat);
        screen.position.set(0, 0.3, 0.31);
        monitorGroup.add(screen);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            transparent: true,
            opacity: 0.08,
            roughness: 0.0,
            metalness: 0.9,
        });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), glassMat);
        glass.position.set(0, 0.3, 0.32);
        monitorGroup.add(glass);
        const clickTargets = [screen, glass, bezel];

        // 装饰
        function createPoster(color, x, y, z, rotY) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });
            const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), mat);
            poster.position.set(x, y, z);
            poster.rotation.y = rotY || 0;
            roomGroup.add(poster);
        }
        createPoster(0x8b3a3a, -1.8, 1.8, -2.9, 0);
        createPoster(0x3a6b8b, 1.8, 2.0, -2.9, 0);
        createPoster(0x6b8b3a, -2.9, 1.5, -0.5, Math.PI/2);
        createPoster(0x8b6b3a, 2.9, 1.5, 0.5, -Math.PI/2);
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
        const carpet = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0.3, -0.49, 0.2);
        roomGroup.add(carpet);

        // ---------- 4. 全新低多边形小人 ----------
        const characterGroup = new THREE.Group();
        characterGroup.position.set(0.3, -0.1, 0.6);
        roomGroup.add(characterGroup);

        // ---- 身体（胶囊体：圆柱+两半球） ----
        const bodyColor = 0xe8c4a0;
        const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.1 });
        // 躯干：胶囊形状——用三个几何体拼：中间圆柱 + 上下半球
        const torsoGroup = new THREE.Group();
        const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.35, 8), bodyMat);
        cylinder.position.y = 0.2;
        torsoGroup.add(cylinder);
        const topCap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), bodyMat);
        topCap.position.y = 0.375;
        torsoGroup.add(topCap);
        const bottomCap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), bodyMat);
        bottomCap.position.y = 0.025;
        torsoGroup.add(bottomCap);
        // 稍微压低一点点
        torsoGroup.position.y = 0.05;
        characterGroup.add(torsoGroup);

        // ---- 衣服（套在身体外，半透明分层） ----
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0x2c4a7a, roughness: 0.5, metalness: 0.0 });
        const shirt = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.28, 8), shirtMat);
        shirt.position.set(0, 0.18, 0);
        characterGroup.add(shirt);

        // ---- 头部（椭球） ----
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf0d5b0, roughness: 0.3 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), headMat);
        head.scale.set(1, 1.15, 0.9);
        head.position.set(0, 0.42, 0);
        head.castShadow = true;
        characterGroup.add(head);

        // ---- 眼睛（小椭球，带瞳孔） ----
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
        const eyePos = [[-0.06, 0.45, 0.15], [0.06, 0.45, 0.15]];
        eyePos.forEach(pos => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), eyeWhiteMat);
            eye.scale.set(1, 0.8, 0.6);
            eye.position.set(pos[0], pos[1], pos[2]);
            characterGroup.add(eye);
            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), pupilMat);
            pupil.position.set(pos[0] * 1.15, pos[1] - 0.005, pos[2] + 0.025);
            characterGroup.add(pupil);
        });

        // ---- 头发：黑色长卷发（用圆环+椭圆体组合） ----
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        // 主卷发：用 Torus 环做基础卷曲
        const hairRing = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.025, 8, 12), hairMat);
        hairRing.position.set(0, 0.5, 0.02);
        hairRing.rotation.x = Math.PI / 2.5;
        hairRing.rotation.z = 0.2;
        hairRing.scale.set(1, 1, 0.6);
        characterGroup.add(hairRing);

        // 第二层卷发（更靠后，更大）
        const hairRing2 = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.03, 8, 12), hairMat);
        hairRing2.position.set(0, 0.48, -0.04);
        hairRing2.rotation.x = Math.PI / 3;
        hairRing2.rotation.z = -0.1;
        hairRing2.scale.set(1, 1, 0.5);
        characterGroup.add(hairRing2);

        // 螺旋下降的小椭圆体（模拟卷发丝）
        for (let i = 0; i < 16; i++) {
            const t = i / 16;
            const angle = t * Math.PI * 2 * 3;
            const radius = 0.14 + t * 0.04;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius * 0.5 - 0.06;
            const y = 0.48 + t * 0.25;
            const curl = new THREE.Mesh(new THREE.SphereGeometry(0.025, 5, 5), hairMat);
            curl.scale.set(1, 1.6, 0.7);
            curl.position.set(x, y, z);
            characterGroup.add(curl);
        }

        // 额前碎发（小椭圆体）
        for (let i = 0; i < 6; i++) {
            const t = i / 6;
            const angle = t * Math.PI * 2 * 1.5;
            const radius = 0.07 + t * 0.04;
            const x = Math.sin(angle) * radius * 0.6;
            const z = Math.cos(angle) * radius * 0.3 + 0.12;
            const y = 0.43 + t * 0.06;
            const fringe = new THREE.Mesh(new THREE.SphereGeometry(0.02, 5, 5), hairMat);
            fringe.scale.set(1, 1.4, 0.6);
            fringe.position.set(x, y, z);
            characterGroup.add(fringe);
        }

        // ---- 手臂（胶囊体：圆柱+球） ----
        const armMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.4 });
        const armPos = [[-0.28, 0.28, 0], [0.28, 0.28, 0]];
        armPos.forEach(([x, y, z]) => {
            const armGroup = new THREE.Group();
            // 上臂
            const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.16, 6), armMat);
            upper.position.y = 0.08;
            armGroup.add(upper);
            const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), armMat);
            shoulder.position.y = 0.16;
            armGroup.add(shoulder);
            // 前臂（略细）
            const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.025, 0.14, 6), armMat);
            lower.position.y = -0.06;
            armGroup.add(lower);
            const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), armMat);
            elbow.position.set(0, -0.02, 0);
            armGroup.add(elbow);
            // 手（小球）
            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), armMat);
            hand.position.set(0, -0.15, 0);
            armGroup.add(hand);

            armGroup.position.set(x, y + 0.05, z);
            armGroup.rotation.z = x < 0 ? 0.3 : -0.3;
            armGroup.rotation.x = -0.2;
            characterGroup.add(armGroup);
        });

        // ---- 腿（圆柱+椭球脚） ----
        const legMat = new THREE.MeshStandardMaterial({ color: 0x3a4a6a, roughness: 0.5 });
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 });
        const legPos = [[-0.08, 0, 0.02], [0.08, 0, 0.02]];
        legPos.forEach(([x, y, z]) => {
            const legGroup = new THREE.Group();
            // 大腿
            const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.16, 6), legMat);
            thigh.position.y = 0.08;
            legGroup.add(thigh);
            // 小腿
            const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.14, 6), legMat);
            calf.position.y = -0.06;
            legGroup.add(calf);
            // 脚（半椭球）
            const foot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), shoeMat);
            foot.scale.set(1.1, 0.3, 1.4);
            foot.position.set(0, -0.16, 0.03);
            legGroup.add(foot);

            legGroup.position.set(x, 0.02, z);
            characterGroup.add(legGroup);
        });

        // ---------- 5. 行走逻辑 ----------
        let targetPos = characterGroup.position.clone();
        let isMoving = false;
        const moveSpeed = 0.6;

        // ---------- 6. 交互 ----------
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDesktopActive = false;

        function onPointerDown(event) {
            if (isDesktopActive) return;
            const rect = renderer.domElement.getBoundingClientRect();
            let clientX, clientY;
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
                event.preventDefault();
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const allObjects = [];
            roomGroup.children.forEach(child => {
                if (child === characterGroup) return;
                if (child.isMesh) {
                    allObjects.push(child);
                } else {
                    child.children.forEach(gc => { if (gc.isMesh) allObjects.push(gc); });
                }
            });
            const intersects = raycaster.intersectObjects(allObjects);
            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.object.userData.isFloor) {
                    const localPoint = roomGroup.worldToLocal(hit.point.clone());
                    const limit = 2.5;
                    localPoint.x = Math.max(-limit, Math.min(limit, localPoint.x));
                    localPoint.z = Math.max(-limit, Math.min(limit, localPoint.z));
                    targetPos.set(localPoint.x, -0.1, localPoint.z);
                    isMoving = true;
                    return;
                }
                const isScreen = clickTargets.some(obj => obj === hit.object);
                if (isScreen) {
                    enterDesktop();
                    return;
                }
            }
        }

        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });

        // ---------- 7. 桌面（同前，略写） ----------
        function enterDesktop() {
            isDesktopActive = true;
            document.getElementById('desktop-overlay').classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('hint').style.opacity = '0';
            updateTime();
            setInterval(updateTime, 10000);
        }
        function exitDesktop() {
            isDesktopActive = false;
            document.getElementById('desktop-overlay').classList.remove('active');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('hint').style.opacity = '1';
            document.getElementById('xpWindow').classList.remove('active');
        }
        document.getElementById('backBtn').addEventListener('click', exitDesktop);
        document.getElementById('shutdownItem').addEventListener('click', exitDesktop);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isDesktopActive) exitDesktop(); });
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('taskbarTime').textContent = `${h}:${m}`;
        }

        // 开始菜单和窗口（沿用之前逻辑，略）
        const startBtn = document.getElementById('startBtn');
        const startMenu = document.getElementById('startMenu');
        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startMenu.classList.toggle('show'); });
        document.addEventListener('click', () => { startMenu.classList.remove('show'); });
        startMenu.addEventListener('click', (e) => e.stopPropagation());
        document.querySelectorAll('.start-menu-item[data-window]').forEach(item => {
            item.addEventListener('click', () => {
                openWindow(item.dataset.window);
                startMenu.classList.remove('show');
            });
        });
        document.querySelectorAll('.desktop-icon[data-window]').forEach(icon => {
            icon.addEventListener('click', () => openWindow(icon.dataset.window));
        });

        const xpWindow = document.getElementById('xpWindow');
        const windowTitle = document.getElementById('windowTitle');
        const windowBody = document.getElementById('windowBody');
        const windowClose = document.getElementById('windowClose');
        const windowContents = {
            oc: {
                title: '🧑‍🎤 我的 OC',
                content: `<h2>角色名称</h2><p><strong>名字：</strong>（在这里填你的 OC 名字）</p><p><strong>年龄：</strong>（填年龄）</p><p><strong>简介：</strong>这是一个充满个性的角色。</p><div style="background:#f0f0f0; padding:20px; text-align:center; border-radius:8px; margin:10px 0;">🖼️ 图片占位</div>`
            },
            gallery: {
                title: '🖼️ 图库',
                content: `<h2>图库</h2><p>展示你的 OC 相关图片。</p><div style="display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;"><div style="background:#ddd; width:120px; height:120px; display:flex; align-items:center; justify-content:center; border-radius:8px;">📷 图片1</div><div style="background:#ddd; width:120px; height:120px; display:flex; align-items:center; justify-content:center; border-radius:8px;">📷 图片2</div></div><p class="placeholder-text">替换为你的图片链接</p>`
            },
            about: {
                title: '📄 关于',
                content: `<h2>关于这个页面</h2><p>复古风格的个人展示页，灵感来自 2000 年代的 Windows XP 和 CRT 显示器。</p><p style="color:#888; font-size:12px; margin-top:20px;">Made with ❤️ and Three.js</p>`
            },
            trash: {
                title: '🗑️ 回收站',
                content: `<h2>回收站</h2><p>这里是空的…… 😄</p><p style="color:#aaa; text-align:center; padding:40px 0;">📭</p>`
            }
        };
        function openWindow(id) {
            const data = windowContents[id];
            if (!data) return;
            windowTitle.textContent = data.title;
            windowBody.innerHTML = data.content;
            xpWindow.classList.add('active');
            xpWindow.style.zIndex = 2000;
        }
        windowClose.addEventListener('click', () => xpWindow.classList.remove('active'));

        // 窗口拖拽
        let dragData = null;
        const titlebar = xpWindow.querySelector('.window-titlebar');
        titlebar.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            const rect = xpWindow.getBoundingClientRect();
            dragData = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
            xpWindow.style.transform = 'none';
            xpWindow.style.left = rect.left + 'px';
            xpWindow.style.top = rect.top + 'px';
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        });
        function onDrag(e) {
            if (!dragData) return;
            xpWindow.style.left = (e.clientX - dragData.offsetX) + 'px';
            xpWindow.style.top = (e.clientY - dragData.offsetY) + 'px';
        }
        function stopDrag() {
            dragData = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // ---------- 8. 视角旋转 ----------
        let rotationY = 0;
        const maxRotation = 0.35;
        document.addEventListener('mousemove', (e) => {
            if (isDesktopActive) return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        });
        document.addEventListener('touchmove', (e) => {
            if (isDesktopActive) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        }, { passive: true });

        // ---------- 9. 动画循环 ----------
        let clock = new THREE.Clock();

        function animate() {
            try {
                const delta = clock.getDelta();
                if (isMoving) {
                    const currentPos = characterGroup.position;
                    const dx = targetPos.x - currentPos.x;
                    const dz = targetPos.z - currentPos.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < 0.02) {
                        isMoving = false;
                        currentPos.x = targetPos.x;
                        currentPos.z = targetPos.z;
                    } else {
                        const step = moveSpeed * delta;
                        const ratio = Math.min(1, step / dist);
                        currentPos.x += dx * ratio;
                        currentPos.z += dz * ratio;
                        const angle = Math.atan2(dx, dz);
                        characterGroup.rotation.y = angle;
                    }
                }
                if (isMoving) {
                    const bounce = Math.sin(performance.now() / 150) * 0.015;
                    characterGroup.position.y = -0.1 + bounce;
                } else {
                    characterGroup.position.y = -0.1;
                }
                renderer.render(scene, camera);
            } catch (err) {
                console.error('动画出错:', err);
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('desktop-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('desktop-overlay') || e.target.classList.contains('desktop-icons')) {
                startMenu.classList.remove('show');
            }
        });
        document.querySelectorAll('.desktop-icon, .start-menu-item').forEach(el => {
            el.addEventListener('dragstart', (e) => e.preventDefault());
        });

        console.log('✅ 低多边形小人已加载！点地板让他走。');
    </script>
</body>
</html>
