<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        /* 全局样式（略，与之前相同，完整保留） */
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: 'Press Start 2P', 'Courier New', monospace; background-color: #1a1a1a; }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #desktop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; flex-direction: column; background-color: #3a6ea5; background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a); }
        #desktop-overlay.active { display: flex; }
        #pet-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500; }
        .pet-item { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .pet-item img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); image-rendering: pixelated; pointer-events: none; }
        .pet-item .speech-bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #ece9d8; border: 2px solid #3a6ea5; padding: 4px 10px; font-size: 12px; white-space: pre-wrap; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); display: none; pointer-events: none; max-width: 200px; font-family: 'Press Start 2P', monospace; line-height: 1.4; z-index: 600; }
        .pet-item .speech-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #ece9d8; }
        .pet-bounce { animation: petFloat 1.5s infinite alternate ease-in-out; }
        @keyframes petFloat { 0% { transform: translateY(0px); } 100% { transform: translateY(-6px); } }
        /* 桌面图标、任务栏等样式（与之前相同，此处省略，完整代码中包含） */
        .desktop-icons { flex: 1; padding: 20px 30px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 30px 40px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: center; padding: 4px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; font-size: 10px; }
        .desktop-icon:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); border-radius: 4px; }
        .desktop-icon .icon-img { font-size: 48px; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { font-size: 9px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 2px; }
        .taskbar { height: 50px; background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%); display: flex; align-items: center; padding: 0 8px; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); border-top: 2px solid #3a7bd5; flex-shrink: 0; position: relative; z-index: 5000; }
        .start-button { background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%); color: #fff; padding: 4px 16px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #0a3a0a; border: 1px solid #4cb84c; flex-shrink: 0; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        #taskbar-items { display: flex; flex: 1; gap: 4px; overflow-x: auto; margin: 0 10px; padding: 2px 0; }
        .taskbar-item { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 16px; border-radius: 2px; cursor: pointer; font-size: 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; height: 32px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        .taskbar-item:hover { background: rgba(255,255,255,0.3); }
        .taskbar-time { margin-left: auto; color: #fff; font-size: 12px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 2px; border: 1px solid #3a7bd5; flex-shrink: 0; font-family: 'Press Start 2P', monospace; }
        .start-menu { display: none; position: absolute; bottom: 52px; left: 8px; width: 280px; background: #ece9d8; border: 2px solid #3a6ea5; border-radius: 4px; padding: 12px 0; box-shadow: 6px 6px 0 rgba(0,0,0,0.2); z-index: 6000; }
        .start-menu.show { display: block; }
        .start-menu-item { padding: 6px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 12px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 20px; }
        .start-menu hr { margin: 6px 12px; border: 1px solid #999; }
        .xp-window { position: fixed; min-width: 300px; min-height: 140px; background: #ece9d8; border: 2px solid #3a6ea5; border-radius: 4px; box-shadow: 8px 8px 0 rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; font-family: 'Press Start 2P', monospace; overflow: hidden; touch-action: none; }
        .xp-window .window-titlebar { background: linear-gradient(90deg, #0a246a, #3a7bd5); color: #fff; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 4px 4px 0 0; font-weight: bold; font-size: 12px; height: 36px; touch-action: none; pointer-events: auto; }
        .xp-window .window-titlebar .title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Press Start 2P', monospace; }
        .xp-window .window-titlebar .win-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .xp-window .window-titlebar .win-btns button { width: 30px; height: 30px; border: none; border-radius: 2px; font-weight: bold; font-size: 16px; cursor: pointer; line-height: 26px; text-align: center; background: rgba(255,255,255,0.15); color: #fff; touch-action: manipulation; font-family: 'Press Start 2P', monospace; pointer-events: auto; }
        .xp-window .window-titlebar .win-btns button:hover { background: rgba(255,255,255,0.3); }
        .xp-window .window-titlebar .win-btns .min-btn:hover { background: #5a7ab5; }
        .xp-window .window-titlebar .win-btns .max-btn:hover { background: #6a8a5a; }
        .xp-window .window-titlebar .win-btns .close-btn:hover { background: #c00; }
        .xp-window .window-body { padding: 0; flex: 1; overflow: auto; background: #ece9d8; color: #1a1a1a; display: flex; flex-direction: column; touch-action: auto; }
        .app-container { padding: 16px; flex: 1; background: #ece9d8; overflow: auto; font-family: 'Press Start 2P', monospace; }
        .app-container h2 { margin-top: 0; border-bottom: 2px solid #999; padding-bottom: 4px; font-size: 16px; }
        .app-container button { background: #ddd; border: 2px outset #fff; padding: 4px 12px; cursor: pointer; font-family: 'Press Start 2P', monospace; touch-action: manipulation; font-size: 11px; }
        .app-container button:active { border-style: inset; }
        .app-container input, .app-container textarea, .app-container select { background: #fff; border: 2px inset #ccc; padding: 4px; font-family: 'Press Start 2P', monospace; font-size: 11px; }
        .app-container textarea { width: 100%; resize: vertical; }
        .app-container .item-list { list-style: none; padding: 0; margin: 8px 0; }
        .app-container .item-list li { padding: 4px 8px; border-bottom: 1px solid #ccc; cursor: pointer; font-size: 12px; }
        .app-container .item-list li:hover { background: #d0d0d0; }
        .gallery-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
        .gallery-grid .img-item { position: relative; width: 120px; height: 120px; border: 2px solid #999; border-radius: 2px; overflow: hidden; background: #eee; }
        .gallery-grid .img-item img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
        .gallery-grid .img-item .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(200,0,0,0.8); color: #fff; border: none; border-radius: 2px; cursor: pointer; padding: 2px 6px; font-size: 12px; }
        #hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; color: rgba(255,255,255,0.5); font-size: 12px; background: rgba(0,0,0,0.4); padding: 6px 18px; border-radius: 4px; pointer-events: none; transition: opacity 1s; font-family: 'Press Start 2P', monospace; }
        .xp-modal-overlay { position: fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:9999; backdrop-filter:blur(2px); }
        .xp-modal { background:#ece9d8; border:2px solid #3a6ea5; border-radius:4px; padding:20px 24px; min-width:320px; max-width:90%; box-shadow:8px 8px 0 rgba(0,0,0,0.2); font-family:'Press Start 2P', monospace; }
        .xp-modal h3 { margin:0 0 12px 0; color:#0a246a; font-size:16px; }
        .xp-modal label { display:block; margin:8px 0 4px 0; font-weight:bold; font-size:12px; }
        .xp-modal input[type="text"], .xp-modal input[type="color"] { width:100%; padding:4px; border:2px inset #ccc; background:#fff; font-family:'Press Start 2P', monospace; }
        .xp-modal .modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .xp-modal .modal-btns button { background:#ddd; border:2px outset #fff; padding:4px 16px; cursor:pointer; font-family:'Press Start 2P', monospace; }
        .xp-modal .modal-btns button:active { border-style:inset; }
        .xp-modal .modal-btns .primary { background:#3a7bd5; color:#fff; border-color:#1a4a9f; }
        .wallpaper-preview { width: 100%; height: 80px; border: 2px inset #ccc; background-size: cover; background-position: center; margin: 8px 0; transition: background 0.3s; }
        .tape-player { background: #2a2a2a; border: 2px solid #444; border-radius: 4px; padding: 16px; box-shadow: 4px 4px 0 rgba(0,0,0,0.3); color: #eee; font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; margin: 0 auto; }
        .tape-player .tape-window { background: #0a0a0a; border: 2px solid #444; padding: 8px; display: flex; align-items: center; justify-content: space-between; }
        .tape-player .tape-window .reel { width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #555, #222); border: 2px solid #444; position: relative; }
        .tape-player .tape-window .reel::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: #111; border-radius: 50%; }
        .tape-player .tape-window .reel.spinning { animation: spin 1.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .tape-player .tape-window .tape-info { flex:1; text-align:center; color:#aaa; font-size:10px; padding:0 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
        .tape-player .tape-window .tape-info .song-title { color:#eee; font-weight:bold; font-size:12px; }
        .tape-player .controls { display:flex; gap:8px; justify-content:center; }
        .tape-player .controls button { background:#2a2a2a; border:none; color:#eee; font-size:20px; cursor:pointer; padding:4px 12px; border-radius:2px; box-shadow:0 2px 0 #111; border:1px solid #444; font-family:'Press Start 2P', monospace; }
        .tape-player .controls button:active { transform:translateY(2px); box-shadow:none; }
        .tape-player .controls .play-btn { background:#4a6a3a; border-color:#6a8a5a; }
        .tape-player .progress-bar { display:flex; align-items:center; gap:6px; }
        .tape-player .progress-bar input[type="range"] { flex:1; height:4px; -webkit-appearance:none; background:#444; border-radius:2px; outline:none; }
        .tape-player .progress-bar input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#6a8a5a; cursor:pointer; border:2px solid #eee; }
        .tape-player .progress-bar .time { font-size:10px; color:#aaa; min-width:36px; }
        .tape-player .volume-control { display:flex; align-items:center; gap:6px; justify-content:center; }
        .tape-player .volume-control input[type="range"] { width:80px; height:3px; -webkit-appearance:none; background:#444; border-radius:2px; outline:none; }
        .tape-player .volume-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#6a8a5a; cursor:pointer; border:1px solid #eee; }
        .tape-player .list-toggle { text-align:center; font-size:10px; color:#888; cursor:pointer; border-top:1px solid #444; padding-top:6px; }
        .tape-player .playlist { display:none; background:#1a1a1a; border:1px solid #444; padding:4px; max-height:100px; overflow-y:auto; }
        .tape-player .playlist .pl-item { padding:4px 8px; cursor:pointer; border-bottom:1px solid #333; font-size:10px; color:#aaa; }
        .tape-player .playlist .pl-item:hover { background:#2a2a2a; color:#fff; }
        .tape-player .playlist .pl-item.active { color:#6a8a5a; font-weight:bold; }
        .tape-player .playlist.show { display:block; }
        ::-webkit-scrollbar { width: 12px; background: #ece9d8; }
        ::-webkit-scrollbar-thumb { background: #3a6ea5; border: 2px solid #0a246a; }
        ::-webkit-scrollbar-track { background: #ece9d8; }
        .notion-block { display: flex; align-items: flex-start; gap: 6px; padding: 2px 0; }
        .notion-block .block-type { font-size: 12px; color: #888; min-width: 60px; }
        .notion-block .block-content { flex: 1; }
        .notion-block .block-content input { width: 100%; background: #fff; border: 1px solid #ccc; padding: 2px 4px; font-family: 'Press Start 2P', monospace; font-size: 11px; }
        .notion-block .block-del { cursor: pointer; color: #c00; font-size: 12px; }
        .paint-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        .paint-toolbar button, .paint-toolbar input { font-family: 'Press Start 2P', monospace; font-size: 10px; }
        .paint-canvas-container { position: relative; border: 2px solid #999; background: #fff; touch-action: none; }
        .paint-canvas-container canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }
        .comic-viewer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .comic-viewer .comic-page { max-width: 100%; border: 2px solid #999; }
        .comic-viewer .comic-page img { width: 100%; height: auto; image-rendering: pixelated; }
        .comic-viewer .comic-nav { display: flex; gap: 12px; align-items: center; }
    </style>
</head>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ============================================================
        // 第一部分：弹窗系统（不变）
        // ============================================================
        window.showXpModal = function(options) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'xp-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'xp-modal';
                let fieldsHtml = '';
                if (options.fields) {
                    fieldsHtml = options.fields.map(f =>
                        `<label>${f.label}</label>
                         <input type="${f.type || 'text'}" id="modal_${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" />`
                    ).join('');
                }
                modal.innerHTML = `
                    <h3>${options.title || '提示'}</h3>
                    ${fieldsHtml || `<p>${options.message || ''}</p>`}
                    <div class="modal-btns">
                        ${options.cancelText ? `<button id="modalCancel">${options.cancelText}</button>` : ''}
                        <button class="primary" id="modalConfirm">${options.confirmText || '确定'}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                const confirmBtn = modal.querySelector('#modalConfirm');
                const cancelBtn = modal.querySelector('#modalCancel');

                function cleanup(result) { overlay.remove(); resolve(result); }
                confirmBtn.addEventListener('click', () => {
                    if (options.fields) {
                        const results = {};
                        options.fields.forEach(f => {
                            const input = document.getElementById(`modal_${f.id}`);
                            results[f.id] = input ? input.value : '';
                        });
                        cleanup(results);
                    } else { cleanup(true); }
                });
                if (cancelBtn) cancelBtn.addEventListener('click', () => cleanup(null));
                overlay.addEventListener('click', (e) => { if (e.target === overlay && !cancelBtn) cleanup(null); });
            });
        };

        window.xpPrompt = async function(title, label, placeholder, defaultValue) {
            try {
                const result = await window.showXpModal({
                    title,
                    fields: [{ id: 'input', label, placeholder, value: defaultValue || '' }],
                    confirmText: '确定',
                    cancelText: '取消'
                });
                return result ? result.input : null;
            } catch (e) { return null; }
        };

        window.xpAlert = async function(message) {
            await window.showXpModal({ title: '提示', message, confirmText: '确定' });
        };

        // ============================================================
        // 第二部分：全新宠物系统（针对触摸优化）
        // ============================================================

        // ----- 数据管理 -----
        function getPetData() {
            try { return JSON.parse(localStorage.getItem('myPets') || '[]'); } catch (e) { return []; }
        }

        function savePetData(pets) {
            localStorage.setItem('myPets', JSON.stringify(pets));
            renderPets();
            renderPetListUI();
        }

        let petInstances = [];
        let petAnimationId = null;

        // ----- 渲染宠物（进入桌面时调用） -----
        function renderPets() {
            const container = document.getElementById('pet-container');
            if (!container) return;
            container.innerHTML = '';
            petInstances = [];

            const pets = getPetData();
            if (pets.length === 0) {
                // 如果没有宠物，显示提示（可选）
                return;
            }

            pets.forEach((petData, index) => {
                const el = document.createElement('div');
                el.className = 'pet-item pet-bounce';
                el.style.left = (petData.x ?? 20 + Math.random() * 60) + '%';
                el.style.top = (petData.y ?? 20 + Math.random() * 60) + '%';
                el.dataset.index = index;
                // 添加 touch-action: none 防止浏览器手势干扰
                el.style.touchAction = 'none';

                const bubbleText = petData.dialogs && petData.dialogs.length ? petData.dialogs.join('\n') : '你好！';
                el.innerHTML = `
                    <img src="${petData.img}" alt="${petData.name}" />
                    <div class="speech-bubble">${bubbleText}</div>
                `;
                container.appendChild(el);

                const instance = {
                    el: el,
                    data: petData,
                    dx: (Math.random() - 0.5) * 2,
                    dy: (Math.random() - 0.5) * 2,
                    speed: 0.2 + Math.random() * 0.3,
                    isDragging: false,
                    dragOffsetX: 0,
                    dragOffsetY: 0,
                };
                petInstances.push(instance);

                const bubble = el.querySelector('.speech-bubble');

                // ---- 事件绑定（同时支持鼠标和触摸） ----
                // 点击/触摸显示台词
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dialogs = instance.data.dialogs;
                    if (dialogs && dialogs.length) {
                        const idx = Math.floor(Math.random() * dialogs.length);
                        bubble.textContent = dialogs[idx];
                    } else {
                        bubble.textContent = '你好！';
                    }
                    bubble.style.display = 'block';
                    if (window._petBubbleTimer) clearTimeout(window._petBubbleTimer);
                    window._petBubbleTimer = setTimeout(() => {
                        bubble.style.display = 'none';
                    }, 3000);
                });

                // 拖拽（使用 pointer events，兼容触摸）
                const onPointerDown = (e) => {
                    if (e.target.tagName === 'IMG' || e.target === el) {
                        e.stopPropagation();
                        const rect = el.getBoundingClientRect();
                        instance.isDragging = true;
                        // 计算偏移（相对于元素左上角）
                        instance.dragOffsetX = e.clientX - rect.left;
                        instance.dragOffsetY = e.clientY - rect.top;
                        el.style.cursor = 'grabbing';
                        el.classList.remove('pet-bounce');
                        el.setPointerCapture(e.pointerId);
                        e.preventDefault();
                        bubble.style.display = 'none';
                    }
                };

                const onPointerMove = (e) => {
                    if (!instance.isDragging) return;
                    const containerRect = container.getBoundingClientRect();
                    let newX = ((e.clientX - instance.dragOffsetX - containerRect.left) / containerRect.width) * 100;
                    let newY = ((e.clientY - instance.dragOffsetY - containerRect.top) / containerRect.height) * 100;
                    newX = Math.min(95, Math.max(5, newX));
                    newY = Math.min(95, Math.max(5, newY));
                    el.style.left = newX + '%';
                    el.style.top = newY + '%';
                    instance.data.x = newX;
                    instance.data.y = newY;
                    // 实时保存位置
                    const allPets = getPetData();
                    const idx = parseInt(el.dataset.index);
                    if (allPets[idx]) {
                        allPets[idx].x = newX;
                        allPets[idx].y = newY;
                        localStorage.setItem('myPets', JSON.stringify(allPets));
                    }
                    e.preventDefault();
                };

                const onPointerUp = (e) => {
                    if (instance.isDragging) {
                        instance.isDragging = false;
                        el.style.cursor = 'grab';
                        el.classList.add('pet-bounce');
                        el.releasePointerCapture(e.pointerId);
                    }
                };

                el.addEventListener('pointerdown', onPointerDown);
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
                el.addEventListener('pointercancel', onPointerUp);

                instance._cleanup = () => {
                    el.removeEventListener('pointerdown', onPointerDown);
                    el.removeEventListener('pointermove', onPointerMove);
                    el.removeEventListener('pointerup', onPointerUp);
                    el.removeEventListener('pointercancel', onPointerUp);
                };
            });

            // 启动动画
            if (petAnimationId) cancelAnimationFrame(petAnimationId);
            if (petInstances.length > 0) {
                petAnimationId = requestAnimationFrame(animatePets);
            }
        }

        // ----- 宠物自动移动动画 -----
        function animatePets() {
            const container = document.getElementById('pet-container');
            if (!container) {
                petAnimationId = requestAnimationFrame(animatePets);
                return;
            }

            const containerWidth = container.offsetWidth || 1;
            const containerHeight = container.offsetHeight || 1;

            petInstances.forEach(inst => {
                if (inst.isDragging) return;

                if (Math.random() < 0.005) {
                    inst.dx = (Math.random() - 0.5) * 2;
                    inst.dy = (Math.random() - 0.5) * 2;
                    const len = Math.sqrt(inst.dx * inst.dx + inst.dy * inst.dy);
                    if (len > 0) { inst.dx /= len;
                        inst.dy /= len; }
                }

                const speedPx = inst.speed;
                let deltaX = inst.dx * speedPx;
                let deltaY = inst.dy * speedPx;
                let deltaXPercent = (deltaX / containerWidth) * 100;
                let deltaYPercent = (deltaY / containerHeight) * 100;

                let left = parseFloat(inst.el.style.left) || 20;
                let top = parseFloat(inst.el.style.top) || 20;

                let newLeft = left + deltaXPercent;
                let newTop = top + deltaYPercent;

                const margin = 5;
                if (newLeft < margin) { newLeft = margin;
                    inst.dx = -inst.dx; }
                if (newLeft > 100 - margin) { newLeft = 100 - margin;
                    inst.dx = -inst.dx; }
                if (newTop < margin) { newTop = margin;
                    inst.dy = -inst.dy; }
                if (newTop > 100 - margin) { newTop = 100 - margin;
                    inst.dy = -inst.dy; }

                inst.el.style.left = newLeft + '%';
                inst.el.style.top = newTop + '%';
                inst.data.x = newLeft;
                inst.data.y = newTop;
            });

            petAnimationId = requestAnimationFrame(animatePets);
        }

        // ----- 设置面板中的宠物列表 -----
        function renderPetListUI() {
            const list = document.getElementById('petList');
            if (!list) return;
            const pets = getPetData();
            list.innerHTML = '';
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;">暂无宠物</p>';
                return;
            }
            pets.forEach((pet, idx) => {
                const div = document.createElement('div');
                div.style.borderBottom = '1px solid #ddd';
                div.style.padding = '6px 0';
                div.innerHTML = `
                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                        <img src="${pet.img}" style="width:40px; height:40px; object-fit:cover; border:1px solid #999; image-rendering:pixelated;" />
                        <span style="font-weight:bold;">${pet.name}</span>
                        <button onclick="window.editPetName(${idx})">✏️ 名称</button>
                        <button onclick="window.editPetImage(${idx})">🖼️ 换图</button>
                        <button onclick="window.editPetDialogs(${idx})">💬 对话</button>
                        <button onclick="window.deletePet(${idx})" style="color:red;">✕</button>
                    </div>
                    <div style="font-size:10px; color:#666; margin-top:2px; white-space:pre-wrap;">
                        对话: ${pet.dialogs && pet.dialogs.length ? pet.dialogs.join(' | ') : '(未设置)'}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // ----- 全局编辑函数 -----
        window.editPetName = async function(idx) {
            const pets = getPetData();
            const pet = pets[idx];
            if (!pet) return;
            const newName = await window.xpPrompt('编辑名称', '新名称：', '', pet.name);
            if (newName !== null) { pet.name = newName;
                savePetData(pets); }
        };
        window.editPetImage = async function(idx) {
            const pets = getPetData();
            const pet = pets[idx];
            if (!pet) return;
            const newImg = await window.xpPrompt('图片URL', 'URL：', '', pet.img);
            if (newImg !== null) { pet.img = newImg;
                savePetData(pets); }
        };
        window.editPetDialogs = async function(idx) {
            const pets = getPetData();
            const pet = pets[idx];
            if (!pet) return;
            const current = pet.dialogs ? pet.dialogs.join('\n') : '';
            const result = await window.showXpModal({
                title: '编辑对话（每行一句）',
                fields: [{ id: 'dialogs', label: '对话内容（每行一句，换行分隔）', type: 'text', value: current,
                    placeholder: '你好呀！\n今天天气真好\n...' }],
                confirmText: '保存',
                cancelText: '取消'
            });
            if (result) {
                const lines = result.dialogs.split('\n').map(s => s.trim()).filter(s => s);
                pet.dialogs = lines.length ? lines : ['你好！'];
                savePetData(pets);
            }
        };
        window.deletePet = async function(idx) {
            const confirm = await window.showXpModal({ title: '确认删除', message: '确定删除此宠物？', confirmText: '删除',
                cancelText: '取消' });
            if (!confirm) return;
            const pets = getPetData();
            pets.splice(idx, 1);
            savePetData(pets);
        };

        // ============================================================
        // 第三部分：窗口管理（直接绑定，适合触摸）
        // ============================================================
        let windowZIndex = 2000;
        window._windowInstances = {};

        function createWindow(id, title, contentHtml, width = 500, height = 400) {
            if (window._windowInstances[id]) {
                const win = window._windowInstances[id];
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                const btn = document.querySelector(`.taskbar-item[data-window-id="${id}"]`);
                if (btn) btn.remove();
                return;
            }

            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.left = (80 + Math.random() * 80) + 'px';
            win.style.top = (50 + Math.random() * 80) + 'px';
            win.style.zIndex = ++windowZIndex;
            win.style.touchAction = 'none'; // 防止触摸滚动干扰

            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">${title}</span>
                <div class="win-btns">
                    <button class="min-btn" data-action="min">─</button>
                    <button class="max-btn" data-action="max">☐</button>
                    <button class="close-btn" data-action="close">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = contentHtml;
            win.appendChild(body);
            document.body.appendChild(win);
            window._windowInstances[id] = win;

            const minBtn = titlebar.querySelector('.min-btn');
            const maxBtn = titlebar.querySelector('.max-btn');
            const closeBtn = titlebar.querySelector('.close-btn');

            // 按钮事件
            minBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                win.style.display = 'none';
                const taskbar = document.getElementById('taskbar-items');
                const btn = document.createElement('div');
                btn.className = 'taskbar-item';
                btn.dataset.windowId = id;
                btn.textContent = title;
                btn.addEventListener('click', () => {
                    win.style.display = 'flex';
                    win.style.zIndex = ++windowZIndex;
                    btn.remove();
                });
                taskbar.appendChild(btn);
            });

            let isMaximized = false;
            maxBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isMaximized) {
                    win._prevRect = win.getBoundingClientRect();
                    win.style.left = '0';
                    win.style.top = '0';
                    win.style.width = '100%';
                    win.style.height = '100%';
                    win.style.borderRadius = '0';
                    isMaximized = true;
                    maxBtn.textContent = '❐';
                } else {
                    const rect = win._prevRect || { left: 100, top: 60, width: 460, height: 300 };
                    win.style.left = rect.left + 'px';
                    win.style.top = rect.top + 'px';
                    win.style.width = rect.width + 'px';
                    win.style.height = rect.height + 'px';
                    win.style.borderRadius = '';
                    isMaximized = false;
                    maxBtn.textContent = '☐';
                }
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                win.remove();
                delete window._windowInstances[id];
                const btn = document.querySelector(`.taskbar-item[data-window-id="${id}"]`);
                if (btn) btn.remove();
            });

            // 点击窗口提升层级
            win.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.win-btns')) return;
                win.style.zIndex = ++windowZIndex;
            });

            // 拖拽（标题栏）
            let dragData = null;
            const onDragStart = (e) => {
                if (e.target.closest('button')) return;
                const rect = win.getBoundingClientRect();
                dragData = {
                    startX: e.clientX,
                    startY: e.clientY,
                    left: rect.left,
                    top: rect.top
                };
                win.style.cursor = 'grabbing';
                document.addEventListener('pointermove', onDragMove);
                document.addEventListener('pointerup', onDragEnd);
                e.preventDefault();
            };
            const onDragMove = (e) => {
                if (!dragData) return;
                const dx = e.clientX - dragData.startX;
                const dy = e.clientY - dragData.startY;
                let newLeft = Math.max(0, dragData.left + dx);
                let newTop = Math.max(0, dragData.top + dy);
                newLeft = Math.min(window.innerWidth - win.offsetWidth, newLeft);
                newTop = Math.min(window.innerHeight - win.offsetHeight, newTop);
                win.style.left = newLeft + 'px';
                win.style.top = newTop + 'px';
            };
            const onDragEnd = () => {
                dragData = null;
                win.style.cursor = '';
                document.removeEventListener('pointermove', onDragMove);
                document.removeEventListener('pointerup', onDragEnd);
            };
            titlebar.addEventListener('pointerdown', onDragStart);

            return win;
        }
