<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局像素风格 ===== */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background-color: #1a1a1a;
        }
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #desktop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
            flex-direction: column;
            background-color: #3a6ea5;
            background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a);
            font-size: 14px;
            transition: background 0.3s;
        }
        #desktop-overlay.active {
            display: flex;
        }
        #desktop-pets {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }
        #desktop-pets .pet {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            user-select: none;
            animation: petBounce 2s infinite alternate ease-in-out;
        }
        #desktop-pets .pet:active {
            cursor: grabbing;
            animation: none;
        }
        #desktop-pets .pet img {
            max-width: 100px;
            max-height: 100px;
            display: block;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            image-rendering: pixelated;
        }
        #desktop-pets .pet .bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #ece9d8;
            border: 2px solid #3a6ea5;
            padding: 4px 10px;
            font-size: 12px;
            white-space: pre-wrap;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
            display: none;
            pointer-events: none;
            max-width: 200px;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.4;
        }
        #desktop-pets .pet .bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #ece9d8;
        }
        @keyframes petBounce {
            0% {
                transform: translate(-50%, -50%) translateY(0px);
            }
            100% {
                transform: translate(-50%, -50%) translateY(-8px);
            }
        }
        .desktop-icons {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 30px 40px;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
            padding: 4px;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
        }
        .desktop-icon:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .desktop-icon .icon-img {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }
        .desktop-icon .icon-label {
            font-size: 9px;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 2px;
        }
        .taskbar {
            height: 50px;
            background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%);
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.3);
            border-top: 2px solid #3a7bd5;
            flex-shrink: 0;
            position: relative;
            z-index: 5000;
        }
        .start-button {
            background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%);
            color: #fff;
            padding: 4px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 0 #0a3a0a;
            border: 1px solid #4cb84c;
            flex-shrink: 0;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
        }
        #taskbar-items {
            display: flex;
            flex: 1;
            gap: 4px;
            overflow-x: auto;
            margin: 0 10px;
            padding: 2px 0;
        }
        .taskbar-item {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 2px 16px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
        }
        .taskbar-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .taskbar-time {
            margin-left: auto;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 12px;
            border-radius: 2px;
            border: 1px solid #3a7bd5;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
        }
        .start-menu {
            display: none;
            position: absolute;
            bottom: 52px;
            left: 8px;
            width: 280px;
            background: #ece9d8;
            border: 2px solid #3a6ea5;
            border-radius: 4px;
            padding: 12px 0;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.2);
            z-index: 6000;
        }
        .start-menu.show {
            display: block;
        }
        .start-menu-item {
            padding: 6px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
        }
        .start-menu-item:hover {
            background: #3a7bd5;
            color: #fff;
        }
        .start-menu-item .item-icon {
            font-size: 20px;
        }
        .start-menu hr {
            margin: 6px 12px;
            border: 1px solid #999;
        }
        .xp-window {
            position: fixed;
            min-width: 300px;
            min-height: 140px;
            background: #ece9d8;
            border: 2px solid #3a6ea5;
            border-radius: 4px;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            touch-action: none;
        }
        .xp-window .window-titlebar {
            background: linear-gradient(90deg, #0a246a, #3a7bd5);
            color: #fff;
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-radius: 4px 4px 0 0;
            font-weight: bold;
            font-size: 12px;
            height: 36px;
            touch-action: none;
            pointer-events: auto;
        }
        .xp-window .window-titlebar .title-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Press Start 2P', monospace;
        }
        .xp-window .window-titlebar .win-btns {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .xp-window .window-titlebar .win-btns button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 2px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            line-height: 26px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
            pointer-events: auto;
        }
        .xp-window .window-titlebar .win-btns button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .xp-window .window-titlebar .win-btns .min-btn:hover {
            background: #5a7ab5;
        }
        .xp-window .window-titlebar .win-btns .max-btn:hover {
            background: #6a8a5a;
        }
        .xp-window .window-titlebar .win-btns .close-btn:hover {
            background: #c00;
        }
        .xp-window .window-body {
            padding: 0;
            flex: 1;
            overflow: auto;
            background: #ece9d8;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            touch-action: auto;
        }
        .app-container {
            padding: 16px;
            flex: 1;
            background: #ece9d8;
            overflow: auto;
            font-family: 'Press Start 2P', monospace;
        }
        .app-container h2 {
            margin-top: 0;
            border-bottom: 2px solid #999;
            padding-bottom: 4px;
            font-size: 16px;
        }
        .app-container button {
            background: #ddd;
            border: 2px outset #fff;
            padding: 4px 12px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            touch-action: manipulation;
            font-size: 11px;
        }
        .app-container button:active {
            border-style: inset;
        }
        .app-container input,
        .app-container textarea,
        .app-container select {
            background: #fff;
            border: 2px inset #ccc;
            padding: 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
        }
        .app-container textarea {
            width: 100%;
            resize: vertical;
        }
        .app-container .item-list {
            list-style: none;
            padding: 0;
            margin: 8px 0;
        }
        .app-container .item-list li {
            padding: 4px 8px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            font-size: 12px;
        }
        .app-container .item-list li:hover {
            background: #d0d0d0;
        }
        .app-container .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .editable-content {
            outline: none;
            min-height: 60px;
            padding: 8px;
            background: #ece9d8;
            border: 1px dashed #999;
        }
        .editable-content:focus {
            border-color: #3a6ea5;
            background: #f5f0e8;
        }
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .gallery-grid .img-item {
            position: relative;
            width: 120px;
            height: 120px;
            border: 2px solid #999;
            border-radius: 2px;
            overflow: hidden;
            background: #eee;
        }
        .gallery-grid .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        .gallery-grid .img-item .del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(200, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
        }
        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 4px;
            pointer-events: none;
            transition: opacity 1s;
            font-family: 'Press Start 2P', monospace;
        }
        .xp-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(2px);
        }
        .xp-modal {
            background: #ece9d8;
            border: 2px solid #3a6ea5;
            border-radius: 4px;
            padding: 20px 24px;
            min-width: 320px;
            max-width: 90%;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2);
            font-family: 'Press Start 2P', monospace;
        }
        .xp-modal h3 {
            margin: 0 0 12px 0;
            color: #0a246a;
            font-size: 16px;
        }
        .xp-modal label {
            display: block;
            margin: 8px 0 4px 0;
            font-weight: bold;
            font-size: 12px;
        }
        .xp-modal input[type="text"],
        .xp-modal input[type="color"] {
            width: 100%;
            padding: 4px;
            border: 2px inset #ccc;
            background: #fff;
            font-family: 'Press Start 2P', monospace;
        }
        .xp-modal .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .xp-modal .modal-btns button {
            background: #ddd;
            border: 2px outset #fff;
            padding: 4px 16px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
        }
        .xp-modal .modal-btns button:active {
            border-style: inset;
        }
        .xp-modal .modal-btns .primary {
            background: #3a7bd5;
            color: #fff;
            border-color: #1a4a9f;
        }
        .wallpaper-preview {
            width: 100%;
            height: 80px;
            border: 2px inset #ccc;
            background-size: cover;
            background-position: center;
            margin: 8px 0;
            transition: background 0.3s;
        }

        /* 磁带播放器（像素风） */
        .tape-player {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 16px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
            color: #eee;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .tape-player .tape-window {
            background: #0a0a0a;
            border: 2px solid #444;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tape-player .tape-window .reel {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #555, #222);
            border: 2px solid #444;
            position: relative;
        }
        .tape-player .tape-window .reel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #111;
            border-radius: 50%;
        }
        .tape-player .tape-window .reel.spinning {
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        .tape-player .tape-window .tape-info {
            flex: 1;
            text-align: center;
            color: #aaa;
            font-size: 10px;
            padding: 0 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .tape-player .tape-window .tape-info .song-title {
            color: #eee;
            font-weight: bold;
            font-size: 12px;
        }
        .tape-player .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .tape-player .controls button {
            background: #2a2a2a;
            border: none;
            color: #eee;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 2px;
            box-shadow: 0 2px 0 #111;
            border: 1px solid #444;
            font-family: 'Press Start 2P', monospace;
        }
        .tape-player .controls button:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .tape-player .controls .play-btn {
            background: #4a6a3a;
            border-color: #6a8a5a;
        }
        .tape-player .progress-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tape-player .progress-bar input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #444;
            border-radius: 2px;
            outline: none;
        }
        .tape-player .progress-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6a8a5a;
            cursor: pointer;
            border: 2px solid #eee;
        }
        .tape-player .progress-bar .time {
            font-size: 10px;
            color: #aaa;
            min-width: 36px;
        }
        .tape-player .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }
        .tape-player .volume-control input[type="range"] {
            width: 80px;
            height: 3px;
            -webkit-appearance: none;
            background: #444;
            border-radius: 2px;
            outline: none;
        }
        .tape-player .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6a8a5a;
            cursor: pointer;
            border: 1px solid #eee;
        }
        .tape-player .list-toggle {
            text-align: center;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            border-top: 1px solid #444;
            padding-top: 6px;
        }
        .tape-player .playlist {
            display: none;
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
        .tape-player .playlist .pl-item {
            padding: 4px 8px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 10px;
            color: #aaa;
        }
        .tape-player .playlist .pl-item:hover {
            background: #2a2a2a;
            color: #fff;
        }
        .tape-player .playlist .pl-item.active {
            color: #6a8a5a;
            font-weight: bold;
        }
        .tape-player .playlist.show {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 12px;
            background: #ece9d8;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a6ea5;
            border: 2px solid #0a246a;
        }
        ::-webkit-scrollbar-track {
            background: #ece9d8;
        }

        /* Notion 风格OC */
        .notion-editor {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .notion-block {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 2px 0;
        }
        .notion-block .block-type {
            font-size: 12px;
            color: #888;
            min-width: 60px;
        }
        .notion-block .block-content {
            flex: 1;
        }
        .notion-block .block-content input,
        .notion-block .block-content textarea {
            width: 100%;
            background: #fff;
            border: 1px solid #ccc;
            padding: 2px 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
        }
        .notion-block .block-del {
            cursor: pointer;
            color: #c00;
            font-size: 12px;
        }
        .paint-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .paint-toolbar button,
        .paint-toolbar input {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
        }
        .paint-canvas-container {
            position: relative;
            border: 2px solid #999;
            background: #fff;
            touch-action: none;
        }
        .paint-canvas-container canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            touch-action: none;
        }
        .comic-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .comic-viewer .comic-page {
            max-width: 100%;
            border: 2px solid #999;
        }
        .comic-viewer .comic-page img {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        .comic-viewer .comic-nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="three-container"></div>
    <div id="hint">🖱️ 点击电脑屏幕进入桌面 · 按 ESC 返回</div>
    <div id="desktop-pets"></div>

    <div id="desktop-overlay">
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="oc"><span class="icon-img">🧑‍🎤</span><span class="icon-label">OC</span></div>
            <div class="desktop-icon" data-window="gallery"><span class="icon-img">🖼️</span><span class="icon-label">图库</span></div>
            <div class="desktop-icon" data-window="paint"><span class="icon-img">🎨</span><span class="icon-label">画图</span></div>
            <div class="desktop-icon" data-window="comic"><span class="icon-img">📚</span><span class="icon-label">漫画</span></div>
            <div class="desktop-icon" data-window="player"><span class="icon-img">🎵</span><span class="icon-label">千千静听</span></div>
            <div class="desktop-icon" data-window="writing"><span class="icon-img">📝</span><span class="icon-label">写作工坊</span></div>
            <div class="desktop-icon" data-window="chat"><span class="icon-img">💬</span><span class="icon-label">聊天室</span></div>
            <div class="desktop-icon" data-window="blog"><span class="icon-img">📖</span><span class="icon-label">个人博客</span></div>
            <div class="desktop-icon" data-window="settings"><span class="icon-img">⚙️</span><span class="icon-label">设置</span></div>

    <script type="module">
        // ============================================================
        //  1. Three.js 场景（完整构建）
        // ============================================================

        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        scene.add(new THREE.AmbientLight(0x404060, 0.8));
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const screenLight = new THREE.PointLight(0x4488ff, 0.8);
        screenLight.position.set(0, 1.2, 1.8);

        const lampLight = new THREE.PointLight(0xffaa55, 0.5);
        lampLight.position.set(-0.8, 1.6, 0.5);
        scene.add(lampLight);

        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 地板
        const woodTex = (() => {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(90,70,50,${0.1 + Math.random() * 0.3})`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                const x = Math.random() * 256,
                    y = Math.random() * 256;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 40);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(c);
        })();
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
        woodTex.repeat.set(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
        floor.rotation.x = -Math.PI / 2;

        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });

        const monitorGroup = new THREE.Group();

        base.position.y = -0.08;
        base.castShadow = true;
        monitorGroup.add(base);
        const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.2 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.5), shellMat);
        body.position.set(0, 0.3, 0);
        body.castShadow = true;
        monitorGroup.add(body);
        const backMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
        const backBump = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), backMat);
        backBump.position.set(0, 0.3, -0.28);
        backBump.scale.set(1, 0.85, 0.7);
        backBump.castShadow = true;
        monitorGroup.add(backBump);
        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
        const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.06), bezelMat);
        bezel.position.set(0, 0.3, 0.28);
        monitorGroup.add(bezel);
        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x4488ff,
            emissive: 0x224488,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.0,
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), screenMat);
        screen.position.set(0, 0.3, 0.31);
        monitorGroup.add(screen);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            transparent: true,

            roughness: 0.0,
            metalness: 0.9,
        });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), glassMat);
        glass.position.set(0, 0.3, 0.32);
        monitorGroup.add(glass);
        const clickTargets = [screen, glass, bezel];

        function createPoster(color, x, y, z, rotY) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });
            const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), mat);
            poster.position.set(x, y, z);
            poster.rotation.y = rotY || 0;
            roomGroup.add(poster);
        }
        createPoster(0x8b3a3a, -1.8, 1.8, -2.9, 0);
        createPoster(0x3a6b8b, 1.8, 2.0, -2.9, 0);
        createPoster(0x6b8b3a, -2.9, 1.5, -0.5, Math.PI / 2);
        createPoster(0x8b6b3a, 2.9, 1.5, 0.5, -Math.PI / 2);
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
        const carpet = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0.3, -0.49, 0.2);
        roomGroup.add(carpet);

        let rotationY = 0;
        const maxRotation = 0.35;
        document.addEventListener('mousemove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        });
        document.addEventListener('touchmove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        }, { passive: true });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDesktopActive = false;

        // ============================================================
        //  全局工具：壁纸 / CSS / 宠物（提前定义，解决初始化顺序）
        // ============================================================
        function loadWallpaper() {
            try {
                const data = localStorage.getItem('wallpaper');
                const overlay = document.getElementById('desktop-overlay');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed.type === 'image' && parsed.data) {
                        overlay.style.backgroundImage = `url(${parsed.data})`;
                        overlay.style.backgroundSize = 'cover';
                        overlay.style.backgroundPosition = 'center';
                        overlay.style.backgroundColor = '';
                    } else if (parsed.type === 'color' && parsed.color) {
                        overlay.style.backgroundImage = '';
                        overlay.style.backgroundColor = parsed.color;
                    }
                }
            } catch (e) { /* 静默失败 */ }
        }

        function loadGlobalCss() {
            try {
                const saved = localStorage.getItem('globalCss');
                const styleTag = document.getElementById('global-custom-style') || (() => {
                    const s = document.createElement('style');
                    s.id = 'global-custom-style';
                    document.head.appendChild(s);
                    return s;
                })();
                if (saved) styleTag.textContent = saved;
                else styleTag.textContent = '';
            } catch (e) { /* 静默失败 */ }
        }

        // ---- 宠物系统（全局） ----
        function getPets() {
            try { return JSON.parse(localStorage.getItem('pets') || '[]'); } catch (e) { return []; }
        }

        function savePets(pets) {
            localStorage.setItem('pets', JSON.stringify(pets));
            // 重新加载桌面宠物
            if (typeof loadPets === 'function') loadPets();
            // 如果设置窗口已打开，刷新列表
            const petList = document.getElementById('petList');
            if (petList && typeof renderPetList === 'function') renderPetList();
        }

        // 渲染设置面板中的宠物列表
        function renderPetList() {
            const list = document.getElementById('petList');
            if (!list) return;
            const pets = getPets();
            list.innerHTML = '';
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;">暂无宠物</p>';
                return;
            }
            pets.forEach((pet, idx) => {
                const div = document.createElement('div');
                div.style.borderBottom = '1px solid #ddd';
                div.style.padding = '6px 0';
                div.innerHTML = `
                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                        <img src="${pet.img}" style="width:40px; height:40px; object-fit:cover; border:1px solid #999; image-rendering:pixelated;" />
                        <span style="font-weight:bold;">${pet.name}</span>
                        <button onclick="window.editPetName(${idx})">✏️ 名称</button>
                        <button onclick="window.editPetImage(${idx})">🖼️ 换图</button>
                        <button onclick="window.editPetDialogs(${idx})">💬 对话</button>
                        <button onclick="window.deletePet(${idx})" style="color:red;">✕</button>
                    </div>
                    <div style="font-size:10px; color:#666; margin-top:2px; white-space:pre-wrap;">
                        对话: ${pet.dialogs && pet.dialogs.length ? pet.dialogs.join(' | ') : '(未设置)'}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // 加载宠物到桌面
        function loadPets() {
            const container = document.getElementById('desktop-pets');
            if (!container) return;
            container.innerHTML = '';
            const pets = getPets();
            if (pets.length === 0) return;
            pets.forEach((pet, idx) => {
                const el = document.createElement('div');
                el.className = 'pet';
                el.style.left = (pet.x ?? 20 + Math.random() * 60) + '%';
                el.style.top = (pet.y ?? 20 + Math.random() * 60) + '%';
                el.style.transform = 'translate(-50%, -50%)';
                el.dataset.idx = idx;
                const bubbleText = pet.dialogs && pet.dialogs.length ? pet.dialogs.join('\n') : '你好！';
                el.innerHTML = `
                    <img src="${pet.img}" alt="${pet.name}" />
                    <div class="bubble">${bubbleText}</div>
                `;
                const bubble = el.querySelector('.bubble');
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (pet.dialogs && pet.dialogs.length) {
                        const randomIdx = Math.floor(Math.random() * pet.dialogs.length);
                        bubble.textContent = pet.dialogs[randomIdx];
                    } else {
                        bubble.textContent = '你好！';
                    }
                    bubble.style.display = 'block';
                    setTimeout(() => { bubble.style.display = 'none'; }, 3000);
                });
                // 拖拽
                let dragging = false,
                    startX, startY, origX, origY;
                const onPointerDown = (e) => {
                    if (e.target.tagName === 'IMG') {
                        dragging = true;
                        const rect = container.getBoundingClientRect();
                        startX = e.clientX;
                        startY = e.clientY;
                        origX = parseFloat(el.style.left);
                        origY = parseFloat(el.style.top);
                        el.style.cursor = 'grabbing';
                        el.setPointerCapture(e.pointerId);
                        e.preventDefault();
                        bubble.style.display = 'none';
                    }
                };
                const onPointerMove = (e) => {
                    if (!dragging) return;
                    const dx = (e.clientX - startX) / container.offsetWidth * 100;
                    const dy = (e.clientY - startY) / container.offsetHeight * 100;
                    let newX = Math.min(95, Math.max(5, origX + dx));
                    let newY = Math.min(95, Math.max(5, origY + dy));
                    el.style.left = newX + '%';
                    el.style.top = newY + '%';
                    const petsData = getPets();
                    const idx2 = parseInt(el.dataset.idx);
                    if (petsData[idx2]) { petsData[idx2].x = newX;
                        petsData[idx2].y = newY;
                        localStorage.setItem('pets', JSON.stringify(petsData)); }
                };
                const onPointerUp = (e) => {
                    if (dragging) { dragging = false;
                        el.style.cursor = 'grab';
                        el.releasePointerCapture(e.pointerId); }
                };
                el.addEventListener('pointerdown', onPointerDown);
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
                el.addEventListener('pointercancel', onPointerUp);
                container.appendChild(el);
            });
        }

        // 暴露宠物操作到全局
        window.getPets = getPets;
        window.savePets = savePets;
        window.loadPets = loadPets;
        window.renderPetList = renderPetList;

        window.editPetName = async (idx) => {
            const pets = getPets();
            const pet = pets[idx];
            if (!pet) return;
            const newName = await xpPrompt('编辑名称', '新名称：', '', pet.name);
            if (newName !== null) { pet.name = newName;
                savePets(pets); }
        };
        window.editPetImage = async (idx) => {
            const pets = getPets();
            const pet = pets[idx];
            if (!pet) return;
            const newImg = await xpPrompt('图片URL', 'URL：', '', pet.img);
            if (newImg !== null) { pet.img = newImg;
                savePets(pets); }
        };
        window.editPetDialogs = async (idx) => {
            const pets = getPets();
            const pet = pets[idx];
            if (!pet) return;
            const current = pet.dialogs ? pet.dialogs.join('\n') : '';
            const result = await showXpModal({
                title: '编辑对话（每行一句）',
                fields: [{ id: 'dialogs', label: '对话内容（每行一句，换行分隔）', type: 'text', value: current,

                confirmText: '保存',
                cancelText: '取消'
            });
            if (result) {
                const lines = result.dialogs.split('\n').map(s => s.trim()).filter(s => s);
                pet.dialogs = lines.length ? lines : ['你好！'];
                savePets(pets);

        };
        window.deletePet = async (idx) => {
            const confirm = await showXpModal({ title: '确认删除', message: '确定删除此宠物？', confirmText: '删除', cancelText: '取消' });

        // ============================================================
        //  2. 窗口管理
        // ============================================================
        let windowZIndex = 2000;
        window._windowInstances = window._windowInstances || {};

        function makeDraggable(element, handle) {
            let startX, startY, origLeft, origTop, isDragging = false;

            function onPointerDown(e) {
                if (e.target.closest('button')) return;
                // 兼容触摸和鼠标
                if (e.button !== undefined && e.button !== 0 && e.pointerType !== 'touch') return;
                const rect = element.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                origLeft = rect.left;
                origTop = rect.top;
                isDragging = true;
                element.style.left = origLeft + 'px';
                element.style.top = origTop + 'px';
                element.style.transform = 'none';
                element.style.zIndex = ++windowZIndex;
                try { element.setPointerCapture(e.pointerId); } catch (_) { /* 某些设备可能不支持 */ }
                e.preventDefault();
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                document.addEventListener('pointercancel', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                let newLeft = origLeft + e.clientX - startX;
                let newTop = origTop + e.clientY - startY;
                const maxX = window.innerWidth - 20;
                const maxY = window.innerHeight - 20;
                newLeft = Math.max(-element.offsetWidth + 60, Math.min(newLeft, maxX));
                newTop = Math.max(-element.offsetHeight + 36 + 10, Math.min(newTop, maxY));
                element.style.left = newLeft + 'px';
                element.style.top = newTop + 'px';
                e.preventDefault();
            }

            function onPointerUp(e) {
                if (isDragging) {
                    isDragging = false;
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', onPointerUp);
                    document.removeEventListener('pointercancel', onPointerUp);
                }
            }
            handle.addEventListener('pointerdown', onPointerDown);
        }

        function closeWindow(id) {
            const inst = window._windowInstances[id];
            if (!inst) return;
            const win = inst.window;
            if (win && win.parentNode) {
                win.remove();
            }
            if (inst.taskbarBtn && inst.taskbarBtn.parentNode) {
                inst.taskbarBtn.remove();
            }
            delete window._windowInstances[id];
        }

        function minimizeWindow(id) {
            const inst = window._windowInstances[id];
            if (!inst) return;
            const win = inst.window;
            if (!win) return;
            win.style.display = 'none';
            // 如果已经有任务栏按钮则移除旧的
            if (inst.taskbarBtn && inst.taskbarBtn.parentNode) {
                inst.taskbarBtn.remove();
                inst.taskbarBtn = null;
            }
            const taskbarItems = document.getElementById('taskbar-items');
            const btn = document.createElement('div');
            btn.className = 'taskbar-item';
            btn.dataset.windowId = id;
            const title = win.querySelector('.title-text')?.textContent || id;
            btn.textContent = title;
            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                btn.remove();
                inst.taskbarBtn = null;
            });
            taskbarItems.appendChild(btn);
            inst.taskbarBtn = btn;
        }

        function toggleMaximize(win) {
            if (!win._isMaximized) {
                // 保存当前尺寸
                const rect = win.getBoundingClientRect();
                win._prevRect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
                win.style.left = '0';
                win.style.top = '0';
                win.style.width = '100%';
                win.style.height = '100%';
                win.style.borderRadius = '0';
                win._isMaximized = true;
                const maxBtn = win.querySelector('.max-btn');
                if (maxBtn) maxBtn.textContent = '❐';
            } else {
                const rect = win._prevRect || { left: 100, top: 60, width: 460, height: 300 };
                win.style.left = rect.left + 'px';
                win.style.top = rect.top + 'px';
                win.style.width = rect.width + 'px';
                win.style.height = rect.height + 'px';
                win.style.borderRadius = '';
                win._isMaximized = false;
                const maxBtn = win.querySelector('.max-btn');
                if (maxBtn) maxBtn.textContent = '☐';
            }
        }

        function bindWindowControls(win, id) {
            const titlebar = win.querySelector('.window-titlebar');
            if (!titlebar) return;
            // 移除旧监听避免重复
            if (titlebar._controlHandler) {
                titlebar.removeEventListener('click', titlebar._controlHandler);
            }
            const handler = (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                e.stopPropagation();
                e.preventDefault();
                if (btn.classList.contains('min-btn')) {
                    minimizeWindow(id);
                } else if (btn.classList.contains('max-btn')) {
                    toggleMaximize(win);
                } else if (btn.classList.contains('close-btn')) {
                    closeWindow(id);
                }
            };
            titlebar.addEventListener('click', handler);
            titlebar._controlHandler = handler;

        // ============================================================
        //  3. 弹窗系统
        // ============================================================
        function showXpModal(options) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'xp-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'xp-modal';
                let fieldsHtml = '';
                if (options.fields) {
                    fieldsHtml = options.fields.map(f =>
                        `
                        <label>${f.label}</label>
                        <input type="${f.type || 'text'}" id="modal_${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" />
                    `
                    ).join('');
                }
                modal.innerHTML = `
                    <h3>${options.title || '提示'}</h3>
                    ${fieldsHtml || `<p>${options.message || ''}</p>`}
                    <div class="modal-btns">
                        ${options.cancelText ? `<button id="modalCancel">${options.cancelText}</button>` : ''}
                        <button class="primary" id="modalConfirm">${options.confirmText || '确定'}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                const confirmBtn = modal.querySelector('#modalConfirm');
                const cancelBtn = modal.querySelector('#modalCancel');

                function cleanup(result) { overlay.remove();
                    resolve(result); }
                confirmBtn.addEventListener('click', () => {
                    if (options.fields) {
                        const results = {};
                        options.fields.forEach(f => {
                            const input = document.getElementById(`modal_${f.id}`);
                            results[f.id] = input ? input.value : '';
                        });
                        cleanup(results);
                    } else { cleanup(true); }
                });
                if (cancelBtn) cancelBtn.addEventListener('click', () => cleanup(null));
                overlay.addEventListener('click', (e) => { if (e.target === overlay && !cancelBtn) cleanup(null); });
            });
        }

        async function xpPrompt(title, label, placeholder, defaultValue) {
            try {
                const result = await showXpModal({
                    title,
                    fields: [{ id: 'input', label, placeholder, value: defaultValue || '' }],
                    confirmText: '确定',
                    cancelText: '取消'
                });
                return result ? result.input : null;
            } catch (e) { return null; }
        }

        async function xpAlert(message) {
            await showXpModal({ title: '提示', message, confirmText: '确定' });
        }

            win.style.top = (40 + Math.random() * 60) + 'px';
            win.style.zIndex = ++windowZIndex;

            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">🎨 画图</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="max-btn">☐</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = `
                <div class="app-container">
                    <div class="paint-toolbar">
                        <button id="paintColorBtn">🎨 颜色</button>
                        <input type="color" id="paintColorPicker" value="#000000" />
                        <button id="paintSizeBtn">🖊️ 大小</button>
                        <input type="range" id="paintSizeSlider" min="1" max="20" value="3" />
                        <button id="paintEraserBtn">🧹 橡皮</button>
                        <button id="paintLayerBtn">📄 图层</button>
                        <button id="paintClearBtn">🗑️ 清空</button>
                        <button id="paintSaveBtn">💾 保存</button>
                        <button id="paintExportBtn">📤 导出PNG</button>
                    </div>
                    <div class="paint-canvas-container" style="touch-action:none;">
                        <canvas id="paintCanvas" width="500" height="400" style="touch-action:none;"></canvas>
                    </div>
                    <div class="paint-layer-controls">
                        <span style="font-size:10px;">图层：</span>
                        <button class="layer-btn" data-layer="0">底层</button>
                        <button class="layer-btn" data-layer="1">中层</button>
                        <button class="layer-btn" data-layer="2">顶层</button>
                        <span id="paintLayerIndicator" style="font-size:10px; margin-left:8px;">当前: 底层</span>
                    </div>
                </div>
            `;
            win.appendChild(body);
            document.body.appendChild(win);
            window._windowInstances[id] = { window: win, taskbarBtn: null };
            makeDraggable(win, titlebar);
            bindWindowControls(win, id);

            const canvas = document.getElementById('paintCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 500;
            canvas.height = 400;
            let drawing = false;
            let currentColor = '#000000';
            let currentSize = 3;
            let isEraser = false;
            let currentLayer = 0;
            const layers = [null, null, null];

            function initLayers() {
                for (let i = 0; i < 3; i++) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.fillStyle = '#ffffff';
                    tempCtx.fillRect(0, 0, canvas.width, canvas.height);
                    layers[i] = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
                }
                renderLayer();
            }

            function renderLayer() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i <= currentLayer; i++) {
                    if (layers[i]) {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.putImageData(layers[i], 0, 0);
                        ctx.drawImage(tempCanvas, 0, 0);
                    }
                }
                document.getElementById('paintLayerIndicator').textContent = `当前: ${['底层','中层','顶层'][currentLayer]}`;
            }

            function saveLayer() {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                layers[currentLayer] = imageData;
            }

            initLayers();

            function startDraw(e) {
                e.preventDefault();
                drawing = true;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 0.1, y + 0.1);
                ctx.stroke();
            }

            function draw(e) {
                e.preventDefault();
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                ctx.lineWidth = isEraser ? currentSize * 2 : currentSize;
                ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            function endDraw(e) {
                if (drawing) {
                    drawing = false;
                    saveLayer();
                }
            }

            canvas.addEventListener('pointerdown', startDraw);
            canvas.addEventListener('pointermove', draw);
            canvas.addEventListener('pointerup', endDraw);
            canvas.addEventListener('pointerleave', endDraw);
            canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
            canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

            document.getElementById('paintColorPicker').addEventListener('input', (e) => {
                currentColor = e.target.value;
                isEraser = false;
                document.getElementById('paintEraserBtn').textContent = '🧹 橡皮';
            });

            document.getElementById('paintSizeSlider').addEventListener('input', (e) => {
                currentSize = parseInt(e.target.value);
            });

            document.getElementById('paintEraserBtn').addEventListener('click', () => {
                isEraser = !isEraser;
                document.getElementById('paintEraserBtn').textContent = isEraser ? '🧹 橡皮 (开)' : '🧹 橡皮';
            });

            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentLayer = parseInt(btn.dataset.layer);
                    renderLayer();
                });
            });

            document.getElementById('paintClearBtn').onclick = async () => {
                const confirm = await showXpModal({ title: '确认清空', message: '清空当前图层？', confirmText: '清空',
                    cancelText: '取消' });
                if (!confirm) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveLayer();
                renderLayer();
            };

            document.getElementById('paintSaveBtn').onclick = () => {
                const dataUrl = canvas.toDataURL('image/png');
                localStorage.setItem('paintData', dataUrl);
                xpAlert('已保存到本地！');
            };

            document.getElementById('paintExportBtn').onclick = () => {
                const link = document.createElement('a');
                link.download = 'painting.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            const saved = localStorage.getItem('paintData');
            if (saved) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    saveLayer();
                    renderLayer();
                };
                img.src = saved;
            }
        }
