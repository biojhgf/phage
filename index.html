<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <style>
        /* ===== 全部样式（与之前一致） ===== */
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #desktop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; flex-direction: column; background-color: #3a6ea5; background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a); font-size: 14px; }
        #desktop-overlay.active { display: flex; }
        .desktop-icons { flex: 1; padding: 20px 30px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 30px 40px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: center; padding: 4px; touch-action: manipulation; }
        .desktop-icon:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); border-radius: 6px; }
        .desktop-icon .icon-img { font-size: 48px; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { font-size: 13px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .taskbar { height: 50px; background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%); display: flex; align-items: center; padding: 0 8px; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); border-top: 2px solid #3a7bd5; flex-shrink: 0; position: relative; z-index: 5000; }
        .start-button { background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%); color: #fff; padding: 4px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #0a3a0a; border: 1px solid #4cb84c; flex-shrink: 0; touch-action: manipulation; }
        #taskbar-items { display: flex; flex: 1; gap: 4px; overflow-x: auto; margin: 0 10px; padding: 2px 0; }
        .taskbar-item { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; height: 32px; touch-action: manipulation; }
        .taskbar-item:hover { background: rgba(255,255,255,0.3); }
        .taskbar-time { margin-left: auto; color: #fff; font-size: 14px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 4px; border: 1px solid #3a7bd5; flex-shrink: 0; }
        .start-menu { display: none; position: absolute; bottom: 52px; left: 8px; width: 280px; background: #f0f0f0; border: 2px solid #3a7bd5; border-radius: 8px 8px 0 0; padding: 12px 0; box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 6000; }
        .start-menu.show { display: block; }
        .start-menu-item { padding: 8px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; touch-action: manipulation; }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 22px; }
        .start-menu hr { margin: 6px 12px; border: 1px solid #ccc; }
        .xp-window { position: fixed; min-width: 300px; min-height: 140px; background: #ece9d8; border: 3px solid #3a6ea5; border-radius: 8px 8px 6px 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; z-index: 2000; font-family: "Segoe UI", Tahoma, sans-serif; overflow: hidden; touch-action: none; }
        .xp-window .window-titlebar { background: linear-gradient(90deg, #0a246a, #3a7bd5); color: #fff; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 14px; height: 32px; touch-action: none; }
        .xp-window .window-titlebar .title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .xp-window .window-titlebar .win-btns { display: flex; gap: 4px; flex-shrink: 0; }
        .xp-window .window-titlebar .win-btns button { width: 26px; height: 26px; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; line-height: 22px; text-align: center; background: rgba(255,255,255,0.15); color: #fff; touch-action: manipulation; }
        .xp-window .window-titlebar .win-btns button:hover { background: rgba(255,255,255,0.3); }
        .xp-window .window-titlebar .win-btns .min-btn:hover { background: #5a7ab5; }
        .xp-window .window-titlebar .win-btns .max-btn:hover { background: #6a8a5a; }
        .xp-window .window-titlebar .win-btns .close-btn:hover { background: #c00; }
        .xp-window .window-body { padding: 0; flex: 1; overflow: auto; background: #fff; color: #000; display: flex; flex-direction: column; touch-action: auto; }
        .app-container { padding: 16px; flex: 1; background: #f0f0e8; overflow: auto; font-family: 'Courier New', Courier, monospace; }
        .app-container h2 { margin-top: 0; border-bottom: 2px solid #999; padding-bottom: 4px; }
        .app-container button { background: #ddd; border: 2px outset #fff; padding: 4px 12px; cursor: pointer; font-family: inherit; touch-action: manipulation; }
        .app-container button:active { border-style: inset; }
        .app-container input, .app-container textarea, .app-container select { background: #fff; border: 2px inset #ccc; padding: 4px; font-family: inherit; }
        .app-container textarea { width: 100%; resize: vertical; }
        .app-container .item-list { list-style: none; padding: 0; margin: 8px 0; }
        .app-container .item-list li { padding: 4px 8px; border-bottom: 1px solid #ccc; cursor: pointer; }
        .app-container .item-list li:hover { background: #d0d0d0; }
        .app-container .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        #hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; color: rgba(255,255,255,0.5); font-size: 14px; background: rgba(0,0,0,0.4); padding: 6px 18px; border-radius: 20px; pointer-events: none; transition: opacity 1s; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="three-container"></div>
    <div id="hint">🖱️ 点击电脑屏幕进入桌面 · 按 ESC 返回</div>

    <div id="desktop-overlay">
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="oc"><span class="icon-img">🧑‍🎤</span><span class="icon-label">我的 OC</span></div>
            <div class="desktop-icon" data-window="gallery"><span class="icon-img">🖼️</span><span class="icon-label">图库</span></div>
            <div class="desktop-icon" data-window="player"><span class="icon-img">🎵</span><span class="icon-label">千千静听</span></div>
            <div class="desktop-icon" data-window="writing"><span class="icon-img">📝</span><span class="icon-label">写作工坊</span></div>
            <div class="desktop-icon" data-window="chat"><span class="icon-img">💬</span><span class="icon-label">聊天室</span></div>
            <div class="desktop-icon" data-window="blog"><span class="icon-img">📖</span><span class="icon-label">个人博客</span></div>
            <div class="desktop-icon" data-window="about"><span class="icon-img">📄</span><span class="icon-label">关于</span></div>
            <div class="desktop-icon" data-window="trash"><span class="icon-img">🗑️</span><span class="icon-label">回收站</span></div>
        </div>

        <div class="taskbar">
            <div class="start-button" id="startBtn">🪟 开始</div>
            <div id="taskbar-items"></div>
            <div class="taskbar-time" id="taskbarTime">12:00</div>
        </div>

        <div class="start-menu" id="startMenu">
            <div class="start-menu-item" data-window="oc"><span class="item-icon">🧑‍🎤</span> 我的 OC</div>
            <div class="start-menu-item" data-window="gallery"><span class="item-icon">🖼️</span> 图库</div>
            <div class="start-menu-item" data-window="player"><span class="item-icon">🎵</span> 千千静听</div>
            <div class="start-menu-item" data-window="writing"><span class="item-icon">📝</span> 写作工坊</div>
            <div class="start-menu-item" data-window="chat"><span class="item-icon">💬</span> 聊天室</div>
            <div class="start-menu-item" data-window="blog"><span class="item-icon">📖</span> 个人博客</div>
            <div class="start-menu-item" data-window="about"><span class="item-icon">📄</span> 关于</div>
            <div class="start-menu-item" data-window="trash"><span class="item-icon">🗑️</span> 回收站</div>
            <hr />
            <div class="start-menu-item" id="shutdownItem"><span class="item-icon">⏻</span> 返回房间</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ============================================================
        //  1. Three.js 场景（完整构建）
        // ============================================================
        import * as THREE from 'three';
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 4);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 灯光
        scene.add(new THREE.AmbientLight(0x404060, 0.8));
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const screenLight = new THREE.PointLight(0x4488ff, 0.8);
        screenLight.position.set(0, 1.2, 1.8);
        scene.add(screenLight);
        const lampLight = new THREE.PointLight(0xffaa55, 0.5);
        lampLight.position.set(-0.8, 1.6, 0.5);
        scene.add(lampLight);

        // 房间群组
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 地板（木纹）
        function createWoodTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(90,70,50,${0.1+Math.random()*0.3})`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                const x = Math.random() * 256, y = Math.random() * 256;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(c);
        }
        const woodTex = createWoodTexture();
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
        woodTex.repeat.set(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        roomGroup.add(floor);

        // 墙壁（暗色条纹）
        function createWallTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#2a1f1a';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = `rgba(60,45,35,${0.2+Math.random()*0.3})`;
                ctx.fillRect(i*13, 0, 6, 256);
            }
            return new THREE.CanvasTexture(c);
        }
        const wallTex = createWallTexture();
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        wallTex.repeat.set(3, 2);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9, metalness: 0 });

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        backWall.position.set(0, 1.25, -3);
        roomGroup.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-3, 1.25, 0);
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(3, 1.25, 0);
        roomGroup.add(rightWall);

        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = 3;
        roomGroup.add(ceil);

        // 桌子
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.7, metalness: 0.1 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.8), tableMat);
        tableTop.position.set(0, 0.5, -0.6);
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        roomGroup.add(tableTop);

        const legMat = new THREE.MeshStandardMaterial({ color: 0x3a281c, roughness: 0.8 });
        const legPositions = [[-0.6,-0.3],[0.6,-0.3],[-0.6,0.3],[0.6,0.3]];
        legPositions.forEach(([x,z]) => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.45), legMat);
            leg.position.set(x, 0.25, -0.6+z);
            leg.castShadow = true;
            roomGroup.add(leg);
        });

        // 显示器（大屁股）
        const monitorGroup = new THREE.Group();
        monitorGroup.position.set(0, 0.9, -0.3);
        roomGroup.add(monitorGroup);

        const baseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.3 });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.15, 16), baseMat);
        base.position.y = -0.08;
        base.castShadow = true;
        monitorGroup.add(base);

        const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.2 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.5), shellMat);
        body.position.set(0, 0.3, 0);
        body.castShadow = true;
        monitorGroup.add(body);

        const backMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
        const backBump = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), backMat);
        backBump.position.set(0, 0.3, -0.28);
        backBump.scale.set(1, 0.85, 0.7);
        backBump.castShadow = true;
        monitorGroup.add(backBump);

        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
        const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.06), bezelMat);
        bezel.position.set(0, 0.3, 0.28);
        monitorGroup.add(bezel);

        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x4488ff,
            emissive: 0x224488,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.0,
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), screenMat);
        screen.position.set(0, 0.3, 0.31);
        monitorGroup.add(screen);

        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            transparent: true,
            opacity: 0.08,
            roughness: 0.0,
            metalness: 0.9,
        });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), glassMat);
        glass.position.set(0, 0.3, 0.32);
        monitorGroup.add(glass);

        // 点击目标（屏幕、玻璃、边框）
        const clickTargets = [screen, glass, bezel];

        // 海报装饰
        function createPoster(color, x, y, z, rotY) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });
            const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), mat);
            poster.position.set(x, y, z);
            poster.rotation.y = rotY || 0;
            roomGroup.add(poster);
        }
        createPoster(0x8b3a3a, -1.8, 1.8, -2.9, 0);
        createPoster(0x3a6b8b, 1.8, 2.0, -2.9, 0);
        createPoster(0x6b8b3a, -2.9, 1.5, -0.5, Math.PI/2);
        createPoster(0x8b6b3a, 2.9, 1.5, 0.5, -Math.PI/2);

        // 地毯
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
        const carpet = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0.3, -0.49, 0.2);
        roomGroup.add(carpet);

        // 鼠标控制旋转
        let rotationY = 0;
        const maxRotation = 0.35;
        document.addEventListener('mousemove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        });
        document.addEventListener('touchmove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        }, { passive: true });

        // 点击屏幕进入桌面
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDesktopActive = false;

        function onPointerDown(event) {
            if (isDesktopActive) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (clientX === undefined) return;
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(clickTargets);
            if (intersects.length > 0) {
                enterDesktop();
            }
        }
        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });

        // 桌面进入/退出
        function enterDesktop() {
            isDesktopActive = true;
            document.getElementById('desktop-overlay').classList.add('active');
            document.getElementById('hint').style.opacity = '0';
            updateTime();
            setInterval(updateTime, 10000);
        }

        function exitDesktop() {
            isDesktopActive = false;
            document.getElementById('desktop-overlay').classList.remove('active');
            document.getElementById('hint').style.opacity = '1';
            document.querySelectorAll('.xp-window').forEach(w => w.remove());
            document.querySelectorAll('.taskbar-item').forEach(b => b.remove());
            window._windowInstances = {};
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isDesktopActive) exitDesktop();
        });
        document.getElementById('shutdownItem').addEventListener('click', exitDesktop);

        function updateTime() {
            const now = new Date();
            document.getElementById('taskbarTime').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        // 开始菜单
        const startBtn = document.getElementById('startBtn');
        const startMenu = document.getElementById('startMenu');
        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startMenu.classList.toggle('show'); });
        document.addEventListener('click', () => startMenu.classList.remove('show'));
        startMenu.addEventListener('click', (e) => e.stopPropagation());
        document.querySelectorAll('.start-menu-item[data-window]').forEach(item => {
            item.addEventListener('click', () => {
                createWindow(item.dataset.window);
                startMenu.classList.remove('show');
            });
        });
        document.querySelectorAll('.desktop-icon[data-window]').forEach(icon => {
            icon.addEventListener('click', () => createWindow(icon.dataset.window));
        });

        // ============================================================
        //  2. 窗口管理（基础）
        // ============================================================
        let windowZIndex = 2000;
        window._windowInstances = window._windowInstances || {};

        function makeDraggable(element, handle) {
            let startX, startY, origLeft, origTop, isDragging = false;
            function onPointerDown(e) {
                if (e.target.closest('button')) return;
                if (e.button !== undefined && e.button !== 0 && e.pointerType !== 'touch') return;
                const rect = element.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                origLeft = rect.left; origTop = rect.top;
                isDragging = true;
                element.style.left = origLeft + 'px';
                element.style.top = origTop + 'px';
                element.style.transform = 'none';
                element.style.zIndex = ++windowZIndex;
                element.setPointerCapture(e.pointerId);
                e.preventDefault();
                element.addEventListener('pointermove', onPointerMove);
                element.addEventListener('pointerup', onPointerUp);
                element.addEventListener('pointercancel', onPointerUp);
            }
            function onPointerMove(e) {
                if (!isDragging) return;
                element.style.left = (origLeft + e.clientX - startX) + 'px';
                element.style.top = (origTop + e.clientY - startY) + 'px';
                e.preventDefault();
            }
            function onPointerUp(e) {
                if (isDragging) {
                    isDragging = false;
                    element.removeEventListener('pointermove', onPointerMove);
                    element.removeEventListener('pointerup', onPointerUp);
                    element.removeEventListener('pointercancel', onPointerUp);
                }
            }
            handle.addEventListener('pointerdown', onPointerDown);
        }

        function createWindow(id) {
            switch(id) {
                case 'player': createPlayerWindow(); break;
                case 'writing': createWritingWindow(); break;
                case 'chat': createChatWindow(); break;
                case 'blog': createBlogWindow(); break;
                default: createGenericWindow(id); break;
            }
        }

        // 通用窗口
        const windowContents = {

                ch.name = newName || ch.name;
                ch.color = newColor || ch.color;
                saveChatData(data);
                renderCharacters();
            }
            function openRoom(idx) {
                currentRoomIdx = idx;
                const data = getChatData();
                const room = data.rooms[idx];
                if (!room) return;
                const view = document.getElementById('chatView');
                let html = `<h3 style="color: #fff; margin-top:0;">💬 ${room.name}</h3>`;
                room.messages.forEach(msg => {
                    const color = msg.color || '#fff';
                    html += `<div><span style="color:${color}; font-weight:bold;">${msg.role}:</span> ${msg.text}</div>`;
                });
                view.innerHTML = html;
                view.scrollTop = view.scrollHeight;
                renderCharacters();
            }
            window.chatSend = function() {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text) return;
                if (currentRoomIdx < 0) { alert('请先选择一个聊天室'); return; }
                const select = document.getElementById('chatCharacterSelect');
                const charIdx = parseInt(select.value);
                const data = getChatData();
                const room = data.rooms[currentRoomIdx];
                if (!room) return;
                const char = data.characters[charIdx];
                if (!char) { alert('请先创建角色'); return; }
                room.messages.push({ role: char.name, text: text, color: char.color });
                saveChatData(data);
                input.value = '';
                openRoom(currentRoomIdx);
            };
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && document.activeElement === document.getElementById('chatInput')) {
                    window.chatSend();
                }
            });
            renderRooms();
            renderCharacters();
        }

        // ---------- 3.3 个人博客 ----------
        function createBlogWindow() {
            if (window._windowInstances['blog'] && window._windowInstances['blog'].window) {
                const win = window._windowInstances['blog'].window;
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                if (window._windowInstances['blog'].taskbarBtn) {
                    window._windowInstances['blog'].taskbarBtn.remove();
                    window._windowInstances['blog'].taskbarBtn = null;
                }
                return;
            }
            const id = 'blog';
            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = '700px';
            win.style.height = '560px';
            win.style.left = (70 + Math.random() * 60) + 'px';
            win.style.top = (45 + Math.random() * 60) + 'px';
            win.style.zIndex = ++windowZIndex;

            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">📖 个人博客工坊</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="max-btn">☐</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = `
                <div class="app-container" id="blogApp" style="display:flex; gap:16px; height:100%;">
                    <div style="flex:1; border-right:2px solid #ccc; padding-right:12px; overflow-y:auto;">
                        <h3>📰 文章列表</h3>
                        <button onclick="window.blogAddPost()">+ 新建文章</button>
                        <ul class="item-list" id="postList"></ul>
                        <hr />
                        <h3>🎨 博客样式</h3>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <label>背景色：<input type="color" id="blogBgColor" value="#ffffff" onchange="window.blogUpdateStyle()" /></label>
                            <label>文字颜色：<input type="color" id="blogTextColor" value="#000000" onchange="window.blogUpdateStyle()" /></label>
                            <label>字体：<select id="blogFont" onchange="window.blogUpdateStyle()">
                                <option value="Georgia, serif">Georgia</option>
                                <option value="'Courier New', monospace">Courier New</option>
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="'Comic Sans MS', cursive">Comic Sans</option>
                            </select></label>
                        </div>
                    </div>
                    <div style="flex:2; display:flex; flex-direction:column;">
                        <div id="blogPreview" style="flex:1; padding:16px; border:2px inset #ccc; overflow-y:auto; background:#fff; color:#000;">
                            <p style="color:#888;">选择文章预览，或创建新文章</p>
                        </div>
                        <div id="blogEditor" style="display:none; margin-top:8px;">
                            <input type="text" id="blogEditTitle" placeholder="文章标题" style="width:100%;" />
                            <textarea id="blogEditContent" rows="4" placeholder="文章正文" style="width:100%;"></textarea>
                            <button onclick="window.blogSavePost()">保存文章</button>
                            <button onclick="window.blogCancelEdit()">取消</button>
                        </div>
                    </div>
                </div>
            `;
            win.appendChild(body);
            document.body.appendChild(win);
            window._windowInstances[id] = { window: win, taskbarBtn: null };
            makeDraggable(win, titlebar);

            let isMaximized = false;
            const minBtn = titlebar.querySelector('.min-btn');
            const maxBtn = titlebar.querySelector('.max-btn');
            const closeBtn = titlebar.querySelector('.close-btn');
            minBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); minimizeWindow(id); });
            maxBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (!isMaximized) {
                    win._prevRect = win.getBoundingClientRect();
                    win.style.left = '0'; win.style.top = '0';
                    win.style.width = '100%'; win.style.height = '100%';
                    win.style.borderRadius = '0';
                    isMaximized = true;
                    maxBtn.textContent = '❐';
                } else {
                    const rect = win._prevRect || { left: 70, top: 45, width: 700, height: 560 };
                    win.style.left = rect.left + 'px'; win.style.top = rect.top + 'px';
                    win.style.width = rect.width + 'px'; win.style.height = rect.height + 'px';
                    win.style.borderRadius = '';
                    isMaximized = false;
                    maxBtn.textContent = '☐';
                }
            });
            closeBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); closeWindow(id); });
            win.addEventListener('pointerdown', () => { win.style.zIndex = ++windowZIndex; });
            win.addEventListener('DOMNodeRemoved', () => {
                if (window._windowInstances[id]) {
                    if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                    delete window._windowInstances[id];
                }
            });

            // ---- 博客逻辑 ----
            function getBlogData() {
                let data = localStorage.getItem('blogData');
                if (!data) {
                    const defaultData = { posts: [] };
                    localStorage.setItem('blogData', JSON.stringify(defaultData));
                    return defaultData;
                }
                return JSON.parse(data);
            }
            function saveBlogData(data) {
                localStorage.setItem('blogData', JSON.stringify(data));
            }
            let editingPostIdx = -1;
            function renderPosts() {
                const data = getBlogData();
                const list = document.getElementById('postList');
                list.innerHTML = '';
                data.posts.forEach((post, idx) => {
                    const li = document.createElement('li');
                    li.textContent = post.title || '无标题';
                    li.onclick = () => previewPost(idx);
                    list.appendChild(li);
                });
            }
            function previewPost(idx) {
                const data = getBlogData();
                const post = data.posts[idx];
                if (!post) return;
                const preview = document.getElementById('blogPreview');
                const bg = post.bgColor || '#ffffff';
                const color = post.textColor || '#000000';
                const font = post.fontFamily || 'Georgia, serif';
                preview.style.background = bg;
                preview.style.color = color;
                preview.style.fontFamily = font;
                preview.innerHTML = `
                    <h2 style="margin-top:0;">${post.title}</h2>
                    <div style="white-space:pre-wrap;">${post.content}</div>
                    <p style="color:#888; font-size:12px; margin-top:16px;">发布于 ${post.createdAt || '未知'}</p>
                    <button onclick="window.blogEditPost(${idx})">编辑</button>
                    <button onclick="window.blogDeletePost(${idx})" style="color:red;">删除</button>
                `;
                window._blogPreviewIdx = idx;
            }
            window.blogAddPost = function() {
                document.getElementById('blogEditTitle').value = '';
                document.getElementById('blogEditContent').value = '';
                document.getElementById('blogEditor').style.display = 'block';
                editingPostIdx = -1;
                document.getElementById('blogPreview').innerHTML = '<p style="color:#888;">正在编辑新文章...</p>';
            };
            window.blogEditPost = function(idx) {
                const data = getBlogData();
                const post = data.posts[idx];
                if (!post) return;
                document.getElementById('blogEditTitle').value = post.title || '';
                document.getElementById('blogEditContent').value = post.content || '';
                document.getElementById('blogEditor').style.display = 'block';
                editingPostIdx = idx;
                document.getElementById('blogPreview').innerHTML = '<p style="color:#888;">正在编辑文章...</p>';
            };
            window.blogSavePost = function() {
                const title = document.getElementById('blogEditTitle').value.trim();
                const content = document.getElementById('blogEditContent').value.trim();
                if (!title) { alert('请输入标题'); return; }
                const data = getBlogData();
                const bgColor = document.getElementById('blogBgColor').value;
                const textColor = document.getElementById('blogTextColor').value;
                const fontFamily = document.getElementById('blogFont').value;
                if (editingPostIdx >= 0 && editingPostIdx < data.posts.length) {
                    const post = data.posts[editingPostIdx];
                    post.title = title;
                    post.content = content;
                    post.bgColor = bgColor;
                    post.textColor = textColor;
                    post.fontFamily = fontFamily;
                } else {
                    data.posts.push({
                        title: title,
                        content: content,
                        bgColor: bgColor,
                        textColor: textColor,
                        fontFamily: fontFamily,
                        createdAt: new Date().toLocaleString()
                    });
                }
                saveBlogData(data);
                document.getElementById('blogEditor').style.display = 'none';
                renderPosts();
                if (data.posts.length > 0) previewPost(data.posts.length - 1);
                alert('文章已保存！');
            };
            window.blogCancelEdit = function() {
                document.getElementById('blogEditor').style.display = 'none';
                if (window._blogPreviewIdx !== undefined && window._blogPreviewIdx >= 0) {
                    previewPost(window._blogPreviewIdx);
                } else {
                    document.getElementById('blogPreview').innerHTML = '<p style="color:#888;">选择文章预览</p>';
                }
            };
            window.blogDeletePost = function(idx) {
                if (!confirm('确定删除这篇文章？')) return;
                const data = getBlogData();
                data.posts.splice(idx, 1);
                saveBlogData(data);
                renderPosts();
                document.getElementById('blogPreview').innerHTML = '<p style="color:#888;">文章已删除</p>';
                window._blogPreviewIdx = -1;
            };
            window.blogUpdateStyle = function() {
                if (window._blogPreviewIdx !== undefined && window._blogPreviewIdx >= 0) {
                    previewPost(window._blogPreviewIdx);
                }
            };
            renderPosts();
            if (getBlogData().posts.length > 0) {
                previewPost(0);
            } else {
                document.getElementById('blogPreview').innerHTML = '<p style="color:#888;">还没有文章，创建一篇吧！</p>';
            }
        }

        // ============================================================
        //  4. 响应式 & 动画
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 暴露全局函数供 onclick 调用
        window.createWindow = createWindow;

        console.log('✅ 复古桌面加载完成！');
        console.log('📝 写作工坊、💬 聊天室、📖 个人博客 已就绪');
        console.log('所有数据保存在 localStorage，关闭浏览器不丢失。');
    </script>
</body>
</html>
