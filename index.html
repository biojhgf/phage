<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: 'Press Start 2P', 'Courier New', monospace; background-color: #1a1a1a; }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #desktop-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            display: none; flex-direction: column;
            background-color: #3a6ea5;
            background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a);
            font-size: 14px;
            transition: background 0.3s;
        }
        #desktop-overlay.active { display: flex; }

        /* ===== 宠物系统（修复：移到 overlay 内部并调整层级） ===== */
        #pet-container {
            position: absolute;          /* 相对于 overlay 定位 */
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;        /* 允许点击穿透到图标，但宠物本身可点击 */
            z-index: 1;                 /* 在背景之上，图标之下 */
        }
        .pet-item {
            position: absolute;
            pointer-events: auto;        /* 自身可交互 */
            cursor: grab;
            user-select: none;
            width: 80px; height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            touch-action: none;
        }
        .pet-item img {
            max-width: 100%; max-height: 100%;
            display: block;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            image-rendering: pixelated;
            pointer-events: none;
        }
        .pet-item .speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #ece9d8;
            border: 2px solid #3a6ea5;
            padding: 4px 10px;
            font-size: 12px;
            white-space: pre-wrap;       /* 支持换行 */
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            display: none;
            pointer-events: none;
            max-width: 200px;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.4;
            z-index: 600;
        }
        .pet-item .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #ece9d8;
        }
        .pet-bounce { animation: petFloat 1.5s infinite alternate ease-in-out; }
        @keyframes petFloat { 0% { transform: translateY(0px); } 100% { transform: translateY(-6px); } }

        /* ===== 桌面图标层级 ===== */
        .desktop-icons {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 30px 40px;
            position: relative;
            z-index: 2;                  /* 高于宠物 */
        }

        /* ===== 其余样式保持不变 ===== */
        /* ...（中间省略，最后会提供完整代码）... */
    </style>
</head>
<body>

    <div id="three-container"></div>
    <div id="hint">🖱️ 点击电脑屏幕进入桌面 · 按 ESC 返回</div>

    <!-- 将宠物容器移入桌面 overlay 内部 -->
    <div id="desktop-overlay">
        <!-- 宠物容器放在最前面，层级最低 -->
        <div id="pet-container"></div>

        <div class="desktop-icons">
            <!-- 桌面图标... -->
        </div>
        <div class="taskbar">...</div>
        <div class="start-menu">...</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ============================================================
        // 弹窗系统（增加 textarea 支持）
        // ============================================================
        window.showXpModal = function(options) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'xp-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'xp-modal';
                let fieldsHtml = '';
                if (options.fields) {
                    fieldsHtml = options.fields.map(f => {
                        const tag = f.type === 'textarea' ? 'textarea' : 'input';
                        const attrs = f.type === 'textarea' ?
                            `rows="${f.rows || 4}" style="width:100%;"` :
                            `type="${f.type || 'text'}"`;
                        return `<label>${f.label}</label>
                                <${tag} id="modal_${f.id}" ${attrs} placeholder="${f.placeholder || ''}">${f.value || ''}</${tag}>`;
                    }).join('');
                }
                modal.innerHTML = `
                    <h3>${options.title || '提示'}</h3>
                    ${fieldsHtml || `<p>${options.message || ''}</p>`}
                    <div class="modal-btns">
                        ${options.cancelText ? `<button id="modalCancel">${options.cancelText}</button>` : ''}
                        <button class="primary" id="modalConfirm">${options.confirmText || '确定'}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                const confirmBtn = modal.querySelector('#modalConfirm');
                const cancelBtn = modal.querySelector('#modalCancel');

                function cleanup(result) { overlay.remove(); resolve(result); }
                confirmBtn.addEventListener('click', () => {
                    if (options.fields) {
                        const results = {};
                        options.fields.forEach(f => {
                            const el = document.getElementById(`modal_${f.id}`);
                            results[f.id] = el ? el.value : '';
                        });
                        cleanup(results);
                    } else { cleanup(true); }
                });
                if (cancelBtn) cancelBtn.addEventListener('click', () => cleanup(null));
                overlay.addEventListener('click', (e) => { if (e.target === overlay && !cancelBtn) cleanup(null); });
            });
        };

        // ============================================================
        // 宠物系统（修复：使用 textarea 支持多行对话）
        // ============================================================
        function getPetData() {
            try { return JSON.parse(localStorage.getItem('myPets') || '[]'); } catch (e) { return []; }
        }
        function savePetData(pets) {
            localStorage.setItem('myPets', JSON.stringify(pets));
            renderPets();
            renderPetListUI();
        }

        let petInstances = [];
        let petAnimationId = null;

        function renderPets() {
            const container = document.getElementById('pet-container');
            if (!container) return;
            container.innerHTML = '';
            petInstances = [];
            const pets = getPetData();
            if (pets.length === 0) return;

            pets.forEach((petData, index) => {
                const el = document.createElement('div');
                el.className = 'pet-item pet-bounce';
                el.style.left = (petData.x ?? 20 + Math.random() * 60) + '%';
                el.style.top = (petData.y ?? 20 + Math.random() * 60) + '%';
                el.dataset.index = index;

                const bubbleText = petData.dialogs && petData.dialogs.length ? petData.dialogs.join('\n') : '你好！';
                el.innerHTML = `
                    <img src="${petData.img}" alt="${petData.name}" />
                    <div class="speech-bubble">${bubbleText}</div>
                `;
                container.appendChild(el);

                const instance = {
                    el,
                    data: petData,
                    dx: (Math.random() - 0.5) * 2,
                    dy: (Math.random() - 0.5) * 2,
                    speed: 0.2 + Math.random() * 0.3,
                    isDragging: false,
                    dragOffsetX: 0,
                    dragOffsetY: 0,
                };
                petInstances.push(instance);

                const bubble = el.querySelector('.speech-bubble');

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dialogs = instance.data.dialogs;
                    if (dialogs && dialogs.length) {
                        const idx = Math.floor(Math.random() * dialogs.length);
                        bubble.textContent = dialogs[idx];
                    } else {
                        bubble.textContent = '你好！';
                    }
                    bubble.style.display = 'block';
                    if (window._petBubbleTimer) clearTimeout(window._petBubbleTimer);
                    window._petBubbleTimer = setTimeout(() => {
                        bubble.style.display = 'none';
                    }, 3000);
                });

                // 触摸拖拽（使用 pointer 事件）
                const onPointerDown = (e) => {
                    if (e.target.tagName === 'IMG' || e.target === el) {
                        e.stopPropagation();
                        const rect = el.getBoundingClientRect();
                        instance.isDragging = true;
                        instance.dragOffsetX = e.clientX - rect.left;
                        instance.dragOffsetY = e.clientY - rect.top;
                        el.style.cursor = 'grabbing';
                        el.classList.remove('pet-bounce');
                        el.setPointerCapture(e.pointerId);
                        e.preventDefault();
                        bubble.style.display = 'none';
                    }
                };
                const onPointerMove = (e) => {
                    if (!instance.isDragging) return;
                    const containerRect = container.getBoundingClientRect();
                    let newX = ((e.clientX - instance.dragOffsetX - containerRect.left) / containerRect.width) * 100;
                    let newY = ((e.clientY - instance.dragOffsetY - containerRect.top) / containerRect.height) * 100;
                    newX = Math.min(95, Math.max(5, newX));
                    newY = Math.min(95, Math.max(5, newY));
                    el.style.left = newX + '%';
                    el.style.top = newY + '%';
                    instance.data.x = newX;
                    instance.data.y = newY;
                    const allPets = getPetData();
                    const idx = parseInt(el.dataset.index);
                    if (allPets[idx]) {
                        allPets[idx].x = newX;
                        allPets[idx].y = newY;
                        localStorage.setItem('myPets', JSON.stringify(allPets));
                    }
                    e.preventDefault();
                };
                const onPointerUp = (e) => {
                    if (instance.isDragging) {
                        instance.isDragging = false;
                        el.style.cursor = 'grab';
                        el.classList.add('pet-bounce');
                        el.releasePointerCapture(e.pointerId);
                    }
                };
                el.addEventListener('pointerdown', onPointerDown);
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
                el.addEventListener('pointercancel', onPointerUp);
                instance._cleanup = () => {
                    el.removeEventListener('pointerdown', onPointerDown);
                    el.removeEventListener('pointermove', onPointerMove);
                    el.removeEventListener('pointerup', onPointerUp);
                    el.removeEventListener('pointercancel', onPointerUp);
                };
            });

            if (petAnimationId) cancelAnimationFrame(petAnimationId);
            if (petInstances.length > 0) {
                petAnimationId = requestAnimationFrame(animatePets);
            }
        }

        function animatePets() {
            const container = document.getElementById('pet-container');
            if (!container) {
                petAnimationId = requestAnimationFrame(animatePets);
                return;
            }
            const containerWidth = container.offsetWidth || 1;
            const containerHeight = container.offsetHeight || 1;
            petInstances.forEach(inst => {
                if (inst.isDragging) return;
                if (Math.random() < 0.005) {
                    inst.dx = (Math.random() - 0.5) * 2;
                    inst.dy = (Math.random() - 0.5) * 2;
                    const len = Math.sqrt(inst.dx * inst.dx + inst.dy * inst.dy);
                    if (len > 0) { inst.dx /= len; inst.dy /= len; }
                }
                const speedPx = inst.speed;
                let deltaX = inst.dx * speedPx;
                let deltaY = inst.dy * speedPx;
                let deltaXPercent = (deltaX / containerWidth) * 100;
                let deltaYPercent = (deltaY / containerHeight) * 100;
                let left = parseFloat(inst.el.style.left) || 20;
                let top = parseFloat(inst.el.style.top) || 20;
                let newLeft = left + deltaXPercent;
                let newTop = top + deltaYPercent;
                const margin = 5;
                if (newLeft < margin) { newLeft = margin; inst.dx = -inst.dx; }
                if (newLeft > 100 - margin) { newLeft = 100 - margin; inst.dx = -inst.dx; }
                if (newTop < margin) { newTop = margin; inst.dy = -inst.dy; }
                if (newTop > 100 - margin) { newTop = 100 - margin; inst.dy = -inst.dy; }
                inst.el.style.left = newLeft + '%';
                inst.el.style.top = newTop + '%';
                inst.data.x = newLeft;
                inst.data.y = newTop;
            });
            petAnimationId = requestAnimationFrame(animatePets);
        }

        function renderPetListUI() {
            const list = document.getElementById('petList');
            if (!list) return;
            const pets = getPetData();
            list.innerHTML = '';
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;">暂无宠物</p>';
                return;
            }
            pets.forEach((pet, idx) => {
                const div = document.createElement('div');
                div.style.borderBottom = '1px solid #ddd';
                div.style.padding = '6px 0';
                div.innerHTML = `
                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                        <img src="${pet.img}" style="width:40px; height:40px; object-fit:cover; border:1px solid #999; image-rendering:pixelated;" />
                        <span style="font-weight:bold;">${pet.name}</span>
                        <button onclick="window.editPetName(${idx})">✏️ 名称</button>
                        <button onclick="window.editPetImage(${idx})">🖼️ 换图</button>
                        <button onclick="window.editPetDialogs(${idx})">💬 对话</button>
                        <button onclick="window.deletePet(${idx})" style="color:red;">✕</button>
                    </div>
                    <div style="font-size:10px; color:#666; margin-top:2px; white-space:pre-wrap;">
                        对话: ${pet.dialogs && pet.dialogs.length ? pet.dialogs.join(' | ') : '(未设置)'}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // 编辑宠物（使用 textarea）
        window.editPetDialogs = async function(idx) {
            const pets = getPetData();
            const pet = pets[idx];
            if (!pet) return;
            const current = pet.dialogs ? pet.dialogs.join('\n') : '';
            const result = await window.showXpModal({
                title: '编辑对话（每行一句）',
                fields: [{
                    id: 'dialogs',
                    label: '对话内容（每行一句，换行分隔）',
                    type: 'textarea',      // 改为 textarea
                    rows: 6,
                    value: current,
                    placeholder: '你好呀！\n今天天气真好\n...'
                }],
                confirmText: '保存',
                cancelText: '取消'
            });
            if (result) {
                const lines = result.dialogs.split('\n').map(s => s.trim()).filter(s => s);
                pet.dialogs = lines.length ? lines : ['你好！'];
                savePetData(pets);
            }
        };

        // 添加宠物时，对话也使用 textarea
        document.getElementById('addPetBtn').onclick = async () => {
            const name = await window.xpPrompt('添加宠物', '名称：', '小可爱');
            if (name === null) return;
            const img = await window.xpPrompt('图片URL', 'URL', 'https://via.placeholder.com/100?text=Pet');
            if (img === null) return;
            const defaultDialogs = ['你好！', '今天开心吗？', '一起玩吧！'];
            const dialogsResult = await window.showXpModal({
                title: '设置对话（每行一句）',
                fields: [{
                    id: 'dialogs',
                    label: '对话内容（换行分隔）',
                    type: 'textarea',
                    rows: 6,
                    value: defaultDialogs.join('\n'),
                    placeholder: '每行一句'
                }],
                confirmText: '确定',
                cancelText: '取消'
            });
            let dialogs = defaultDialogs;
            if (dialogsResult) {
                const lines = dialogsResult.dialogs.split('\n').map(s => s.trim()).filter(s => s);
                if (lines.length) dialogs = lines;
            }
            const pets = getPetData();
            pets.push({
                name,
                img,
                dialogs,
                x: Math.random() * 70 + 10,
                y: Math.random() * 60 + 20
            });
            savePetData(pets);
            window.xpAlert('宠物已添加！');
        };

        // 其余代码（窗口管理、应用、Three.js等）保持不变，但需注意将 pet-container 移入 overlay 内部。
        // 由于篇幅，此处省略其余部分，最终我会提供完整代码。
    </script>
</body>
</html>
