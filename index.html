<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <style>
        /* 所有样式（同之前，略，但保证完整） */
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #desktop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; flex-direction: column; background-color: #3a6ea5; background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a); font-size: 14px; }
        #desktop-overlay.active { display: flex; }
        .desktop-icons { flex: 1; padding: 20px 30px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 30px 40px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: center; padding: 4px; touch-action: manipulation; }
        .desktop-icon:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); border-radius: 6px; }
        .desktop-icon .icon-img { font-size: 48px; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { font-size: 13px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .taskbar { height: 50px; background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%); display: flex; align-items: center; padding: 0 8px; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); border-top: 2px solid #3a7bd5; flex-shrink: 0; position: relative; z-index: 5000; }
        .start-button { background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%); color: #fff; padding: 4px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #0a3a0a; border: 1px solid #4cb84c; flex-shrink: 0; touch-action: manipulation; }
        #taskbar-items { display: flex; flex: 1; gap: 4px; overflow-x: auto; margin: 0 10px; padding: 2px 0; }
        .taskbar-item { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; height: 32px; touch-action: manipulation; }
        .taskbar-item:hover { background: rgba(255,255,255,0.3); }
        .taskbar-time { margin-left: auto; color: #fff; font-size: 14px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 4px; border: 1px solid #3a7bd5; flex-shrink: 0; }
        .start-menu { display: none; position: absolute; bottom: 52px; left: 8px; width: 280px; background: #f0f0f0; border: 2px solid #3a7bd5; border-radius: 8px 8px 0 0; padding: 12px 0; box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 6000; }
        .start-menu.show { display: block; }
        .start-menu-item { padding: 8px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; touch-action: manipulation; }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 22px; }
        .start-menu hr { margin: 6px 12px; border: 1px solid #ccc; }
        .xp-window { position: fixed; min-width: 300px; min-height: 140px; background: #ece9d8; border: 3px solid #3a6ea5; border-radius: 8px 8px 6px 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; z-index: 2000; font-family: "Segoe UI", Tahoma, sans-serif; overflow: hidden; touch-action: none; }
        .xp-window .window-titlebar { background: linear-gradient(90deg, #0a246a, #3a7bd5); color: #fff; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 14px; height: 32px; touch-action: none; }
        .xp-window .window-titlebar .title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .xp-window .window-titlebar .win-btns { display: flex; gap: 4px; flex-shrink: 0; }
        .xp-window .window-titlebar .win-btns button { width: 26px; height: 26px; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; line-height: 22px; text-align: center; background: rgba(255,255,255,0.15); color: #fff; touch-action: manipulation; }
        .xp-window .window-titlebar .win-btns button:hover { background: rgba(255,255,255,0.3); }
        .xp-window .window-titlebar .win-btns .min-btn:hover { background: #5a7ab5; }
        .xp-window .window-titlebar .win-btns .max-btn:hover { background: #6a8a5a; }
        .xp-window .window-titlebar .win-btns .close-btn:hover { background: #c00; }
        .xp-window .window-body { padding: 0; flex: 1; overflow: hidden; background: #fff; color: #000; display: flex; flex-direction: column; touch-action: auto; }
        .player-container { flex: 1; display: flex; flex-direction: column; background: linear-gradient(145deg, #f5f0e8, #e8e0d0); touch-action: auto; }
        .player-views { flex: 1; position: relative; overflow: hidden; touch-action: auto; }
        .play-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.3s; background: linear-gradient(135deg, #f0ebe0, #ddd6c8); touch-action: auto; }
        .play-view.hidden { opacity: 0; pointer-events: none; }
