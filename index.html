    <style>
        /* ===== 全局像素风格（与您原始代码完全一致，此处省略，实际已保留） ===== */
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: 'Press Start 2P', 'Courier New', monospace; background-color: #1a1a1a; }

        #desktop-pets .pet img { max-width: 100px; max-height: 100px; display: block; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); image-rendering: pixelated; }

        #desktop-pets .pet .bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #ece9d8; }
        @keyframes petBounce { 0% { transform: translate(-50%, -50%) translateY(0px); } 100% { transform: translate(-50%, -50%) translateY(-8px); } }
        .desktop-icons { flex: 1; padding: 20px 30px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 30px 40px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: center; padding: 4px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; font-size: 10px; }

        .desktop-icon .icon-label { font-size: 9px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 2px; }
        .taskbar { height: 50px; background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%); display: flex; align-items: center; padding: 0 8px; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); border-top: 2px solid #3a7bd5; flex-shrink: 0; position: relative; z-index: 5000; }
        .start-button { background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%); color: #fff; padding: 4px 16px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #0a3a0a; border: 1px solid #4cb84c; flex-shrink: 0; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        #taskbar-items { display: flex; flex: 1; gap: 4px; overflow-x: auto; margin: 0 10px; padding: 2px 0; }
        .taskbar-item { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 16px; border-radius: 2px; cursor: pointer; font-size: 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; height: 32px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        .taskbar-item:hover { background: rgba(255,255,255,0.3); }
        .taskbar-time { margin-left: auto; color: #fff; font-size: 12px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 2px; border: 1px solid #3a7bd5; flex-shrink: 0; font-family: 'Press Start 2P', monospace; }
        .start-menu { display: none; position: absolute; bottom: 52px; left: 8px; width: 280px; background: #ece9d8; border: 2px solid #3a6ea5; border-radius: 4px; padding: 12px 0; box-shadow: 6px 6px 0 rgba(0,0,0,0.2); z-index: 6000; }
        .start-menu.show { display: block; }
        .start-menu-item { padding: 6px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 12px; touch-action: manipulation; font-family: 'Press Start 2P', monospace; }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 20px; }
        .start-menu hr { margin: 6px 12px; border: 1px solid #999; }
        .xp-window { position: fixed; min-width: 300px; min-height: 140px; background: #ece9d8; border: 2px solid #3a6ea5; border-radius: 4px; box-shadow: 8px 8px 0 rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; font-family: 'Press Start 2P', monospace; overflow: hidden; touch-action: none; }
        .xp-window .window-titlebar { background: linear-gradient(90deg, #0a246a, #3a7bd5); color: #fff; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 4px 4px 0 0; font-weight: bold; font-size: 12px; height: 36px; touch-action: none; pointer-events: auto; }
        .xp-window .window-titlebar .title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Press Start 2P', monospace; }
        .xp-window .window-titlebar .win-btns { display: flex; gap: 6px; flex-shrink: 0; }

        .tape-player .volume-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#6a8a5a; cursor:pointer; border:1px solid #eee; }
        .tape-player .list-toggle { text-align:center; font-size:10px; color:#888; cursor:pointer; border-top:1px solid #444; padding-top:6px; }
        .tape-player .playlist { display:none; background:#1a1a1a; border:1px solid #444; padding:4px; max-height:100px; overflow-y:auto; }
        .tape-player .playlist .pl-item { padding:4px 8px; cursor:pointer; border-bottom:1px solid #333; font-size:10px; color:#aaa; }

        .notion-editor { display: flex; flex-direction: column; gap: 6px; }
        .notion-block { display: flex; align-items: flex-start; gap: 6px; padding: 2px 0; }
        .notion-block .block-type { font-size: 12px; color: #888; min-width: 60px; }
        .notion-block .block-content { flex: 1; }
        .notion-block .block-content input, .notion-block .block-content textarea { width: 100%; background: #fff; border: 1px solid #ccc; padding: 2px 4px; font-family: 'Press Start 2P', monospace; font-size: 11px; }

        .paint-canvas-container { position: relative; border: 2px solid #999; background: #fff; touch-action: none; }
        .paint-canvas-container canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }

        .comic-viewer .comic-nav { display: flex; gap: 12px; align-items: center; }
    </style>

        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

    <script type="module">
        // ============================================================
        // 第一部分：桌面核心功能（保留您原始所有应用逻辑，仅修复窗口按钮和宠物）
        // ============================================================

        // ---------- 弹窗系统（与您原始一致） ----------
        function showXpModal(options) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'xp-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'xp-modal';
                let fieldsHtml = '';
                if (options.fields) {
                    fieldsHtml = options.fields.map(f =>
                        `<label>${f.label}</label>
                         <input type="${f.type || 'text'}" id="modal_${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" />`
                    ).join('');
                }
                modal.innerHTML = `
                    <h3>${options.title || '提示'}</h3>
                    ${fieldsHtml || `<p>${options.message || ''}</p>`}
                    <div class="modal-btns">
                        ${options.cancelText ? `<button id="modalCancel">${options.cancelText}</button>` : ''}
                        <button class="primary" id="modalConfirm">${options.confirmText || '确定'}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                const confirmBtn = modal.querySelector('#modalConfirm');
                const cancelBtn = modal.querySelector('#modalCancel');

                function cleanup(result) { overlay.remove(); resolve(result); }
                confirmBtn.addEventListener('click', () => {
                    if (options.fields) {
                        const results = {};
                        options.fields.forEach(f => {
                            const input = document.getElementById(`modal_${f.id}`);
                            results[f.id] = input ? input.value : '';
                        });
                        cleanup(results);
                    } else { cleanup(true); }
                });
                if (cancelBtn) cancelBtn.addEventListener('click', () => cleanup(null));
                overlay.addEventListener('click', (e) => { if (e.target === overlay && !cancelBtn) cleanup(null); });
            });
        }

        async function xpPrompt(title, label, placeholder, defaultValue) {
            try {
                const result = await showXpModal({
                    title,
                    fields: [{ id: 'input', label, placeholder, value: defaultValue || '' }],
                    confirmText: '确定',
                    cancelText: '取消'
                });
                return result ? result.input : null;
            } catch (e) { return null; }
        }

        async function xpAlert(message) {
            await showXpModal({ title: '提示', message, confirmText: '确定' });
        }

        // ---------- 宠物系统（修复：确保loadPets在enterDesktop时被调用） ----------
        function getPets() {
            try { return JSON.parse(localStorage.getItem('pets') || '[]'); } catch (e) { return []; }
        }

        function savePets(pets) {
            localStorage.setItem('pets', JSON.stringify(pets));
            loadPets(); // 刷新桌面宠物
            renderPetList(); // 刷新设置中的列表
        }

        function loadPets() {
            const container = document.getElementById('desktop-pets');
            if (!container) return;
            container.innerHTML = '';
            const pets = getPets();
            if (pets.length === 0) return;
            pets.forEach((pet, idx) => {
                const el = document.createElement('div');
                el.className = 'pet';
                el.style.left = (pet.x ?? 20 + Math.random() * 60) + '%';
                el.style.top = (pet.y ?? 20 + Math.random() * 60) + '%';
                el.style.transform = 'translate(-50%, -50%)';
                el.dataset.idx = idx;
                const bubbleText = pet.dialogs && pet.dialogs.length ? pet.dialogs.join('\n') : '你好！';
                el.innerHTML = `
                    <img src="${pet.img}" alt="${pet.name}" />
                    <div class="bubble">${bubbleText}</div>
                `;
                const bubble = el.querySelector('.bubble');
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (pet.dialogs && pet.dialogs.length) {
                        const randomIdx = Math.floor(Math.random() * pet.dialogs.length);
                        bubble.textContent = pet.dialogs[randomIdx];
                    } else {

                    bubble.style.display = 'block';

                });
                // 拖拽
                let dragging = false, startX, startY, origX, origY;
                const onPointerDown = (e) => {
                    if (e.target.tagName === 'IMG') {
                        dragging = true;
                        const rect = container.getBoundingClientRect();
                        startX = e.clientX;
                        startY = e.clientY;
                        origX = parseFloat(el.style.left);
                        origY = parseFloat(el.style.top);
                        el.style.cursor = 'grabbing';
                        el.setPointerCapture(e.pointerId);
                        e.preventDefault();
                        bubble.style.display = 'none';
                    }
                };
                const onPointerMove = (e) => {
                    if (!dragging) return;
                    const dx = (e.clientX - startX) / container.offsetWidth * 100;
                    const dy = (e.clientY - startY) / container.offsetHeight * 100;
                    let newX = Math.min(95, Math.max(5, origX + dx));
                    let newY = Math.min(95, Math.max(5, origY + dy));
                    el.style.left = newX + '%';
                    el.style.top = newY + '%';
                    const petsData = getPets();

                    if (petsData[idx2]) { petsData[idx2].x = newX; petsData[idx2].y = newY; localStorage.setItem('pets', JSON.stringify(petsData)); }
                };
                const onPointerUp = (e) => {
                    if (dragging) { dragging = false; el.style.cursor = 'grab'; el.releasePointerCapture(e.pointerId); }
                };
                el.addEventListener('pointerdown', onPointerDown);
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
                el.addEventListener('pointercancel', onPointerUp);
                container.appendChild(el);
            });

        // 核心窗口创建函数（每个窗口独立绑定按钮）
        function createWindow(id, title, contentHtml, width = 500, height = 400) {
            // 如果已存在则显示并提升
            if (window._windowInstances[id]) {
                const win = window._windowInstances[id];
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                // 移除任务栏按钮（如果有）
                const btn = document.querySelector(`.taskbar-item[data-window-id="${id}"]`);
                if (btn) btn.remove();
                return;
            }

            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.left = (80 + Math.random() * 80) + 'px';
            win.style.top = (50 + Math.random() * 80) + 'px';
            win.style.zIndex = ++windowZIndex;

            // 标题栏
            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">${title}</span>
                <div class="win-btns">
                    <button class="min-btn" data-action="min">─</button>
                    <button class="max-btn" data-action="max">☐</button>
                    <button class="close-btn" data-action="close">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            // 内容体
            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = contentHtml;
            win.appendChild(body);
            document.body.appendChild(win);

            // 存储引用
            window._windowInstances[id] = win;

            // ---- 窗口控制（直接绑定，确保生效） ----
            const minBtn = titlebar.querySelector('.min-btn');
            const maxBtn = titlebar.querySelector('.max-btn');
            const closeBtn = titlebar.querySelector('.close-btn');

            // 最小化
            minBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                win.style.display = 'none';
                // 添加任务栏按钮
                const taskbar = document.getElementById('taskbar-items');
                const btn = document.createElement('div');
                btn.className = 'taskbar-item';
                btn.dataset.windowId = id;
                btn.textContent = title;
                btn.addEventListener('click', () => {
                    win.style.display = 'flex';
                    win.style.zIndex = ++windowZIndex;
                    btn.remove();
                });
                taskbar.appendChild(btn);
            });

            // 最大化/还原
            let isMaximized = false;
            maxBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isMaximized) {
                    win._prevRect = win.getBoundingClientRect();
                    win.style.left = '0';
                    win.style.top = '0';
                    win.style.width = '100%';
                    win.style.height = '100%';
                    win.style.borderRadius = '0';
                    isMaximized = true;
                    maxBtn.textContent = '❐';
                } else {
                    const rect = win._prevRect || { left: 100, top: 60, width: 460, height: 300 };
                    win.style.left = rect.left + 'px';
                    win.style.top = rect.top + 'px';
                    win.style.width = rect.width + 'px';
                    win.style.height = rect.height + 'px';
                    win.style.borderRadius = '';
                    isMaximized = false;
                    maxBtn.textContent = '☐';
                }
            });

            // 关闭
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                win.remove();
                delete window._windowInstances[id];
                // 移除任务栏按钮
                const btn = document.querySelector(`.taskbar-item[data-window-id="${id}"]`);
                if (btn) btn.remove();
            });

            // 点击窗口主体时提升层级
            win.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.win-btns')) return;
                win.style.zIndex = ++windowZIndex;
            });

            // 拖拽（标题栏）
            let dragData = null;
            const onDragStart = (e) => {
                if (e.target.closest('button')) return;
                const rect = win.getBoundingClientRect();
                dragData = {
                    startX: e.clientX,
                    startY: e.clientY,
                    left: rect.left,
                    top: rect.top
                };
                win.style.cursor = 'grabbing';
                document.addEventListener('pointermove', onDragMove);
                document.addEventListener('pointerup', onDragEnd);
                e.preventDefault();
            };
            const onDragMove = (e) => {
                if (!dragData) return;
                const dx = e.clientX - dragData.startX;
                const dy = e.clientY - dragData.startY;
                let newLeft = Math.max(0, dragData.left + dx);
                let newTop = Math.max(0, dragData.top + dy);
                newLeft = Math.min(window.innerWidth - win.offsetWidth, newLeft);
                newTop = Math.min(window.innerHeight - win.offsetHeight, newTop);
                win.style.left = newLeft + 'px';
                win.style.top = newTop + 'px';
            };
            const onDragEnd = () => {
                dragData = null;
                win.style.cursor = '';
                document.removeEventListener('pointermove', onDragMove);
                document.removeEventListener('pointerup', onDragEnd);
            };
            titlebar.addEventListener('pointerdown', onDragStart);

            return win;
        }

        // 5. 画图（完整）
        function createPaintWindow() {
            const id = 'paint';
            if (window._windowInstances[id]) {
                const win = window._windowInstances[id];
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                const btn = document.querySelector(`.taskbar-item[data-window-id="${id}"]`);
                if (btn) btn.remove();
                return;
            }
            const content = `
                <div class="app-container">
                    <div class="paint-toolbar">
                        <button id="paintColorBtn">🎨 颜色</button>
                        <input type="color" id="paintColorPicker" value="#000000" />
                        <button id="paintSizeBtn">🖊️ 大小</button>
                        <input type="range" id="paintSizeSlider" min="1" max="20" value="3" />
                        <button id="paintEraserBtn">🧹 橡皮</button>
                        <button id="paintLayerBtn">📄 图层</button>
                        <button id="paintClearBtn">🗑️ 清空</button>
                        <button id="paintSaveBtn">💾 保存</button>
                        <button id="paintExportBtn">📤 导出PNG</button>
                    </div>
                    <div class="paint-canvas-container" style="touch-action:none;">
                        <canvas id="paintCanvas" width="500" height="400" style="touch-action:none;"></canvas>
                    </div>
                    <div class="paint-layer-controls">
                        <span style="font-size:10px;">图层：</span>
                        <button class="layer-btn" data-layer="0">底层</button>
                        <button class="layer-btn" data-layer="1">中层</button>
                        <button class="layer-btn" data-layer="2">顶层</button>
                        <span id="paintLayerIndicator" style="font-size:10px; margin-left:8px;">当前: 底层</span>
                    </div>
                </div>
            `;
            const win = createWindow(id, '🎨 画图', content, 650, 550);

            // 初始化画布（等DOM加载）
            setTimeout(() => {
                const canvas = document.getElementById('paintCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = 500;
                canvas.height = 400;
                let drawing = false;
                let currentColor = '#000000';
                let currentSize = 3;
                let isEraser = false;
                let currentLayer = 0;
                const layers = [null, null, null];

                function initLayers() {
                    for (let i = 0; i < 3; i++) {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.fillStyle = '#ffffff';
                        tempCtx.fillRect(0, 0, canvas.width, canvas.height);
                        layers[i] = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
                    }
                    renderLayer();
                }
                function renderLayer() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let i = 0; i <= currentLayer; i++) {
                        if (layers[i]) {
                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = canvas.width;
                            tempCanvas.height = canvas.height;
                            const tempCtx = tempCanvas.getContext('2d');
                            tempCtx.putImageData(layers[i], 0, 0);
                            ctx.drawImage(tempCanvas, 0, 0);
                        }
                    }
                    document.getElementById('paintLayerIndicator').textContent = `当前: ${['底层','中层','顶层'][currentLayer]}`;
                }
                function saveLayer() {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    layers[currentLayer] = imageData;
                }
                initLayers();

                function startDraw(e) {
                    e.preventDefault();
                    drawing = true;
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 0.1, y + 0.1);
                    ctx.stroke();
                }
                function draw(e) {
                    e.preventDefault();
                    if (!drawing) return;
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                    ctx.lineWidth = isEraser ? currentSize * 2 : currentSize;
                    ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
                function endDraw(e) {
                    if (drawing) {
                        drawing = false;
                        saveLayer();
                    }
                }
                canvas.addEventListener('pointerdown', startDraw);
                canvas.addEventListener('pointermove', draw);
                canvas.addEventListener('pointerup', endDraw);
                canvas.addEventListener('pointerleave', endDraw);
                canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
                canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

                document.getElementById('paintColorPicker').addEventListener('input', (e) => {
                    currentColor = e.target.value;
                    isEraser = false;
                    document.getElementById('paintEraserBtn').textContent = '🧹 橡皮';
                });
                document.getElementById('paintSizeSlider').addEventListener('input', (e) => {
                    currentSize = parseInt(e.target.value);
                });
                document.getElementById('paintEraserBtn').addEventListener('click', () => {
                    isEraser = !isEraser;
                    document.getElementById('paintEraserBtn').textContent = isEraser ? '🧹 橡皮 (开)' : '🧹 橡皮';
                });
                document.querySelectorAll('.layer-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentLayer = parseInt(btn.dataset.layer);
                        renderLayer();
                    });
                });
                document.getElementById('paintClearBtn').onclick = async () => {
                    const confirm = await showXpModal({ title: '确认清空', message: '清空当前图层？', confirmText: '清空', cancelText: '取消' });
                    if (!confirm) return;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    saveLayer();
                    renderLayer();
                };
                document.getElementById('paintSaveBtn').onclick = () => {
                    const dataUrl = canvas.toDataURL('image/png');
                    localStorage.setItem('paintData', dataUrl);
                    xpAlert('已保存到本地！');
                };
                document.getElementById('paintExportBtn').onclick = () => {
                    const link = document.createElement('a');
                    link.download = 'painting.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                const saved = localStorage.getItem('paintData');
                if (saved) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0);
                        saveLayer();
                        renderLayer();
                    };
                    img.src = saved;
                }
            }, 100);
        }

            function renderPlaylist() {
                playlistEl.innerHTML = '';
                songs.forEach((song, idx) => {
                    const div = document.createElement('div');
                    div.className = 'pl-item' + (idx === currentIndex ? ' active' : '');
                    div.textContent = `${song.title} - ${song.artist}`;
                    div.addEventListener('click', () => {
                        currentIndex = idx;
                        loadSong(idx);
                        if (isPlaying) audio.play().catch(()=>{});
                    });
                    playlistEl.appendChild(div);
                });
            }
            renderPlaylist();

            function loadSong(index) {
                const song = songs[index];
                if (!song) return;
                audio.src = song.url;
                audio.load();
                songTitleEl.textContent = song.title;
                songArtistEl.textContent = song.artist;
                progress.value = 0;
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';
                document.querySelectorAll('.pl-item').forEach((el, i) => el.classList.toggle('active', i === index));
                reelLeft.classList.remove('spinning');
                reelRight.classList.remove('spinning');
            }

            function togglePlay() {
                if (audio.paused) {
                    audio.play().catch(() => alert('播放失败，请检查网络'));
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    reelLeft.classList.add('spinning');
                    reelRight.classList.add('spinning');
                } else {
                    audio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                    reelLeft.classList.remove('spinning');
                    reelRight.classList.remove('spinning');
                }
            }
            function prevSong() {
                currentIndex = (currentIndex - 1 + songs.length) % songs.length;
                loadSong(currentIndex);
                if (isPlaying) audio.play().catch(()=>{});
            }
            function nextSong() {
                currentIndex = (currentIndex + 1) % songs.length;
                loadSong(currentIndex);
                if (isPlaying) audio.play().catch(()=>{});
            }
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progress.value = percent;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            });
            audio.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(audio.duration); });
            audio.addEventListener('ended', () => { nextSong(); if (isPlaying) setTimeout(() => audio.play().catch(()=>{}), 100); });
            audio.addEventListener('error', (e) => { console.warn('音频加载错误:', e); });

            progress.addEventListener('input', () => {
                if (audio.duration) {
                    const time = (progress.value / 100) * audio.duration;
                    audio.currentTime = time;
                }
            });
            volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
            audio.volume = volumeSlider.value;

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }
            listToggle.addEventListener('click', () => {
                playlistEl.classList.toggle('show');
                listToggle.textContent = playlistEl.classList.contains('show') ? '📋 播放列表 ▲' : '📋 播放列表 ▼';
            });
            loadSong(0);
        }

        async function initThreeScene() {
            try {
                const THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');

                // ---- 构建场景（与您原始代码一致） ----
                const container = document.getElementById('three-container');
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a0a);
                const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.8, 4);
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                container.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0x404060, 0.8));
                const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
                mainLight.position.set(3, 5, 2);
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 1024;
                mainLight.shadow.mapSize.height = 1024;
                scene.add(mainLight);
                const screenLight = new THREE.PointLight(0x4488ff, 0.8);
                screenLight.position.set(0, 1.2, 1.8);
                scene.add(screenLight);
                const lampLight = new THREE.PointLight(0xffaa55, 0.5);
                lampLight.position.set(-0.8, 1.6, 0.5);
                scene.add(lampLight);

                const roomGroup = new THREE.Group();
                scene.add(roomGroup);

                // 地板
                const woodTex = (() => {
                    const c = document.createElement('canvas');
                    c.width = 256; c.height = 256;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#4a3728';
                    ctx.fillRect(0, 0, 256, 256);
                    for (let i = 0; i < 200; i++) {
                        ctx.strokeStyle = `rgba(90,70,50,${0.1+Math.random()*0.3})`;
                        ctx.lineWidth = 2 + Math.random() * 4;
                        ctx.beginPath();
                        const x = Math.random() * 256, y = Math.random() * 256;
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40);
                        ctx.stroke();
                    }
                    return new THREE.CanvasTexture(c);
                })();
                woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
                woodTex.repeat.set(4, 4);
                const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.5;
                floor.receiveShadow = true;
                roomGroup.add(floor);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a1f1a, roughness: 0.9 });
                const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
                backWall.position.set(0, 1.25, -3);
                roomGroup.add(backWall);
                const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.position.set(-3, 1.25, 0);
                roomGroup.add(leftWall);
                const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.position.set(3, 1.25, 0);
                roomGroup.add(rightWall);
                const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });
                const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), ceilMat);
                ceil.rotation.x = Math.PI / 2;
                ceil.position.y = 3;
                roomGroup.add(ceil);

                const tableMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.7 });
                const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.8), tableMat);
                tableTop.position.set(0, 0.5, -0.6);
                tableTop.castShadow = true;
                tableTop.receiveShadow = true;
                roomGroup.add(tableTop);
                const legMat = new THREE.MeshStandardMaterial({ color: 0x3a281c, roughness: 0.8 });
                [
                    [-0.6, -0.3],
                    [0.6, -0.3],
                    [-0.6, 0.3],
                    [0.6, 0.3]
                ].forEach(([x, z]) => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.45), legMat);
                    leg.position.set(x, 0.25, -0.6+z);
                    leg.castShadow = true;
                    roomGroup.add(leg);
                });

                const monitorGroup = new THREE.Group();
                monitorGroup.position.set(0, 0.9, -0.3);
                roomGroup.add(monitorGroup);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.3 });
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.15, 16), baseMat);
                base.position.y = -0.08;
                base.castShadow = true;
                monitorGroup.add(base);
                const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.2 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.5), shellMat);
                body.position.set(0, 0.3, 0);
                body.castShadow = true;
                monitorGroup.add(body);
                const backMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
                const backBump = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), backMat);
                backBump.position.set(0, 0.3, -0.28);
                backBump.scale.set(1, 0.85, 0.7);
                backBump.castShadow = true;
                monitorGroup.add(backBump);
                const bezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
                const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.06), bezelMat);
                bezel.position.set(0, 0.3, 0.28);
                monitorGroup.add(bezel);
                const screenMat = new THREE.MeshStandardMaterial({
                    color: 0x4488ff,
                    emissive: 0x224488,
                    emissiveIntensity: 0.6,
                    roughness: 0.1,
                    metalness: 0.0,
                });
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), screenMat);
                screen.position.set(0, 0.3, 0.31);
                monitorGroup.add(screen);
                const glassMat = new THREE.MeshStandardMaterial({
                    color: 0x88aaff,
                    transparent: true,
                    opacity: 0.08,
                    roughness: 0.0,
                    metalness: 0.9,
                });
                const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), glassMat);
                glass.position.set(0, 0.3, 0.32);
                monitorGroup.add(glass);
                const clickTargets = [screen, glass, bezel];

                function createPoster(color, x, y, z, rotY) {
                    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });
                    const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), mat);
                    poster.position.set(x, y, z);
                    poster.rotation.y = rotY || 0;
                    roomGroup.add(poster);
                }
                createPoster(0x8b3a3a, -1.8, 1.8, -2.9, 0);
                createPoster(0x3a6b8b, 1.8, 2.0, -2.9, 0);
                createPoster(0x6b8b3a, -2.9, 1.5, -0.5, Math.PI/2);
                createPoster(0x8b6b3a, 2.9, 1.5, 0.5, -Math.PI/2);
                const carpetMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
                const carpet = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), carpetMat);
                carpet.rotation.x = -Math.PI / 2;
                carpet.position.set(0.3, -0.49, 0.2);
                roomGroup.add(carpet);

                let rotationY = 0;
                const maxRotation = 0.35;
                document.addEventListener('mousemove', (e) => {
                    if (isDesktopActive) return;
                    const x = (e.clientX / window.innerWidth) * 2 - 1;
                    rotationY = x * maxRotation;
                    roomGroup.rotation.y = rotationY;
                });
                document.addEventListener('touchmove', (e) => {
                    if (isDesktopActive) return;
                    const touch = e.touches[0];
                    const x = (touch.clientX / window.innerWidth) * 2 - 1;
                    rotationY = x * maxRotation;
                    roomGroup.rotation.y = rotationY;
                }, { passive: true });

                const raycaster = new THREE.Raycaster();
                const pointer = new THREE.Vector2();

                function onPointerDown(event) {
                    if (isDesktopActive) return;
                    const rect = renderer.domElement.getBoundingClientRect();
                    const clientX = event.clientX || (event.touches && event.touches[0].clientX);
                    const clientY = event.clientY || (event.touches && event.touches[0].clientY);
                    if (clientX === undefined) return;
                    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(pointer, camera);
                    const intersects = raycaster.intersectObjects(clickTargets);
                    if (intersects.length > 0) {
                        enterDesktop();
                    }
                }
                renderer.domElement.addEventListener('click', onPointerDown);
                renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && isDesktopActive) exitDesktop();
                });

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

                console.log('✅ 3D场景加载成功');
            } catch (err) {
                console.warn('Three.js加载失败，直接进入桌面模式', err);
                document.getElementById('three-container').style.display = 'none';
                enterDesktop();
            }
        }

        // 启动
        initThreeScene();
        console.log('✅ 桌面功能已完全恢复，所有应用完整，窗口按钮及宠物系统正常。');
    </script>
</body>
</html>
