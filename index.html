<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>复古房间 · XP桌面</title>
    <style>
        /* ===== 全部样式（保留所有功能） ===== */
        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #desktop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; flex-direction: column; background-color: #3a6ea5; background-image: radial-gradient(ellipse at 50% 30%, #4a7db5, #2a5a8a); font-size: 14px; }
        #desktop-overlay.active { display: flex; }
        .desktop-icons { flex: 1; padding: 20px 30px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 30px 40px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: center; padding: 4px; touch-action: manipulation; }
        .desktop-icon:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); border-radius: 6px; }
        .desktop-icon .icon-img { font-size: 48px; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { font-size: 13px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .taskbar { height: 50px; background: linear-gradient(180deg, #245edb 0%, #1a4a9f 100%); display: flex; align-items: center; padding: 0 8px; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); border-top: 2px solid #3a7bd5; flex-shrink: 0; position: relative; z-index: 5000; }
        .start-button { background: linear-gradient(180deg, #3c9b3c 0%, #1f6a1f 100%); color: #fff; padding: 4px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #0a3a0a; border: 1px solid #4cb84c; flex-shrink: 0; touch-action: manipulation; }
        #taskbar-items { display: flex; flex: 1; gap: 4px; overflow-x: auto; margin: 0 10px; padding: 2px 0; }
        .taskbar-item { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; height: 32px; touch-action: manipulation; }
        .taskbar-item:hover { background: rgba(255,255,255,0.3); }
        .taskbar-time { margin-left: auto; color: #fff; font-size: 14px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 4px; border: 1px solid #3a7bd5; flex-shrink: 0; }
        .start-menu { display: none; position: absolute; bottom: 52px; left: 8px; width: 280px; background: #f0f0f0; border: 2px solid #3a7bd5; border-radius: 8px 8px 0 0; padding: 12px 0; box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 6000; }
        .start-menu.show { display: block; }
        .start-menu-item { padding: 8px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; touch-action: manipulation; }
        .start-menu-item:hover { background: #3a7bd5; color: #fff; }
        .start-menu-item .item-icon { font-size: 22px; }
        .start-menu hr { margin: 6px 12px; border: 1px solid #ccc; }
        .xp-window { position: fixed; min-width: 300px; min-height: 140px; background: #ece9d8; border: 3px solid #3a6ea5; border-radius: 8px 8px 6px 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; z-index: 2000; font-family: "Segoe UI", Tahoma, sans-serif; overflow: hidden; touch-action: none; }
        .xp-window .window-titlebar { background: linear-gradient(90deg, #0a246a, #3a7bd5); color: #fff; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 14px; height: 32px; touch-action: none; }
        .xp-window .window-titlebar .title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .xp-window .window-titlebar .win-btns { display: flex; gap: 4px; flex-shrink: 0; }
        .xp-window .window-titlebar .win-btns button { width: 26px; height: 26px; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; line-height: 22px; text-align: center; background: rgba(255,255,255,0.15); color: #fff; touch-action: manipulation; }
        .xp-window .window-titlebar .win-btns button:hover { background: rgba(255,255,255,0.3); }
        .xp-window .window-titlebar .win-btns .min-btn:hover { background: #5a7ab5; }
        .xp-window .window-titlebar .win-btns .max-btn:hover { background: #6a8a5a; }
        .xp-window .window-titlebar .win-btns .close-btn:hover { background: #c00; }
        .xp-window .window-body { padding: 0; flex: 1; overflow: hidden; background: #fff; color: #000; display: flex; flex-direction: column; touch-action: auto; }
        .player-container { flex: 1; display: flex; flex-direction: column; background: linear-gradient(145deg, #f5f0e8, #e8e0d0); touch-action: auto; }
        .player-views { flex: 1; position: relative; overflow: hidden; touch-action: auto; }
        .play-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.3s; background: linear-gradient(135deg, #f0ebe0, #ddd6c8); touch-action: auto; }
        .play-view.hidden { opacity: 0; pointer-events: none; }
        .play-view .cover { width: 180px; height: 180px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); background: #ccc; background-size: cover; background-position: center; flex-shrink: 0; margin-bottom: 12px; border: 2px solid #fff; }
        .play-view .song-info { text-align: center; margin: 4px 0 8px 0; }
        .play-view .song-info .title { font-size: 18px; font-weight: bold; color: #1a1a1a; }
        .play-view .song-info .artist { font-size: 14px; color: #555; }
        .play-view .progress-area { width: 100%; max-width: 360px; display: flex; align-items: center; gap: 10px; }
        .play-view .progress-area input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; background: #aaa; border-radius: 2px; outline: none; }
        .play-view .progress-area input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #1a4a9f; cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .play-view .progress-area .time { font-size: 12px; color: #444; min-width: 40px; }
        .play-view .controls { display: flex; align-items: center; gap: 18px; margin-top: 12px; }
        .play-view .controls button { background: none; border: none; font-size: 28px; cursor: pointer; color: #333; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); backdrop-filter: blur(2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); touch-action: manipulation; }
        .play-view .controls .play-btn { font-size: 36px; background: #1a4a9f; color: #fff; box-shadow: 0 4px 12px rgba(26,74,159,0.4); }
        .play-view .volume-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; width: 100%; max-width: 200px; }
        .play-view .volume-row input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; background: #aaa; border-radius: 2px; outline: none; }
        .play-view .volume-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #1a4a9f; cursor: pointer; border: 1px solid #fff; }
        .list-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; background: #f5f0e8; padding: 10px 0; transition: opacity 0.3s; touch-action: auto; }
        .list-view.hidden { opacity: 0; pointer-events: none; }
        .list-view .song-item { display: flex; align-items: center; padding: 8px 20px; cursor: pointer; border-bottom: 1px solid #e0d8c8; touch-action: manipulation; }
        .list-view .song-item:hover { background: #e0d8c8; }
        .list-view .song-item.active { background: #c0d0e0; }
        .list-view .song-item .item-cover { width: 40px; height: 40px; border-radius: 4px; background: #ccc; background-size: cover; background-position: center; margin-right: 14px; flex-shrink: 0; border: 1px solid #bbb; }
        .list-view .song-item .item-info { flex: 1; overflow: hidden; }
        .list-view .song-item .item-info .item-title { font-weight: bold; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-view .song-item .item-info .item-artist { font-size: 12px; color: #666; }
        .list-view .song-item .item-duration { font-size: 12px; color: #888; }
        .player-toolbar { height: 40px; background: #ddd6c8; border-top: 1px solid #c0b8a8; display: flex; align-items: center; padding: 0 16px; gap: 16px; flex-shrink: 0; }
        .player-toolbar .tab-btn { background: none; border: none; padding: 4px 16px; cursor: pointer; font-size: 13px; border-radius: 4px; color: #444; font-weight: bold; touch-action: manipulation; }
        .player-toolbar .tab-btn.active { background: #1a4a9f; color: #fff; }
        .player-toolbar .song-counter { margin-left: auto; font-size: 12px; color: #666; }
        #hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; color: rgba(255,255,255,0.5); font-size: 14px; background: rgba(0,0,0,0.4); padding: 6px 18px; border-radius: 20px; pointer-events: none; transition: opacity 1s; font-family: sans-serif; }
        .list-view::-webkit-scrollbar { width: 8px; }
        .list-view::-webkit-scrollbar-thumb { background: #c0b8a8; border-radius: 4px; }
        .list-view::-webkit-scrollbar-track { background: #f0ebe0; }
    </style>
</head>
<body>

    <div id="three-container"></div>
    <div id="hint">🖱️ 点击电脑屏幕进入桌面 · 按 ESC 返回</div>

    <div id="desktop-overlay">
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="oc"><span class="icon-img">🧑‍🎤</span><span class="icon-label">我的 OC</span></div>
            <div class="desktop-icon" data-window="gallery"><span class="icon-img">🖼️</span><span class="icon-label">图库</span></div>
            <div class="desktop-icon" data-window="player"><span class="icon-img">🎵</span><span class="icon-label">千千静听</span></div>
            <div class="desktop-icon" data-window="about"><span class="icon-img">📄</span><span class="icon-label">关于</span></div>
            <div class="desktop-icon" data-window="trash"><span class="icon-img">🗑️</span><span class="icon-label">回收站</span></div>
        </div>

        <div class="taskbar">
            <div class="start-button" id="startBtn">🪟 开始</div>
            <div id="taskbar-items"></div>
            <div class="taskbar-time" id="taskbarTime">12:00</div>
        </div>

        <div class="start-menu" id="startMenu">
            <div class="start-menu-item" data-window="oc"><span class="item-icon">🧑‍🎤</span> 我的 OC</div>
            <div class="start-menu-item" data-window="gallery"><span class="item-icon">🖼️</span> 图库</div>
            <div class="start-menu-item" data-window="player"><span class="item-icon">🎵</span> 千千静听</div>
            <div class="start-menu-item" data-window="about"><span class="item-icon">📄</span> 关于</div>
            <div class="start-menu-item" data-window="trash"><span class="item-icon">🗑️</span> 回收站</div>
            <hr />
            <div class="start-menu-item" id="shutdownItem"><span class="item-icon">⏻</span> 返回房间</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ============================================================
        //  1. Three.js 场景（完整）
        // ============================================================
        import * as THREE from 'three';
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 4);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x404060, 0.8));
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        const screenLight = new THREE.PointLight(0x4488ff, 0.8);
        screenLight.position.set(0, 1.2, 1.8);
        scene.add(screenLight);
        const lampLight = new THREE.PointLight(0xffaa55, 0.5);
        lampLight.position.set(-0.8, 1.6, 0.5);
        scene.add(lampLight);

        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 地板
        const woodTex = (() => {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(90,70,50,${0.1+Math.random()*0.3})`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                const x = Math.random() * 256, y = Math.random() * 256;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(c);
        })();
        woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
        woodTex.repeat.set(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        roomGroup.add(floor);

        // 墙壁
        const wallTex = (() => {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#2a1f1a';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = `rgba(60,45,35,${0.2+Math.random()*0.3})`;
                ctx.fillRect(i*13, 0, 6, 256);
            }
            return new THREE.CanvasTexture(c);
        })();
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        wallTex.repeat.set(3, 2);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9, metalness: 0 });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        backWall.position.set(0, 1.25, -3);
        roomGroup.add(backWall);
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-3, 1.25, 0);
        roomGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(3, 1.25, 0);
        roomGroup.add(rightWall);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = 3;
        roomGroup.add(ceil);

        // 桌子
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.7, metalness: 0.1 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.8), tableMat);
        tableTop.position.set(0, 0.5, -0.6);
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        roomGroup.add(tableTop);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x3a281c, roughness: 0.8 });
        [[-0.6,-0.3],[0.6,-0.3],[-0.6,0.3],[0.6,0.3]].forEach(([x,z]) => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.45), legMat);
            leg.position.set(x, 0.25, -0.6 + z);
            leg.castShadow = true;
            roomGroup.add(leg);
        });

        // 显示器
        const monitorGroup = new THREE.Group();
        monitorGroup.position.set(0, 0.9, -0.3);
        roomGroup.add(monitorGroup);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.3 });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.15, 16), baseMat);
        base.position.y = -0.08;
        base.castShadow = true;
        monitorGroup.add(base);
        const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.2 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.5), shellMat);
        body.position.set(0, 0.3, 0);
        body.castShadow = true;
        monitorGroup.add(body);
        const backMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
        const backBump = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), backMat);
        backBump.position.set(0, 0.3, -0.28);
        backBump.scale.set(1, 0.85, 0.7);
        backBump.castShadow = true;
        monitorGroup.add(backBump);
        const bezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
        const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.06), bezelMat);
        bezel.position.set(0, 0.3, 0.28);
        monitorGroup.add(bezel);
        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x4488ff,
            emissive: 0x224488,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.0,
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), screenMat);
        screen.position.set(0, 0.3, 0.31);
        monitorGroup.add(screen);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            transparent: true,
            opacity: 0.08,
            roughness: 0.0,
            metalness: 0.9,
        });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), glassMat);
        glass.position.set(0, 0.3, 0.32);
        monitorGroup.add(glass);
        const clickTargets = [screen, glass, bezel];

        // 海报
        const posterColors = [[0x8b3a3a,-1.8,1.8,-2.9,0],[0x3a6b8b,1.8,2.0,-2.9,0],[0x6b8b3a,-2.9,1.5,-0.5,Math.PI/2],[0x8b6b3a,2.9,1.5,0.5,-Math.PI/2]];
        posterColors.forEach(([color,x,y,z,rotY]) => {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, side: THREE.DoubleSide });
            const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), mat);
            poster.position.set(x, y, z);
            poster.rotation.y = rotY || 0;
            roomGroup.add(poster);
        });
        const carpetMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
        const carpet = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0.3, -0.49, 0.2);
        roomGroup.add(carpet);

        let rotationY = 0;
        const maxRotation = 0.35;
        document.addEventListener('mousemove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        });
        document.addEventListener('touchmove', (e) => {
            if (document.getElementById('desktop-overlay').classList.contains('active')) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            rotationY = x * maxRotation;
            roomGroup.rotation.y = rotationY;
        }, { passive: true });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDesktopActive = false;

        function onPointerDown(event) {
            if (isDesktopActive) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (clientX === undefined) return;
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(clickTargets);
            if (intersects.length > 0) enterDesktop();
        }
        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });

        function enterDesktop() {
            isDesktopActive = true;
            document.getElementById('desktop-overlay').classList.add('active');
            document.getElementById('hint').style.opacity = '0';
            updateTime();
            setInterval(updateTime, 10000);
        }

        function exitDesktop() {
            isDesktopActive = false;
            document.getElementById('desktop-overlay').classList.remove('active');
            document.getElementById('hint').style.opacity = '1';
            document.querySelectorAll('.xp-window').forEach(w => w.remove());
            document.querySelectorAll('.taskbar-item').forEach(b => b.remove());
            window._windowInstances = {};
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isDesktopActive) exitDesktop();
        });
        document.getElementById('shutdownItem').addEventListener('click', exitDesktop);

        function updateTime() {
            const now = new Date();
            document.getElementById('taskbarTime').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        // 开始菜单
        const startBtn = document.getElementById('startBtn');
        const startMenu = document.getElementById('startMenu');
        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startMenu.classList.toggle('show'); });
        document.addEventListener('click', () => startMenu.classList.remove('show'));
        startMenu.addEventListener('click', (e) => e.stopPropagation());
        document.querySelectorAll('.start-menu-item[data-window]').forEach(item => {
            item.addEventListener('click', () => {
                createWindow(item.dataset.window);
                startMenu.classList.remove('show');
            });
        });
        document.querySelectorAll('.desktop-icon[data-window]').forEach(icon => {
            icon.addEventListener('click', () => createWindow(icon.dataset.window));
        });

        // ============================================================
        //  2. 窗口内容（其他窗口占位）
        // ============================================================
        const windowContents = {
            oc: { title: '🧑‍🎤 我的 OC', content: `<div style="padding:20px;"><h2>角色名称</h2><p>在这里填你的OC信息</p></div>` },
            gallery: { title: '🖼️ 图库', content: `<div style="padding:20px;"><p>图片占位</p></div>` },
            about: { title: '📄 关于', content: `<div style="padding:20px;"><p>复古XP风格页面，支持触摸拖动</p></div>` },
            trash: { title: '🗑️ 回收站', content: `<div style="padding:20px;"><p>空空如也～</p></div>` }
        };

        // ============================================================
        //  3. ★★★ 使用 file.garden 的歌曲链接（已验证可播）★★★
        // ============================================================
        // 注：这三首歌对应你之前的顺序：
        // 1. Richard O'Brien - Science Fiction/Double Feature
        // 2. Mindless Self Indulgence - Evening Wear
        // 3. My Chemical Romance - Helena
        const songList = [{
            title: 'Science Fiction/Double Feature',
            artist: 'Richard O\'Brien',
            cover: 'https://zora404.dpdns.org/file/1786612897827_IMG_5678.jpeg',
            url: 'https://file.garden/alBxX7nuWEQGozco/Richard%20O%27Brien%20-%20Science%20FictionDouble%20Feature.mp3'
        }, {
            title: 'Evening Wear',
            artist: 'Mindless Self Indulgence',
            cover: 'https://zora404.dpdns.org/file/1786612899785_IMG_5679.jpeg',
            url: 'https://file.garden/alBxX7nuWEQGozco/Mindless%20Self%20Indulgence%20-%20Evening%20Wear.mp3'
        }, {
            title: 'Helena',
            artist: 'My Chemical Romance',
            cover: 'https://zora404.dpdns.org/file/1786612894857_IMG_5680.jpeg',
            url: 'https://file.garden/alBxX7nuWEQGozco/My%20Chemical%20Romance%20-%20Helena.mp3'
        }];

        // ============================================================
        //  4. 窗口管理器 + 播放器（使用 audio 元素加载 file.garden 链接）
        // ============================================================
        let currentIndex = 0;
        let isPlaying = false;
        let audio = new Audio();
        audio.preload = 'metadata';
        audio.crossOrigin = 'anonymous';
        let isPlayerWindowOpen = false;
        let windowZIndex = 2000;
        window._windowInstances = window._windowInstances || {};

        // ---- 拖拽 ----
        function makeDraggable(element, handle) {
            let startX, startY, origLeft, origTop, isDragging = false;
            function onPointerDown(e) {
                if (e.target.closest('button')) return;
                if (e.button !== undefined && e.button !== 0 && e.pointerType !== 'touch') return;
                const rect = element.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                origLeft = rect.left; origTop = rect.top;
                isDragging = true;
                element.style.left = origLeft + 'px';
                element.style.top = origTop + 'px';
                element.style.transform = 'none';
                element.style.zIndex = ++windowZIndex;
                element.setPointerCapture(e.pointerId);
                e.preventDefault();
                element.addEventListener('pointermove', onPointerMove);
                element.addEventListener('pointerup', onPointerUp);
                element.addEventListener('pointercancel', onPointerUp);
            }
            function onPointerMove(e) {
                if (!isDragging) return;
                element.style.left = (origLeft + e.clientX - startX) + 'px';
                element.style.top = (origTop + e.clientY - startY) + 'px';
                e.preventDefault();
            }
            function onPointerUp(e) {
                if (isDragging) {
                    isDragging = false;
                    element.removeEventListener('pointermove', onPointerMove);
                    element.removeEventListener('pointerup', onPointerUp);
                    element.removeEventListener('pointercancel', onPointerUp);
                }
            }
            handle.addEventListener('pointerdown', onPointerDown);
        }

        function createWindow(id) {
            if (id === 'player') {
                createPlayerWindow();
                return;
            }
            if (window._windowInstances[id] && window._windowInstances[id].window) {
                const win = window._windowInstances[id].window;
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                if (window._windowInstances[id].taskbarBtn) {
                    window._windowInstances[id].taskbarBtn.remove();
                    window._windowInstances[id].taskbarBtn = null;
                }
                return;
            }
            const data = windowContents[id];
            if (!data) return;
            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = '460px';
            win.style.left = (120 + Math.random() * 60) + 'px';
            win.style.top = (80 + Math.random() * 60) + 'px';
            win.style.zIndex = ++windowZIndex;
            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">${data.title}</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);
            const body = document.createElement('div');
            body.className = 'window-body';
            body.style.padding = '16px 20px';
            body.innerHTML = data.content;
            win.appendChild(body);
            document.body.appendChild(win);
            window._windowInstances[id] = { window: win, taskbarBtn: null };
            makeDraggable(win, titlebar);
            titlebar.querySelector('.close-btn').addEventListener('pointerdown', (e) => { e.stopPropagation(); closeWindow(id); });
            titlebar.querySelector('.min-btn').addEventListener('pointerdown', (e) => { e.stopPropagation(); minimizeWindow(id); });
            win.addEventListener('pointerdown', () => { win.style.zIndex = ++windowZIndex; });
            win.addEventListener('DOMNodeRemoved', () => {
                if (window._windowInstances[id]) {
                    if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                    delete window._windowInstances[id];
                }
            });
        }

        function closeWindow(id) {
            if (window._windowInstances[id]) {
                const win = window._windowInstances[id].window;
                if (win) win.remove();
                if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                delete window._windowInstances[id];
                if (id === 'player') { isPlayerWindowOpen = false; audio.pause(); isPlaying = false; }
            }
        }

        function minimizeWindow(id) {
            const inst = window._windowInstances[id];
            if (!inst) return;
            const win = inst.window;
            if (!win) return;
            win.style.display = 'none';
            const taskbarItems = document.getElementById('taskbar-items');
            const btn = document.createElement('div');
            btn.className = 'taskbar-item';
            btn.dataset.windowId = id;
            const title = win.querySelector('.title-text')?.textContent || id;
            btn.textContent = title;
            btn.addEventListener('pointerdown', () => {
                win.style.display = 'flex';
                win.style.zIndex = ++windowZIndex;
                btn.remove();
                inst.taskbarBtn = null;
            });
            taskbarItems.appendChild(btn);
            inst.taskbarBtn = btn;
        }

        // ---- 播放器窗口 ----
        function createPlayerWindow() {
            if (isPlayerWindowOpen) {
                const inst = window._windowInstances['player'];
                if (inst && inst.window) {
                    inst.window.style.display = 'flex';
                    inst.window.style.zIndex = ++windowZIndex;
                    if (inst.taskbarBtn) {
                        inst.taskbarBtn.remove();
                        inst.taskbarBtn = null;
                    }
                }
                return;
            }

            const id = 'player';
            const win = document.createElement('div');
            win.className = 'xp-window';
            win.dataset.windowId = id;
            win.style.width = '520px';
            win.style.height = '480px';
            win.style.left = (100 + Math.random() * 80) + 'px';
            win.style.top = (60 + Math.random() * 80) + 'px';
            win.style.zIndex = ++windowZIndex;

            const titlebar = document.createElement('div');
            titlebar.className = 'window-titlebar';
            titlebar.innerHTML = `
                <span class="title-text">🎵 千千静听</span>
                <div class="win-btns">
                    <button class="min-btn">─</button>
                    <button class="max-btn">☐</button>
                    <button class="close-btn">✕</button>
                </div>
            `;
            win.appendChild(titlebar);

            const body = document.createElement('div');
            body.className = 'window-body';
            body.innerHTML = `
                <div class="player-container">
                    <div class="player-views">
                        <div class="play-view" id="playView">
                            <div class="cover" id="coverArt" style="background-image: url('${songList[currentIndex].cover || ''}');"></div>
                            <div class="song-info">
                                <div class="title" id="songTitle">${songList[currentIndex].title}</div>
                                <div class="artist" id="songArtist">${songList[currentIndex].artist}</div>
                            </div>
                            <div class="progress-area">
                                <span class="time" id="currentTime">0:00</span>
                                <input type="range" id="progressBar" value="0" step="0.1" />
                                <span class="time" id="totalTime">0:00</span>
                            </div>
                            <div class="controls">
                                <button id="prevBtn">⏮</button>
                                <button class="play-btn" id="playBtn">▶</button>
                                <button id="nextBtn">⏭</button>
                            </div>
                            <div class="volume-row">
                                <span style="font-size:16px;">🔊</span>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
                            </div>
                        </div>
                        <div class="list-view hidden" id="listView">
                            ${songList.map((song, idx) => `
                                <div class="song-item ${idx === currentIndex ? 'active' : ''}" data-index="${idx}">
                                    <div class="item-cover" style="background-image: url('${song.cover || ''}');"></div>
                                    <div class="item-info">
                                        <div class="item-title">${song.title}</div>
                                        <div class="item-artist">${song.artist}</div>
                                    </div>
                                    <div class="item-duration">--:--</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="player-toolbar">
                        <button class="tab-btn active" data-view="play">🎵 播放</button>
                        <button class="tab-btn" data-view="list">📋 列表</button>
                        <span class="song-counter">${songList.length} 首</span>
                    </div>
                </div>
            `;
            win.appendChild(body);

            document.body.appendChild(win);
            window._windowInstances[id] = { window: win, taskbarBtn: null };
            isPlayerWindowOpen = true;

            makeDraggable(win, titlebar);

            let isMaximized = false;
            const minBtn = titlebar.querySelector('.min-btn');
            const maxBtn = titlebar.querySelector('.max-btn');
            const closeBtn = titlebar.querySelector('.close-btn');

            minBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); minimizeWindow(id); });
            maxBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (!isMaximized) {
                    win._prevRect = win.getBoundingClientRect();
                    win.style.left = '0'; win.style.top = '0';
                    win.style.width = '100%'; win.style.height = '100%';
                    win.style.borderRadius = '0';
                    isMaximized = true;
                    maxBtn.textContent = '❐';
                } else {
                    const rect = win._prevRect || { left: 100, top: 60, width: 520, height: 480 };
                    win.style.left = rect.left + 'px'; win.style.top = rect.top + 'px';
                    win.style.width = rect.width + 'px'; win.style.height = rect.height + 'px';
                    win.style.borderRadius = '';
                    isMaximized = false;
                    maxBtn.textContent = '☐';
                }
            });
            closeBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                closeWindow(id);
                isPlayerWindowOpen = false;
                audio.pause();
                isPlaying = false;
            });
            win.addEventListener('pointerdown', () => { win.style.zIndex = ++windowZIndex; });

            // ---- 播放器逻辑 ----
            const playBtn = body.querySelector('#playBtn');
            const prevBtn = body.querySelector('#prevBtn');
            const nextBtn = body.querySelector('#nextBtn');
            const progressBar = body.querySelector('#progressBar');
            const volumeSlider = body.querySelector('#volumeSlider');
            const currentTimeEl = body.querySelector('#currentTime');
            const totalTimeEl = body.querySelector('#totalTime');
            const coverArt = body.querySelector('#coverArt');
            const songTitle = body.querySelector('#songTitle');
            const songArtist = body.querySelector('#songArtist');
            const listView = body.querySelector('#listView');
            const playView = body.querySelector('#playView');
            const tabBtns = body.querySelectorAll('.tab-btn');
            const songItems = body.querySelectorAll('.song-item');

            loadSong(currentIndex);

            function loadSong(index) {
                const song = songList[index];
                if (!song) {
                    console.error('歌曲数据缺失，索引:', index);
                    return;
                }
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                audio.src = song.url;
                audio.crossOrigin = 'anonymous';
                audio.load();
                coverArt.style.backgroundImage = `url('${song.cover || ''}')`;
                songTitle.textContent = song.title;
                songArtist.textContent = song.artist;
                songItems.forEach((item, i) => item.classList.toggle('active', i === index));
                progressBar.value = 0;
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';
                if (isPlaying) {
                    audio.play().catch((err) => console.warn('自动播放失败:', err));
                }
            }

            function playPause() {
                if (audio.paused) {
                    audio.play()
                        .then(() => {
                            console.log('✅ 播放成功');
                            isPlaying = true;
                            playBtn.textContent = '⏸';
                        })
                        .catch((err) => {
                            console.error('❌ 播放错误:', err);
                            alert('⚠️ 播放失败，请检查网络或换一首歌。');
                        });
                } else {
                    audio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                }
            }

            function prevSong() {
                currentIndex = (currentIndex - 1 + songList.length) % songList.length;
                loadSong(currentIndex);
                if (isPlaying) audio.play().catch(() => {});
            }

            function nextSong() {
                currentIndex = (currentIndex + 1) % songList.length;
                loadSong(currentIndex);
                if (isPlaying) audio.play().catch(() => {});
            }

            playBtn.addEventListener('click', playPause);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = percent;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            });
            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
                console.log('📦 歌曲时长:', audio.duration);
            });
            audio.addEventListener('error', (e) => {
                console.warn('⚠️ 音频加载错误:', e);
                setTimeout(() => { if (audio.src) audio.load(); }, 3000);
            });
            audio.addEventListener('ended', nextSong);

            progressBar.addEventListener('input', () => {
                if (audio.duration) {
                    const time = (progressBar.value / 100) * audio.duration;
                    audio.currentTime = time;
                }
            });
            volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
            audio.volume = volumeSlider.value;

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const view = btn.dataset.view;
                    if (view === 'play') {
                        playView.classList.remove('hidden');
                        listView.classList.add('hidden');
                    } else {
                        playView.classList.add('hidden');
                        listView.classList.remove('hidden');
                    }
                });
            });

            songItems.forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.index);
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        loadSong(currentIndex);
                        if (isPlaying) audio.play().catch(() => {});
                    }
                    tabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelector('.tab-btn[data-view="play"]').classList.add('active');
                    playView.classList.remove('hidden');
                    listView.classList.add('hidden');
                });
            });

            win.addEventListener('DOMNodeRemoved', () => {
                if (window._windowInstances[id]) {
                    if (window._windowInstances[id].taskbarBtn) window._windowInstances[id].taskbarBtn.remove();
                    delete window._windowInstances[id];
                }
                isPlayerWindowOpen = false;
                audio.pause();
                isPlaying = false;
            });
        }

        // ============================================================
        //  5. 响应式 & 动画
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        document.querySelectorAll('.desktop-icon, .taskbar-item, .start-menu-item').forEach(el => {
            el.addEventListener('dragstart', (e) => e.preventDefault());
        });

        console.log('🎵 已使用 file.garden 链接，这些文件在 Toyhouse 上已验证可播。');
    </script>
</body>
</html>
